name: KAIBO publish

# 管理ページで保存したとき（記事データやデザインが変わったとき）に、サイトだけを作り直す。
# Claudeは呼ばないので料金はかからない。
on:
  push:
    branches: [main]
    paths:
      - "data/posts.json"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: サイトを作る
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
