name: KAIBO rewrite

# 手動で動かす：古い型の記事を、新しい文章エンジンで書き直す。
# 書き直した記事は次から対象外なので、何度押しても二重には書き直さない。
# 書き直す前の文章は data/legacy.json に残る。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: ① 写真・動画を探す
        run: python scripts/images.py
      - name: ② 新しいエンジンで書き直す
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh.py
      - name: ③ サイトを作る
        run: python scripts/build.py
      - name: 記事データを保存
        run: |
          git config user.name "kaibo-bot"
          git config user.email "kaibo-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "refresh: rewrite with voice engine"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
