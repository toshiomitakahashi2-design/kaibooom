<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIBOOOM 広告解剖</title>
<meta name="description" content="すぐれた広告・クリエイティブ・デザインを、プロの目で解剖するメディア。">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#161616; --sub:#5C5A55; --body:#3A3833;
  --line:#E4E1DA; --chip-line:#D6D2C9; --invert-bg:#161616; --invert-ink:#F7F6F3;
  --accent:#E2462F; --accent-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --card:#1C1C1B; --ink:#F2F0EC; --sub:#A8A49C; --body:#D6D2CA;
    --line:#2C2B29; --chip-line:#3A3936; --invert-bg:#F2F0EC; --invert-ink:#121212;
    --accent:#E2462F; --accent-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1C1C1B; --ink:#F2F0EC; --sub:#A8A49C; --body:#D6D2CA;
  --line:#2C2B29; --chip-line:#3A3936; --invert-bg:#F2F0EC; --invert-ink:#121212;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px}
.logo{font-family:'Outfit',sans-serif;font-weight:600;font-size:30px;letter-spacing:.01em;line-height:1}
.logo .r{color:#E2462F}.logo .b{color:#2F6BFF}.logo .y{color:#E5A000}.logo .g{color:#2E9E5B}
.tag{font-size:11px;color:var(--sub);letter-spacing:.08em;margin-top:4px}
.chips{display:flex;gap:8px;padding:8px 16px 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--chip-line)}
.chip.on{background:var(--invert-bg);color:var(--invert-ink);border-color:var(--invert-bg)}
.hero{margin:0 16px 18px;border-radius:14px;background:var(--invert-bg);color:var(--invert-ink);overflow:hidden;display:block}
.hero .band{height:150px;background:var(--accent);display:flex;align-items:flex-end;justify-content:space-between;padding:14px}
.pill{font-size:12px;font-weight:700;background:#161616;color:#F7F6F3;padding:4px 10px;border-radius:99px}
.hero .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;color:#FFFFFF;line-height:1}
.hero .meta{padding:14px 16px 16px}
.hero .cat{font-size:11px;opacity:.75}
.hero .ttl{font-size:18px;font-weight:900;line-height:1.5;margin-top:4px}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 10px}
.sec b{font-size:15px;font-weight:900}
.sec small{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.tile{aspect-ratio:1/1;color:#FFFFFF;padding:10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile .n{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700}
.tile .t{font-size:12px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .c{font-size:10px;opacity:.8}
.tile,.cover,.hero .band{position:relative}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.05) 55%);z-index:0}
.tile>span,.cover>span,.hero .band>span{position:relative;z-index:1}
.has-img .t{display:none}
.credit-img{padding:6px 16px 0;font-size:11px;color:var(--sub)}
.empty{padding:40px 16px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
.nav button{height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--sub)}
.nav button.on{color:var(--ink);font-weight:700}
.bar{display:flex;align-items:center;gap:4px;padding:10px 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent}
.bar .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.cover{aspect-ratio:1/1;color:#FFFFFF;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.cover .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;line-height:1}
.cover .w{font-size:15px;font-weight:700;line-height:1.6}
.actions{display:flex;gap:8px;padding:12px 16px}
.go{flex-grow:1;min-height:44px;border-radius:10px;background:var(--invert-bg);color:var(--invert-ink);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:0 12px;text-align:center}
.save{width:44px;height:44px;border-radius:10px;border:1px solid var(--chip-line);background:var(--card);display:flex;align-items:center;justify-content:center}
.head{padding:8px 16px 0}
.head .k{font-size:12px;color:var(--sub);line-height:1.6}
.head h1{margin:6px 0 0;font-size:22px;font-weight:900;line-height:1.5}
.one{margin:18px 16px 0;padding:14px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.one small{font-size:11px;font-weight:700;letter-spacing:.1em}
.one p{margin:4px 0 0;font-size:16px;font-weight:700;line-height:1.6}
.steps{padding:24px 16px 0;display:flex;flex-direction:column;gap:16px}
.steps>b{font-size:15px;font-weight:900}
.step{display:flex;gap:12px}
.num{flex-shrink:0;width:32px;height:32px;border-radius:99px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px}
.step h3{margin:5px 0 4px;font-size:14px;font-weight:700}
.step p{margin:0;font-size:14px;line-height:1.85;color:var(--body)}
.box{margin:24px 16px 0;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.box b{font-size:15px;font-weight:900}
.box p{margin:8px 0 0;font-size:14px;line-height:1.85;color:var(--body)}
.task{margin:14px 16px 0;padding:16px;border-radius:12px;background:var(--invert-bg);color:var(--invert-ink)}
.task b{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.task p{margin:10px 0 0;font-size:14px;line-height:1.85}
.credit{margin:24px 16px 0;font-size:12px;color:var(--sub);line-height:1.9;border-top:1px solid var(--line);padding-top:14px}
.credit dt{float:left;width:6em;clear:left}
.credit dd{margin:0 0 0 6em}
.note{padding:18px 16px 8px;font-size:11px;color:var(--sub);line-height:1.7}
.nav-logo{display:none}
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:244px;border-top:0;border-right:1px solid var(--line)}
  .nav .in{display:flex;flex-direction:column;gap:4px;padding:28px 12px;max-width:none}
  .nav-logo{display:block;padding:8px 12px 32px}
  .nav-logo .logo{font-size:30px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:16px;height:52px;padding:0 12px;border-radius:10px;font-size:15px}
  .nav button:hover{background:var(--bg)}
  .app{max-width:none;margin:0 0 0 244px;padding:36px 40px 60px}
  .app>*{width:100%;max-width:935px;margin-left:auto;margin-right:auto}
  .top{display:none}
  .chips{padding:0 0 24px;flex-wrap:wrap}
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:0 auto 36px;border-radius:12px}
  .hero .band{height:auto;min-height:300px;padding:20px}
  .hero .meta{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:8px}
  .hero .cat{font-size:13px}
  .hero .ttl{font-size:26px;line-height:1.5}
  .hero .big{font-size:64px}
  .sec{padding:0 0 14px;border-top:1px solid var(--line);padding-top:20px}
  .grid{gap:4px}
  .tile{padding:16px}
  .tile .n{font-size:14px}
  .tile .t{font-size:16px}
  .tile .c{font-size:12px}
  .bar{position:static;padding:0 0 12px}
  .pw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);align-items:start}
  .pl{position:sticky;top:0}
  .pl .credit-img{padding:8px 16px 12px}
  .pr{padding:8px 0 16px;border-left:1px solid var(--line)}
  .pr .one,.pr .box,.pr .task{margin-left:20px;margin-right:20px}
  .pr .actions,.pr .head,.pr .steps,.pr .note{padding-left:20px;padding-right:20px}
  .pr .credit{margin-left:20px;margin-right:20px}
  .pr .box{background:var(--bg)}
}
</style>
</head>

d", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/kodansha-media-conf2026_media-awards2026_ceremony_ogp.jpg"}, {"category": "広告", "title": "ピザーラのDr.STONE広告は、なぜ謝罪に至ったのか。", "work": "ピザーラ×「Dr.STONE」コラボ企画（TikTok広告）", "client": "フォーシーズ（ピザーラ）", "agency": "—", "production": "—", "award": "—", "oneliner": "便利な自動化が、IPの信頼を壊した反面教師", "steps": [{"title": "課題", "body": "ピザーラは10月1日〜11月1日にDr.STONEとコラボ企画を展開し、限定ピザや描き下ろしイラスト付きグッズを販売した。ところが10月末ごろ、TikTok広告がAI生成のようだと疑問視され、許諾を問う声も上がった。"}, {"title": "狙い", "body": "コラボの狙いは、作品ファンに「世界観ごと楽しめるピザ」を届けることだと読める。限定ピザに作品を連想させる名前をつけ、描き下ろしも用意したのは、ファンの「好き」に寄り添う設計だ。"}, {"title": "表現のしかけ", "body": "今回の本質は、表現の巧拙より配信設定にある。同社の説明では、TikTok広告のAI自動生成・配信機能を意図せず有効にしたまま設定を完了し、製作委員会の監修や許諾を受けていない動画が配信された。動画の中身は記事では詳しく語られていない。ただ、商品や描き下ろしは丁寧に作り込んだのに、広告だけ自動生成に任せたことで、ファンが期待する世界観の一貫性が崩れたと考えられる。"}], "steal": "制作物だけでなく、配信設定まで含めて「作品」と考える。公開前に、自動生成や自動最適化のオン・オフを確認項目に入れておこう。", "challenge": "好きなアニメとのコラボ広告を想定し、公開前に確認すべき項目を10個のチェックリストにまとめてみよう。", "slug": "pm-20261106-article563310-utm-source-feed", "no": 7, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563310/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/pizzala-drstone_ogp.jpg"}, {"category": "映像", "title": "VENEXの「買わせない男」は、なぜ「買わないで」と言うのか。", "work": "VENEX 新テレビCM「買わせない男」篇（30秒）", "client": "ベネクス", "agency": "—", "production": "—", "award": "—", "oneliner": "買うなと言うことで、商品への自信を示す逆説", "steps": [{"title": "課題", "body": "記事によれば、リカバリーウェア市場では競合が増え、消費者の選択肢が広がっている。「いい商品です」と言うだけでは他社に埋もれてしまう。比較されることを前提に、どう選ばれるかが問われていた。"}, {"title": "狙い", "body": "対象は、リカバリーウェアを検討中でまだ決めきれていない人。「衝動買いはよくない」と寄り添って警戒心を下げ、じっくり比べてから選んでほしいと伝える。納得感と信頼を得ることが狙いだったと読める。"}, {"title": "表現のしかけ", "body": "冒頭でホイッスルとSTOPのアイコンを出し、「買わないで」という予想外の一言で視聴者の足を止める。続く「衝動買いはよくない」は正論なので反発されにくい。本田らしい「伸びしろ」という言葉で比較へ促し、最後にPHT繊維とブランド名で締める。本田自身は対談で、通常と逆の発想だからこそ商品への自信が伝わると受け止めたと明かしている。"}], "steal": "常識と逆のことを最初に言って足を止め、すぐに納得できる理由と本命の情報を続ける。「やめて」から入る型は、作品への自信を見せたいときに使える。", "challenge": "自分の好きな商品を一つ選び、「買わないで」から始まる15秒のCM台本を書こう。最後には、買う理由がちゃんと残る構成にすること。", "slug": "pm-20261105-article563192-utm-source-feed", "no": 8, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563192/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/venex01.jpg"}, {"category": "SNS", "title": "ホワイトハウスのゼルダ風動画は、なぜ物議を醸すのか。", "work": "THE LEGEND OF TRUMP: MAKE AMERICA GREAT AGAIN(公式X投稿の44秒動画)", "client": "米ホワイトハウス", "agency": "—", "production": "—", "award": "—", "oneliner": "人気ゲームの文法で、政策を“発見”に変えた", "steps": [{"title": "課題", "body": "記事は課題を明示していない。ただ、薬価や治安といった実績は数字が多く、文字だけで出すとSNSでは流れて読まれにくい。そこで注目が集まる日に重ね、短い動画で最後まで見せる必要があったと考えられる。"}, {"title": "狙い", "body": "記事によると、投稿は人気ゲームのリメイク発売日に合わせたものとみられる。ゲームに親しむ層に、政権の実績を「楽しい話題」として届けたかったのだろう(これは私の解釈)。一方で批判も相次ぎ、全員の共感を狙った形ではない。"}, {"title": "表現のしかけ", "body": "記事によれば、動画はタイトル画面から始まり、ローポリ調の主人公、体力ゲージ、剣のアイコン、地図など、ゲームらしい画面で統一されている。効いているのは、アイテムを見つけた時のメッセージの形式を実績の紹介に使った点だ。「数字の主張」が「お宝を手に入れた瞬間」に見え、ゲームを知る人ほど先が気になる。投稿文に有名なセリフを置く入口づくりも巧い。"}], "steal": "伝えたい情報を、誰もが知る形式のお約束(メッセージ枠や画面表示)に流し込む。ただし他社のキャラや作品は無断で借りず、形式だけ借りる。", "challenge": "学食の新メニュー紹介を、RPGのアイテム入手画面風に15秒の絵コンテにする。キャラクターは自作のものに限る。", "slug": "pm-20261106-article563322-utm-source-feed", "no": 9, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563322/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/the-white-house_official-x_remake_the-legend-of-zelda_ogp1.jpg"}, {"category": "体験", "title": "ケルヒャーの渋谷洗浄アートは、なぜ話題になるのか。", "work": "「渋谷を洗ってます」アクション（洗伝プロジェクト）／「洗キュー！寄せ書き」", "client": "ケルヒャー ジャパン", "agency": "—", "production": "—", "award": "—", "oneliner": "掃除そのものを街の作品に変えた", "steps": [{"title": "課題", "body": "高圧洗浄機は「汚れが落ちる」ことが当たり前の商品で、機能を語るだけでは差がつきにくい。掃除という地味な行為を、どうすれば楽しく、見てもらえる話題にできるかが問われていたと考えられる。"}, {"title": "狙い", "body": "記事によれば狙いは「楽しくきれいに」のアピール。街を歩く人や渋谷を愛する人に、掃除への親しみを持ってもらう。さらに閉店するハンズへの感謝に参加者を巻き込み、ブランドへの好意につなげようとしたと読める。"}, {"title": "表現のしかけ", "body": "足跡の形に抜いたパネルに水を当てて汚れを落とし、跡を絵にする。商品の機能がそのまま表現になっている。ハチ公が駅から宮下公園まで散歩したという物語を足跡でつなぎ、歩く人が見つけたくなる仕掛けにした。ハンズでは他の商業施設などから寄せられたメッセージを使い、感謝を街に残した。場所の文脈に合わせた絵や文字が、写真に撮って共有したくなる理由になっている。"}], "steal": "商品の機能そのものを表現の手段にする。そこに「ハチ公の散歩」のような短い物語と、場所の文脈を重ねると、見た人が語りたくなる。", "challenge": "消しゴムや付箋など身近な文房具の機能を使い、学校の一角で「機能がそのまま表現になる」小さな作品を1つ企画しよう。", "slug": "pm-20261105-article563157-utm-source-feed", "no": 10, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563157/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/karcher_proj_shibuya_hachiko-paw-prints_thx-hands_ogp.jpg"}, {"category": "映像", "title": "THE DRYのCMは、なぜ猪木の「ダァー」を叫ぶのか。", "work": "THE DRY 新テレビCM『登場』篇(30秒)", "client": "サントリー", "agency": "—", "production": "—", "award": "—", "oneliner": "ノドの刺激を、猪木の叫びで音にした", "steps": [{"title": "課題", "body": "新ブランドTHE DRYは、高密度・強炭酸でノドへの刺激とキレが売り。担当者によれば、オリエンのお題は「ノドのうなり」をどう表現すれば一番インパクトをもって伝わるか。ビールの「くぅーっ！」に並ぶ、新しい“のどごしの音”が求められた。"}, {"title": "狙い", "body": "ターゲットは40代の大人たち。担当者によれば、大変な時代を生きる彼らを元気づけ、背中を押すチューハイを目指した。1日を戦い抜いた自分をねぎらう「報酬感」を、生き方がカッコいい大人として起用した坂口憲二さんに重ねている。"}, {"title": "表現のしかけ", "body": "強炭酸でノドが開くと「アァァー」に近い声が出る。その最上級が「ダァー」だと考えた、と担当者は語る。暗い空間、猪木さんのテーマ曲、タオルを首にかける所作で飲む前に期待を溜め、最後の叫びで一気に解放する構成だ。さらに、坂口さんは猪木さんの盟友・坂口征二さんの次男。この背景がファンの心にも響くと狙っている。"}], "steal": "商品の特長を「音・声」に置き換え、誰もが知る掛け声と結びつける。新しい言葉を作るより、みんなの記憶にある言葉を借りるほうが一瞬で伝わる。", "challenge": "好きな飲み物や食べ物を口にした瞬間の感覚を擬音1つで表し、有名な掛け声や決めゼリフと組み合わせた15秒CMの絵コンテを描く。", "slug": "pm-20261104-article563101-utm-source-feed", "no": 11, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261104/article563101/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/suntory_the-dry_cm_sns_ogp.jpg"}, {"category": "体験", "title": "Silent Voice Cardは、なぜ上司の想像力を動かすのか。", "work": "Silent Voice Card（ワークショップ用カード型ツール）", "client": "Twinkle Wave（電通社内のベビーロス啓発プロジェクト）", "agency": "—", "production": "—", "award": "—", "oneliner": "シールを剥がすと本音が見えるカード", "steps": [{"title": "課題", "body": "登壇者によれば、働く女性の5人に1人が流産を経験するとされる。それでも妊娠を伝える前に起きることが多く、職場では見えにくい。「元気そう」に見えても本人は悲しみの中にいて、理解不足が孤立や離職につながっていた。"}, {"title": "狙い", "body": "上司や同僚の立場にいる人に、当事者の「見えない困難」を知識ではなく体感として届けること。「何と声をかければいいかわからない」という戸惑いを、「いっしょに考えていきましょう」と言える最初の一歩に変えようとした。"}, {"title": "表現のしかけ", "body": "カードの表には、当事者が上司に伝える短い一言だけが書かれている。参加者は「自分が上司ならどう感じるか」を考えてから、シールを剥がす。すると言葉の裏にある本音が現れる。講演で語られた「見えているものと見えていないもののギャップ」を、剥がす動作に置き換えた構造だと読める。裏面には推奨される声かけ例と空欄があり、気づいた後に自分の言葉で書く流れまでつながっている。"}], "steal": "伝えたい問題を、順番で体験させる。表に建前、シールの下に本音を置けば、「めくる」動作そのものが気づきになる。説明より先に体験を置く発想はマネできる。", "challenge": "「大丈夫です」と言ってしまいがちな場面を1つ選び、表に建前、シールの下に本音を書いたカードを3枚作ってみよう。", "slug": "phttps-dentsu-ho-com-articles-9906", "no": 12, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9906", "status": "published", "image": "https://cdn.dentsu-ho.com/408ff208-7596-4f3f-b2c1-807e40740b9c/OGP%EF%BC%9A1200%C3%97630.jpg"}, {"category": "広告", "title": "「フレー！フレー！就活生」は、なぜ街が語るのか。", "work": "フレー！フレー！就活生", "client": "三菱地所", "agency": "電通", "production": "電通クリエイティブピクチャーズ", "award": "Spotify Hits Japan 2026 グランプリ「Spotify Mic Drop」", "oneliner": "街の声で、面接前の不安に寄り添う音声広告", "steps": [{"title": "課題", "body": "記事に課題の明記はないが、就活生にとって面接前は不安が大きい時間だ。三菱地所には、丸の内という街を売り込みではなく就活生の味方として感じてもらう方法が求められたと読める。"}, {"title": "狙い", "body": "面接前の不安をやわらげようと音楽を聴く就活生に着目した。その一人きりの時間に、丸の内の街が「見守ってきた存在」として声をかけ、応援されていると実感してもらうことを狙ったと考えられる。"}, {"title": "表現のしかけ", "body": "音声広告は、就活経験者や社員の実体験をもとに、多くの就活生を見守ってきた街の視点でメッセージを発信した。語り手が企業ではなく街なので、押しつけがましくならず、そっと寄り添う声になる。さらに屋外広告やカフェの就活生割と連動させ、聴く・見る・過ごすの3場面で同じ応援に出会える設計にした。"}], "steal": "語り手を企業ではなく「街」に変え、相手の行動（聴く・歩く・休む）に合わせて同じメッセージを重ねる。実体験を素材にすると言葉に説得力が出る。", "challenge": "自分の大学の最寄り駅を語り手にして、試験前の学生に向けた30秒の音声広告の台本と、駅に貼るポスター案を作る。", "slug": "pm-20261106-article563296-utm-source-feed", "no": 13, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563296/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/spotif_hits-japan2016_award-ceremony_ogp.jpg"}, {"category": "体験", "title": "みらいのたまごは、なぜAIの答えを隠すのか。", "work": "みらいのたまご（AIうえおラボ × PLAY! PARK 体験型イベント）", "client": "PLAY! PARK（電通 AIうえおラボと共同開催）", "agency": "電通（AIうえおラボ）", "production": "—", "award": "—", "oneliner": "答えを出さないAIが、子どもの想像力を引き出す", "steps": [{"title": "課題", "body": "生成AIで誰もがすぐ答えにたどり着ける時代になった。子どもにはアナログな体験をさせたいが、AIと無縁では生きられない。PLAY! PARK側も当初、AIを「正解を与えるもの」と見て、遊びの方針と合わないと感じていた。"}, {"title": "狙い", "body": "対象は子どもと保護者。AIが正解を教えるのではなく、子どもが自分なりの答えを見つけ、想像をふくらませる気持ちを動かすのが狙い。「このたまごには何がいるの？」という子どもの素朴な問いを、そのまま遊びにした。"}, {"title": "表現のしかけ", "body": "子どもが「ころころ」「もふもふ」などの素材をたまごに貼ると、天井のカメラが割合を読み取り、AIが30種の生き物の声をもとに鳴き声を合成する。組み合わせは約300万通り。どの生き物とも断定できない余白のある音にし、怖すぎる音は手作業で調整した。スピーカーはたまごの奥に埋め込み、PCやモニターは見えないよう隠して、AIを意識させない体験に仕上げている。"}], "steal": "「答えを出さない」ことを設計する。あえて正体をぼかし、受け手に解釈をゆだねる。そのぶん音の強さや置き場所など細部は手を動かして磨き込む。", "challenge": "身近な物を1つ選び、正体が一目でわからない「音」か「におい」だけで紹介する企画を作り、友人3人の想像を聞き比べる。", "slug": "phttps-dentsu-ho-com-articles-9898", "no": 14, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9898", "status": "published", "image": "https://cdn.dentsu-ho.com/c2de385c-462a-4806-89fd-0a4953c56077/ai-ueo-lab_ogp.jpg"}, {"category": "広告", "title": "XShelterは、なぜ松岡昌宏を初のタレントに選んだのか。", "work": "ワークマン「XShelter」松岡昌宏起用の新テレビCM（11月6日放映開始）", "client": "ワークマン", "agency": "—", "production": "—", "award": "—", "oneliner": "暮らしが商品の機能そのものの人を起用", "steps": [{"title": "課題", "body": "XShelterは2024年の発売以来、累計450万着を超えたヒット商品。ただ需要に生産が追いつかず品薄が続き、タレントを使った大きな広告展開には踏み出せない状況だった。"}, {"title": "狙い", "body": "生産体制が整い、初めてタレントを起用。CMは、寒い屋外から暖かい室内へ移るときの不快感を減らす「快適断熱Σ」を訴求する。寒暖差のある日常で「自分にも必要だ」と思わせる狙いと読める。"}, {"title": "表現のしかけ", "body": "効いているのは映像より先に、人選の設計だ。記事によれば、札幌出身で北海道と東京の2拠点生活を送る松岡昌宏を、気候差のある土地を行き来する商品特性の体現者として選んだ。機能を言葉で説明する前に、その人の暮らしが機能の証明になる。なおCMの具体的な映像や台詞は、この記事の範囲では確認できない。"}], "steal": "機能を説明する前に、その機能が生活の事実として重なる人を探す。知名度より「暮らしと商品の特徴が一致しているか」で起用を決めると、説得力が出る。", "challenge": "身近な商品を1つ選び、その特徴を生活で体現している人を3人考えて、起用理由を1行ずつ書いてみよう。", "slug": "pm-20261105-article563143-utm-source-feed", "no": 15, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563143/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/workman_xshelter_masahiro-matsuoka_cm_ogp.jpg"}, {"category": "体験", "title": "Alexa for Shoppingは、なぜメッセージで買い物させるのか。", "work": "Alexa for Shopping のテキスト機能(招待制パイロット)", "client": "Amazon", "agency": "—", "production": "—", "award": "—", "oneliner": "メモや会話の流れに買い物を溶かす", "steps": [{"title": "課題", "body": "本文に課題の明記はありません。私の読みでは、買い物AIは「アプリを開いて話しかける」手間があり、欲しいと思った瞬間はメモやチャットなど別の場所にいる、というズレが壁だったはずです。"}, {"title": "狙い", "body": "Amazonのラジブ・メータ氏は声明で、人は必要なものを思いついた瞬間にメモやメッセージ、グループチャットへ書き留めると述べています。その「思いついた瞬間」を逃さず、書いた流れのまま買い物へつなげる狙いと読めます。"}, {"title": "表現のしかけ", "body": "新しい画面を覚えさせず、いつものメッセージ欄を入口にしたのが要点です。招待もテキストで届きます。商品探し、カート作成、購入、配送連絡までが一本の会話で完結します。広告もこの会話内で試され、当初は掲載料を取らないと報じられています。広告の見せ方の詳細は本文では不明です。"}], "steal": "新しい場所に人を呼ぶ前に、相手が今すでに言葉を書いている場所を探す。入口を相手の習慣に合わせると、使う手間が一気に減ります。", "challenge": "学食や図書館など身近なサービスを1つ選び、LINEのトーク画面だけで完結する利用の流れを5コマで描いてみよう。", "slug": "pg-customers-text-its-shopping-assistant", "no": 16, "date": "2026-11-07", "source_name": "Adweek", "source_url": "https://www.adweek.com/commerce/amazon-is-letting-customers-text-its-shopping-assistant/", "status": "published", "image": "https://static-www.adweek.com/wp-content/uploads/2026/11/iMessage.jpg?w=600&h=315&crop=1"}]</script>
<script>
const POSTS = JSON.parse(document.getElementById('data').textContent).sort((a,b)=>b.no-a.no);
const COLORS = {'映像':'#2F4858','SNS':'#8C3B2E','ブランディング':'#3E5C3A','体験':'#5A4A78','広告':'#1F1F1F','コピー':'#8A5410','パッケージ':'#6B3F5C','デザイン':'#2E5266','ロゴ':'#4A4A3A'};
const color = c => COLORS[c] || '#3D3D3D';
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const no3 = n => 'No.' + String(n).padStart(3,'0');
let saved = [];
try { saved = JSON.parse(localStorage.getItem('kaibo-saved') || '[]'); } catch(e) {}
const persist = () => { try { localStorage.setItem('kaibo-saved', JSON.stringify(saved)); } catch(e) {} };
let cat = 'すべて';
const app = document.getElementById('app');
const img = p => p.image ? `<img class="ph" src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : '';
const hi = p => p.image ? ' has-img' : '';
const bm = on => `<svg width="20" height="20" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;

function tiles(list){
  if(!list.length) return '<div class="empty">まだここには記事がありません。<br>気になる記事を保存してみよう。</div>';
  return '<div class="grid">' + list.map(p=>`<a class="tile${hi(p)}" href="#/p/${esc(p.slug)}" style="background:${color(p.category)}">${img(p)}<span class="n">${no3(p.no)}</span><span class="t">${esc(p.oneliner)}</span><span class="c">${esc(p.category)}</span></a>`).join('') + '</div>';
}

function home(mode){
  const cats = ['すべて', ...new Set(POSTS.map(p=>p.category))];
  const top = `<header class="top"><div><div class="logo" aria-label="KAIBOOOM"><span class="b">K</span><span class="r">A</span><span class="y">I</span><span class="b">B</span><span class="g">O</span><span class="r">O</span><span class="y">O</span><span class="g">M</span></div><div class="tag">広告を、解剖する。</div></div></header>`;
  if(mode==='saved'){
    const list = POSTS.filter(p=>saved.includes(p.slug));
    app.innerHTML = top + `<div class="sec"><b>保存した解剖</b><small>${list.length} 本</small></div>` + tiles(list);
    return;
  }
  const list = POSTS.filter(p=>cat==='すべて'||p.category===cat);
  const f = POSTS[0];
  app.innerHTML = top +
    `<div class="chips" role="group" aria-label="カテゴリ">${cats.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('')}</div>` +
    (cat==='すべて' && f ? `<a class="hero" href="#/p/${esc(f.slug)}"><div class="band${hi(f)}">${img(f)}<span class="pill">今週の解剖</span><span class="big">${no3(f.no).replace('No.','')}</span></div><div class="meta"><div class="cat">${esc(f.category)} ／ ${esc(f.client)}</div><div class="ttl">${esc(f.title)}</div></div></a>` : '') +
    `<div class="sec"><b>${cat==='すべて'?'新着の解剖':esc(cat)}</b><small>全 ${list.length} 本</small></div>` + tiles(list);
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;home();});
}

function post(slug){
  const p = POSTS.find(x=>x.slug===slug);
  if(!p){ location.hash=''; return; }
  const on = saved.includes(p.slug);
  app.innerHTML =
    `<div class="bar"><button class="back" aria-label="フィードに戻る" onclick="history.length>1?history.back():location.hash=''"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="n">${no3(p.no)}</span></div>` +
    `<div class="pw"><div class="pl"><div class="cover${hi(p)}" style="background:${color(p.category)}">${img(p)}<span class="big">${no3(p.no).replace('No.','')}</span><span class="w">${esc(p.work)}</span></div>` +
    (p.image ? `<div class="credit-img">画像：<a href="${esc(p.source_url)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(p.source_name)}</a>より</div>` : '') +
    `</div><div class="pr"><div class="actions"><a class="go" href="${esc(p.source_url)}" target="_blank" rel="noopener">作品の紹介記事を見る <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a><button class="save" id="save" aria-label="保存" aria-pressed="${on}">${bm(on)}</button></div>` +
    `<div class="head"><div class="k">${esc(p.category)} ／ ${esc(p.client)}</div><h1>${esc(p.title)}</h1></div>` +
    `<div class="one"><small>ひとことで言うと</small><p>${esc(p.oneliner)}</p></div>` +
    `<div class="steps"><b>解剖</b>${p.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div></div>`).join('')}</div>` +
    `<div class="box"><b>ここを盗め</b><p>${esc(p.steal)}</p></div>` +
    `<div class="task"><b><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>やってみよう</b><p>${esc(p.challenge)}</p></div>` +
    `<dl class="credit"><dt>作品</dt><dd>${esc(p.work)}</dd><dt>広告主</dt><dd>${esc(p.client)}</dd><dt>広告会社</dt><dd>${esc(p.agency)}</dd><dt>制作</dt><dd>${esc(p.production)}</dd><dt>受賞</dt><dd>${esc(p.award)}</dd><dt>出典</dt><dd><a href="${esc(p.source_url)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(p.source_name)}</a></dd></dl>` +
    `<div class="note">作品の著作権は各権利者に帰属します。本記事は批評・解説を目的としています。</div></div></div>`;
  document.getElementById('save').onclick = () => {
    saved = saved.includes(p.slug) ? saved.filter(s=>s!==p.slug) : [...saved, p.slug];
    persist(); post(slug);
  };
  window.scrollTo(0,0);
}

let mode = 'home';
function route(){
  const m = location.hash.match(/^#\/p\/(.+)$/);
  if(m) post(decodeURIComponent(m[1])); else home(mode);
  document.getElementById('nav-home').classList.toggle('on', !m && mode==='home');
  document.getElementById('nav-saved').classList.toggle('on', !m && mode==='saved');
}
document.getElementById('nav-home').onclick = () => { mode='home'; location.hash=''; route(); window.scrollTo(0,0); };
document.getElementById('nav-saved').onclick = () => { mode='saved'; location.hash=''; route(); window.scrollTo(0,0); };
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
