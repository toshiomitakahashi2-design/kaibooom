<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- しばらく検索に出さない。出すときはこの行を消す -->
<meta name="robots" content="noindex, nofollow">
<title>KAIBOOOM 広告解剖</title>
<meta name="description" content="すぐれた広告・クリエイティブ・デザインを、プロの目で解剖するメディア。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000; --body:#2B2B2B; --sub:#707070; --line:#E8E8E8; --soft:#F4F4F4;
  --cut:#2742E8; --cut-ink:#FFFFFF; --overlay:rgba(0,0,0,.42);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F0F0F; --ink:#F5F5F5; --body:#D4D4D4; --sub:#9A9A9A; --line:#262626; --soft:#1A1A1A;
    --cut:#6E82FF; --cut-ink:#0F0F0F; --overlay:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#0F0F0F; --ink:#F5F5F5; --body:#D4D4D4; --sub:#9A9A9A; --line:#262626; --soft:#1A1A1A;
  --cut:#6E82FF; --cut-ink:#0F0F0F; --overlay:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cut);outline-offset:2px;border-radius:6px}
img{display:block;max-width:100%}

/* ---------- ロゴ：メスで切った KAIBOOOM ---------- */
.logo{position:relative;display:inline-block;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1;color:var(--ink);white-space:nowrap}
.logo>span{display:block}
.logo .lt{clip-path:inset(0 0 50% 0)}
.logo .lb{position:absolute;inset:0;clip-path:inset(50% 0 0 0);transform:translateX(4px)}
.logo::after{content:"";position:absolute;left:-3px;right:-6px;top:50%;height:1.5px;margin-top:-.75px;background:var(--cut)}
.logo.big{font-size:44px}
.logo.big .lb{transform:translateX(6px)}
.logo.big::after{height:2px;margin-top:-1px;left:-8px;right:-14px}

/* ---------- ヘッダー（小さめ・固定） ---------- */
.hd{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1680px;margin:0 auto;height:52px;padding:0 16px;display:flex;align-items:center;gap:18px}
.tagline{font-size:12px;color:var(--sub);display:none}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;height:32px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--sub)}
.cat:hover{color:var(--ink);background:var(--soft)}
.cat.on{background:var(--ink);color:var(--paper)}
.tools{display:flex;gap:2px;margin-left:auto;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib.on{color:var(--cut)}
.cats-m{display:flex;padding:0 12px 8px}
.hd-in .cats{display:none}
@media (min-width:760px){
  .tagline{display:block}
  .cats-m{display:none}
  .hd-in .cats{display:flex}
  .hd-in{padding:0 24px}
}

/* ---------- ピンタレスト風グリッド ---------- */
main{max-width:1680px;margin:0 auto;padding:16px 10px 64px}
@media (min-width:760px){main{padding:24px 24px 80px}}
.lead{display:flex;align-items:baseline;gap:12px;padding:4px 4px 16px}
.lead h1{margin:0;font-family:'Zen Old Mincho',serif;font-size:20px;font-weight:700}
.lead small{font-size:12px;color:var(--sub)}
.mason{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}
@media (min-width:720px){.mason{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 16px}}
@media (min-width:1100px){.mason{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1480px){.mason{grid-template-columns:repeat(5,minmax(0,1fr))}}
.pin{display:block;min-width:0}
.pin .ph{position:relative;border-radius:14px;overflow:hidden;background:var(--soft);aspect-ratio:1200/630}
.pin .ph img{width:100%;height:100%;object-fit:cover}
.pin .ph::after{content:"";position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity .15s}
.pin:hover .ph::after{opacity:1}
.pin .no{position:absolute;left:10px;top:10px;z-index:1;font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:11px;color:#fff;opacity:0;transition:opacity .15s}
.pin:hover .no{opacity:1}
.pin .vid{position:absolute;right:10px;bottom:10px;z-index:1;width:28px;height:28px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.pin .txt{display:none;position:absolute;inset:0;padding:14px;align-items:flex-end;font-family:'Zen Old Mincho',serif;font-size:15px;font-weight:700;line-height:1.5;color:#fff}
.pin .ph.noimg .txt{display:flex}
.pin .ph.noimg::after{display:none}
.pin .t{margin:8px 4px 0;font-size:13.5px;font-weight:700;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em}
.pin .m{margin:3px 4px 0;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.pin .ph::after,.pin .no{transition:none}}
.empty{padding:72px 16px;text-align:center;color:var(--sub);line-height:1.9}

/* ---------- 記事ページ ---------- */
.art{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding:0 0 14px}
.bar .n{font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:13px;color:var(--sub)}
.bar .sp{flex:1}
.wrap{display:grid;gap:28px}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:start}.media{position:sticky;top:76px}}
.media{display:flex;flex-direction:column;gap:12px}
.cover{border-radius:18px;overflow:hidden;background:var(--soft)}
.cover img{width:100%;height:auto}
.cover.noimg{aspect-ratio:4/3;display:flex;align-items:flex-end;padding:24px;color:#fff;font-family:'Zen Old Mincho',serif;font-size:22px;font-weight:700;line-height:1.6}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gal a{border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:4/3}
.gal img{width:100%;height:100%;object-fit:cover}
.credit-img{font-size:11.5px;color:var(--sub)}
.credit-img a{text-decoration:underline}
.txtcol{max-width:600px}
.k{font-size:12.5px;color:var(--sub);line-height:1.7}
.txtcol h1{margin:8px 0 0;font-family:'Zen Old Mincho',serif;font-weight:700;font-size:25px;line-height:1.55;letter-spacing:.01em}
@media (min-width:900px){.txtcol h1{font-size:30px}}
.one{margin:16px 0 0;font-size:16px;font-weight:700;line-height:1.75;padding-left:14px;border-left:2px solid var(--cut)}
.about{margin:28px 0 0;padding:18px 20px;border-radius:14px;background:var(--soft)}
.about h2,.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--sub)}
.about p{margin:8px 0 0;font-size:15px;line-height:1.95;color:var(--body)}
.sec{margin-top:32px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:22px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.step .num{font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:14px;color:var(--cut);padding-top:2px}
.step h3{margin:0 0 4px;font-size:15px;font-weight:700}
.step p{margin:0;font-size:15px;line-height:1.95;color:var(--body)}
.pts p{margin:12px 0 0;font-size:15.5px;line-height:2.05;color:var(--body)}
.pts p:first-of-type{margin-top:10px}
.pts-edit{margin:10px 0 0;font-size:15.5px;line-height:2.05;color:var(--body);white-space:pre-wrap}
.steal p{margin:8px 0 0;font-family:'Zen Old Mincho',serif;font-size:17px;font-weight:700;line-height:1.85}
.task{margin-top:28px;padding:18px 20px;border-radius:14px;background:var(--cut);color:var(--cut-ink)}
.task h2{margin:0;font-size:13px;font-weight:700;opacity:.85}
.task p{margin:8px 0 0;font-size:15px;line-height:1.9;font-weight:500}
.credit{margin:32px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);line-height:1.9;display:grid;grid-template-columns:6em minmax(0,1fr)}
.credit dt{color:var(--sub)}
.credit dd{margin:0;color:var(--ink)}
.credit a{text-decoration:underline}
.actions{display:flex;gap:8px;margin-top:24px}
.go{flex:1;min-height:46px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:0 16px}
.save{width:46px;height:46px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.save[aria-pressed="true"]{color:var(--cut);border-color:var(--cut)}
.note{margin-top:16px;font-size:11px;color:var(--sub);line-height:1.7}
.more{margin-top:64px;padding-top:24px;border-top:1px solid var(--line)}
.more .lead{padding-left:0}

/* ---------- その場で編集 ---------- */
.edit-btn{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.pin-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:12px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:700}
.pin-box input{width:110px;font-size:18px;letter-spacing:.3em;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.editing [contenteditable]{outline:1.5px dashed var(--cut);outline-offset:3px;border-radius:4px;cursor:text;min-height:1.4em}
.editing [contenteditable]:focus{outline-style:solid}
.editing .task [contenteditable]{outline-color:currentColor}
.editing{padding-bottom:150px}
.edit-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--cut);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.eb-in{max-width:1180px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.eb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eb-row+.eb-row{margin-top:8px}
.eb-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--cut);font-weight:700}
.eb-l{font-size:13px;display:flex;align-items:center;gap:6px}
.eb-l select{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.eb-l input{width:18px;height:18px}
.eb-btn{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:700}
.eb-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.eb-btn:disabled{opacity:.5}
.eb-msg{font-size:13px;margin-top:4px;min-height:1em}
.eb-msg.ng,#pin-msg{color:#C4321F}
.bar{flex-wrap:wrap}
mark.ed{background:color-mix(in srgb,var(--cut) 16%,transparent);color:inherit;border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.orig{margin:10px 0 0;font-size:13px;color:var(--sub)}
.orig summary{cursor:pointer;font-weight:700;width:fit-content}
.orig p{margin:8px 0 0;line-height:1.85;padding-left:12px;border-left:2px solid var(--line)}
.ed-badge{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:99px;background:var(--cut);color:var(--cut-ink);font-size:10.5px;font-weight:700}
.saved-note{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:#E7F5EC;color:#14532D;font-size:13px;font-weight:700}
</style>
</head>

り手は半信半疑だったのだろうと思います。\n\nBOSSの自販機のロゴをNOPEで上書きする施策では、既存ブランドの自販機が、そのまま媒体になりました。舞台は、街角。広がりは、街中での発見報告というユーザーの投稿が担いました。発売150日で累計出荷1億本、認知率62％という結果も公表されています。", "engine": 4}, {"slug": "mangalogue-hinotori", "no": 1, "date": "2026-11-07", "category": "体験", "title": "マンガを読む視点を、ロボットアームが会場に持ち込む", "work": "MANGALOGUE（マンガローグ）：火の鳥", "client": "JR東日本文化創造財団", "agency": "TBSテレビ（企画制作）", "production": "TBS、Bascule", "award": "2026 ACC デザイン部門ほか 三冠", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/?p=542159", "oneliner": "マンガを会場全体で読むライブ体験", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/04/OGP-1-2.jpg", "videos": [{"type": "youtube", "id": "DL1hkuPNN-I"}], "media_checked": true, "about": "手塚治虫「火の鳥 未来編」を題材にした体験型ライブパフォーマンスです。JR東日本文化創造財団が、高輪のMoN Takanawa内のシアター空間「Box1000」で、開館記念公演として上演しています。巨大LEDに原稿が映り、ロボットアーム「鉄腕アーム」がカメラのようにコマを追います。山寺宏一や夏木マリらが声で出演します。", "country": "日本", "points": "マンガは本来、一人で、自分の速さで読むものです。この公演はそれを、客席全体で同じ流れを追う体験に組み替えています。巨大LEDに原稿が映り、ロボットアームがカメラの視点でコマを順にたどります。置き換えているのは、物語ではなく読み方。場面を作り直すのではなく、目がコマを移る動きそのものを見せる設計です。ただ、読む速さは人によって違います。全員の目を一つの動きに預けるなら、止まる長さや寄る間合いは、決めにくかったのだろうと思います。\n\n題材の「火の鳥 未来編」は、西暦3404年を舞台に、AIやロボットと生きる人類を描いた作品です。そこに松任谷由実のヴォーカルデータを学習させた音声「Yumi AraI」が、AIハレルヤ／ダニューバー役で加わります。声優としての出演は初めてです。AIの物語に、AIの声。山寺宏一が声を当てる鉄腕アームも含め、題材と手法が同じ方向を向いています。", "engine": 4}, {"category": "体験", "title": "みんなで着る代表ユニフォームに、ブルーロックの「エゴ」", "work": "アディダス サッカー日本代表 2026 ユニフォーム ブルーロック カスタム 世界でひとつのエゴジャージを", "client": "アディダス ジャパン", "agency": "—", "production": "—", "award": "講談社メディアアワード2026 受賞", "oneliner": "ブルーロックと作る、日本代表ユニフォームのカスタム施策", "slug": "pm-20261106-article563356-utm-source-feed", "no": 6, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563356/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/kodansha-media-conf2026_media-awards2026_ceremony_ogp.jpg", "media_checked": true, "country": "日本", "about": "アディダス ジャパンが、FIFAワールドカップ2026に合わせてサッカー漫画「ブルーロック」とコラボした施策です。描き下ろしイラストを使い、日本代表ユニフォームを自分用にカスタマイズできる体験を用意しました。サッカーメディア「ゲキサカ」での発信と店頭施策も組み合わせています。講談社メディアアワード2026を受賞しています。", "points": "代表ユニフォームは、全員が同じものを着ることに意味がある服です。そこへ、人気サッカー漫画「ブルーロック」とのコラボで、「エゴジャージ」という自分だけの一着を持ち込んでいます。ただ、揃う良さと「自分だけ」は引き合うものです。その加減が、作り手の迷いどころだったのだろうと思います。主役は、着る人。描き下ろしのイラストが加わることで、既製品にはない特別感も生まれます。\n\nもう一つの見どころは、発信と販売の置き場所です。カスタマイズ体験を用意し、サッカーメディアの「ゲキサカ」での情報発信と店頭施策を組み合わせました。漫画のファンとサッカーのファンが、同じ流れの中で一着にたどり着きます。ワールドカップという、代表への関心がいちばん高まる時期。そこに重ねています。ゼビオグループ全店舗での日本代表ユニフォームの販売枚数は、過去最高を記録したということです。", "engine": 4}, {"category": "広告", "title": "ピザーラのDr.STONE広告は、なぜ謝罪に至ったのか。", "work": "ピザーラ×「Dr.STONE」コラボ企画（TikTok広告）", "client": "フォーシーズ（ピザーラ）", "agency": "—", "production": "—", "award": "—", "oneliner": "便利な自動化が、IPの信頼を壊した反面教師", "steps": [{"title": "課題", "body": "ピザーラは10月1日〜11月1日にDr.STONEとコラボ企画を展開し、限定ピザや描き下ろしイラスト付きグッズを販売した。ところが10月末ごろ、TikTok広告がAI生成のようだと疑問視され、許諾を問う声も上がった。"}, {"title": "狙い", "body": "コラボの狙いは、作品ファンに「世界観ごと楽しめるピザ」を届けることだと読める。限定ピザに作品を連想させる名前をつけ、描き下ろしも用意したのは、ファンの「好き」に寄り添う設計だ。"}, {"title": "表現のしかけ", "body": "今回の本質は、表現の巧拙より配信設定にある。同社の説明では、TikTok広告のAI自動生成・配信機能を意図せず有効にしたまま設定を完了し、製作委員会の監修や許諾を受けていない動画が配信された。動画の中身は記事では詳しく語られていない。ただ、商品や描き下ろしは丁寧に作り込んだのに、広告だけ自動生成に任せたことで、ファンが期待する世界観の一貫性が崩れたと考えられる。"}], "steal": "制作物だけでなく、配信設定まで含めて「作品」と考える。公開前に、自動生成や自動最適化のオン・オフを確認項目に入れておこう。", "challenge": "好きなアニメとのコラボ広告を想定し、公開前に確認すべき項目を10個のチェックリストにまとめてみよう。", "slug": "pm-20261106-article563310-utm-source-feed", "no": 7, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563310/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/pizzala-drstone_ogp.jpg", "media_checked": true}, {"category": "映像", "title": "「買わないで」と呼びかける本田圭佑、比較を勧めるVENEXのCM", "work": "VENEX 新テレビCM「買わせない男」篇（30秒）", "client": "ベネクス（VENEX）", "agency": "—", "production": "—", "award": "—", "oneliner": "購入を一度止めて比較を促すリカバリーウェアのCM", "slug": "pm-20261105-article563192-utm-source-feed", "no": 8, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563192/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/venex01.jpg", "videos": [{"type": "youtube", "id": "XtGq0cJjDsc"}], "media_checked": true, "about": "リカバリーウェアブランド「VENEX（ベネクス）」を展開するベネクスが、本田圭佑を起用して制作したテレビCMです。ホイッスルとともに「STOP」のアイコンが現れ、VENEXを着た本田が、購入を検討中の人に「すぐに買わないでください」と語りかけます。11月7日から関東で放映され、TVerやWebでは5日に先行配信が始まりました。", "country": "日本", "points": "一般的なリカバリーウェアの広告は、購入を後押しする方向に進みます。このCMは冒頭で逆を向くのです。ホイッスルの音と「STOP」のアイコンが入り、サッカー元日本代表という本田の経歴も重なって、試合を止める合図のように響きます。最初の数秒。視聴者の「買おう」という流れそのものを止めてから、話を始める構成です。\n\n止めたあとの言葉も、買う人を責める調子ではありません。「衝動買いはよくないですね」と指摘し、まだ買っていない人にはより合う製品を探す余地があるとして、本田らしい「伸びしろ」という言葉を使います。比較を勧める台本は、広告主にとって通しにくい一行だったのだろうと思います。他社と並べられた先で選ばれる根拠が、30秒の中に要るからです。\n\nその後、ナレーションでプラチナ繊維「PHT繊維」を紹介し、最後に本田がブランド名を言い切ります。比較する人に渡す手がかりは、この繊維ひとつ。30秒の流れは、止めてから比べさせ、名前で終わる形です。", "engine": 4}, {"category": "映像", "title": "宝箱から出てくるのは、政権の実績。ホワイトハウスのゼルダ風動画", "work": "THE LEGEND OF TRUMP: MAKE AMERICA GREAT AGAIN", "client": "米ホワイトハウス（The White House）", "agency": "—", "production": "—", "award": "—", "oneliner": "ホワイトハウスがゼルダ風にまとめた政権実績の動画", "slug": "pm-20261106-article563322-utm-source-feed", "no": 9, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563322/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/the-white-house_official-x_remake_the-legend-of-zelda_ogp1.jpg", "media_checked": true, "about": "米ホワイトハウスが2026年11月5日（米国時間）に公式Xへ投稿した44秒の動画です。「ゼルダの伝説 時のオカリナ」を模したローポリゴン調の映像で、リンクの代わりに赤い帽子のトランプ大統領が森を進みます。薬価や治安など政権の実績を紹介する内容で、同日のリメイク版発売に合わせたとみられます。", "country": "アメリカ", "points": "動画の中心にあるのは、アイテム入手時のメッセージです。ゲームでは宝箱を開けると一行が出ます。動画はその型に「最恵国待遇に基づく薬価設定を発見した」という文を入れました。ただ、この言葉はアイテム名としては硬く、そのまま置いた判断は迷いどころだったのだろうと思います。1場面に、1つの実績。薬価や殺人発生率の数字が、短い一文ずつ順に出てきます。いずれも政権側の主張ですが、政策が冒険の途中で拾う道具と同じ扱いになる構成です。\n\n投稿文の「It's dangerous to go alone! Take this」も、同じ発想です。初代「ゼルダの伝説」で洞窟の老人が剣を渡すときの有名なセリフで、投稿ではこれに米国旗の絵文字を続けています。剣の代わりに、国旗。ゲームを知る人は、投稿文だけで元ネタに気づきます。\n\n既存ゲームの意匠を借りた点には、SNSで任天堂に法的措置を求める声や、政府の広報姿勢への批判も出ています。", "engine": 4}, {"category": "広告", "title": "掃除の跡をそのまま、ハチ公の足跡にする", "work": "「渋谷を洗ってます」アクション（洗伝プロジェクト）／「洗キュー！寄せ書き」", "client": "ケルヒャー ジャパン", "agency": "—", "production": "—", "award": "—", "oneliner": "高圧洗浄機で渋谷にハチ公の足跡を描く施策", "slug": "pm-20261105-article563157-utm-source-feed", "no": 10, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563157/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/karcher_proj_shibuya_hachiko-paw-prints_thx-hands_ogp.jpg", "media_checked": true, "about": "ドイツの清掃機器大手ケルヒャーの日本法人が、渋谷の通行人に向けて行った洗浄アートです。パネルを当てて高圧洗浄機で汚れを落とし、ハチ公前広場から宮下公園へ続く足跡や、閉店するハンズ渋谷店への感謝の言葉を、地面と壁に浮かび上がらせました。", "country": "日本（広告主はドイツの清掃機器大手ケルヒャーの日本法人）", "points": "足跡の形に抜いたパネルを地面に当て、高圧洗浄機で水を吹きつけます。落とした部分だけが明るく残り、足跡になります。必要なのは、パネルと洗浄機。洗浄力を言葉で説明せず、仕上がった形で見せています。\n\n足跡には設定があり、渋谷駅前のハチ公が宮下公園のハチ公像まで散歩したという筋です。公園の階段へ点々と続く足跡は、目で追える道筋になります。2か所を線でつないだ点が、アイデアの要。地面に残る跡なので、その場所でしか成立しません。そもそも、汚れがなければ描けないのです。ハロウィーン明けの日取りは、洗った差が出やすいからではと想像します。\n\nハンズ渋谷店では、同じ手法が寄せ書きになりました。西武、ロフト、タワーレコード、渋谷109などから寄せられた言葉を抜いたパネルを使い、一般の参加者も加わって、屋上に「HANDS F♡REVER」「またいつか」などの文字を浮かび上がらせています。書き手が複数いるため、一社の宣伝より街の行事に近く見えます。", "engine": 4}, {"category": "映像", "title": "チューハイののどごしを、猪木の「ダァー！」で言い表す", "work": "THE DRY 新テレビCM『登場』篇(30秒)", "client": "サントリー", "agency": "—", "production": "—", "award": "—", "oneliner": "猪木の叫びでノドの刺激を表すチューハイCM", "slug": "pm-20261104-article563101-utm-source-feed", "no": 11, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261104/article563101/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/suntory_the-dry_cm_sns_ogp.jpg", "videos": [{"type": "youtube", "id": "6485HrkbDCU"}], "media_checked": true, "about": "サントリーが新ブランド「THE DRY」の〈グリーンレモン〉と〈グレープフルーツ〉の発売に合わせて流した、30秒のテレビCMです。黒い空間でアントニオ猪木さんのテーマ曲が流れ、坂口憲二さんが緑のタオルを首にかけます。飲んだ後に「ダァー!!」とうなり、コピーは「どえらいドライだ」。40代の大人に向けています。", "country": "日本", "points": "ビールののどごしといえば、飲んだ後の「くぅーっ！」が定番です。THE DRYはそこに別の声を置きました。強炭酸の刺激を受けると、人は「う〜」や「お〜」ではなく、ノドが開いて「アァァァー」に近い声が出る。その最上級として選ばれたのが「ダァー」でした。使われたのは、味ではなく声。刺激の強さを、飲んだ直後の叫びの大きさで伝えています。\n\n「ダァー」はアントニオ猪木さんの掛け声です。黒い空間に流れるテーマ曲の歌詞には「ドライ」の語が入っています。曲を聞けば猪木さんとわかり、同時に商品名も耳に入ります。歌詞にも、ブランド名。しかし、猪木さんを知らない人には、ただの大声に聞こえるかもしれません。ターゲットを40代に絞っていたから、選べた案のはずです。\n\n叫ぶ人選にも理由があります。坂口憲二さんは、猪木さんの盟友で「黄金コンビ」と呼ばれた坂口征二さんの次男です。俳優業を離れてコーヒーブランドを立ち上げ、のちに復帰した経歴は、一日を戦い抜く40代が憧れる生き方とも重なります。", "engine": 4}, {"category": "体験", "title": "休暇の申し出を受けた上司は、シールの下の本音を知らない", "work": "Silent Voice Card", "client": "電通（Twinkle Wave）", "agency": "—", "production": "—", "award": "—", "oneliner": "当事者の一言と本音を、シールで重ねたカード", "slug": "phttps-dentsu-ho-com-articles-9906", "no": 12, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9906", "status": "published", "image": "https://cdn.dentsu-ho.com/408ff208-7596-4f3f-b2c1-807e40740b9c/OGP%EF%BC%9A1200%C3%97630.jpg", "gallery": ["https://dentsu-ho.com/articles/9906"], "media_checked": true, "about": "電通社内のベビーロス啓発プロジェクト「Twinkle Wave」が、講演会のあとのワークショップで参加者に配ったカード型ツールです。表には当事者が職場に伝える一言があり、その下にシールが貼られています。上司の立場で読んで考え、シールを剥がすと、本音が現れます。", "country": "日本", "points": "このカードの工夫は、シールを剥がす順番にあります。表に書かれているのは「流産をしたので、少し休暇をいただけませんか。初期の流産でした」という一言です。簡潔で、整った文面。その温度加減は、迷う判断だったのだろうと思います。整いすぎれば落差が作り物に見え、崩せば上司役の反応が揃わないからです。参加者はまず上司の立場でこれを読み、自分ならどう感じるかを考えます。そのあとでシールを剥がすと、「急に休む理由を、どこまで説明したらいいんだろう」という声が出てきます。\n\n講演では、周囲に見えている姿と本人の状態とのずれが、職場の課題として語られました。カードはそのずれを、読む順序で再現しています。\n\n裏面には、推奨される声かけの例と、自分の言葉を書き込む空欄があります。例文は、ひとつの手がかり。望みは人それぞれで正解がないため、例を読んだあとに自分の言葉へ直すところまでが手順です。杉本氏は、「いっしょに考えていきましょう」と伝えてみてほしいと呼びかけました。", "engine": 4}, {"category": "広告", "title": "就活生の耳元で、丸の内の街が声をかける", "work": "フレー！フレー！就活生", "client": "三菱地所", "agency": "電通", "production": "電通クリエイティブピクチャーズ", "award": "Spotify Hits Japan 2026 グランプリ「Spotify Mic Drop」", "oneliner": "丸の内の街が語り手になる、就活生向けの音声広告", "slug": "pm-20261106-article563296-utm-source-feed", "no": 13, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563296/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/spotif_hits-japan2016_award-ceremony_ogp.jpg", "media_checked": true, "about": "三菱地所が、就職活動中の学生に向けて展開した応援キャンペーンです。Spotifyの音声広告では丸の内の街が語り手となり、面接前の不安に声をかけます。街中の屋外広告や、カフェの「就活生割」とも連動しました。2026年のSpotify Hits Japanでグランプリを受賞しています。", "country": "日本", "points": "語り手を誰にするかが、この広告の軸です。企業が学生に直接語ると、どうしても採用や宣伝の声に聞こえます。そこで話し手にしたのは、丸の内の街。ただ、街の声が三菱地所のものだと伝わらなければ、広告主には落ちません。そこが迷いどころだったのだろうと思います。内容は、就職活動の経験者や社員の実体験がもとです。多くの就活生を見守ってきた街の視点で語られるため、言葉が作り物に聞こえにくくなっています。\n\n届ける場所も、面接前の時間に合わせています。学生が不安を和らげるために音楽を聴くことに着目し、その再生の合間に声を入れました。イヤホン越しの声は、ほかの誰にも聞かれないまま、本人にだけ届きます。\n\nさらに、音声で聞いた応援の主を、音声の外でも確かめられるようにしています。街中の屋外広告では目に入り、カフェの就活生割では実際に使えます。声の主は、実在する街。そうわかる接点が、複数用意されています。", "engine": 4}, {"category": "体験", "title": "答えを言わないAIが、たまごの中から鳴き声だけを返す", "work": "みらいのたまご", "client": "PLAY! PARK／電通 AIうえおラボ", "agency": "電通", "production": "—", "award": "—", "oneliner": "貼った素材で鳴き声が変わる、AIのたまご", "slug": "phttps-dentsu-ho-com-articles-9898", "no": 14, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9898", "status": "published", "image": "https://cdn.dentsu-ho.com/c2de385c-462a-4806-89fd-0a4953c56077/ai-ueo-lab_ogp.jpg", "gallery": ["https://cdn.speedsize.com/e7df76a9-4406-40f5-bc97-57e7c2c2d99d/https://cdn.dentsu-ho.com/dc034943-534c-400a-99d3-ee50864a100c/hara-misaki_pr.jpg/f_auto,w_3840", "https://cdn.speedsize.com/e7df76a9-4406-40f5-bc97-57e7c2c2d99d/https://cdn.dentsu-ho.com/9cbd4d14-1b9d-46f9-86fa-724f654e743c/iida02%E3%81%AE%E3%82%B3%E3%83%92%E3%82%9A%E3%83%BC.jpg/f_auto,w_3840", "https://dentsu-ho.com/articles/9898"], "media_checked": true, "about": "電通のAIうえおラボと、東京・立川の屋内キッズパークPLAY! PARKが、9月9日からの2週間に開いた子ども向けの体験イベントです。子どもが「ころころ」「もふもふ」などの素材をたまごに貼ると、AIが分析した鳴き声が中から聞こえます。約6500名が訪れました。", "country": "日本", "points": "このイベントでは、AIは答えを言いません。子どもが貼る「ころころ」「もふもふ」「とげとげ」などの割合を天井のカメラが読み取り、30種類の生き物の鳴き声を骨組みに、その割合で音を作り直します。組み合わせは約300万通り。ただ、犬や恐竜とすぐ分かる音にはしていません。正体が分かると想像の余地がなくなるからです。同じ音を「おなかの音だ」と聞く子がいるくらいの抽象度にそろえました。しかし、抽象にしすぎるとただの変な音です。その加減は、聞いては直す繰り返しだったのだろうと思います。\n\nもう一つは、AIを子どもの目に見せていない点です。モニターは隠し、カメラもたまごの装飾だけを読む向きにしています。見せないのは、AIの存在。子どもには、中の何かが反応しているように見えます。準備中に別の場所から音を出したところ「たまごから聞こえてこない」と見抜かれ、スピーカーをたまごの奥に埋め込みました。画面の賢さより、中に何かがいる手応えを優先したのです。", "engine": 4}, {"category": "映像", "title": "北海道と東京を行き来する松岡昌宏が、寒暖差の服を着る", "work": "XShelter 松岡昌宏起用テレビCM", "client": "ワークマン", "agency": "—", "production": "—", "award": "—", "oneliner": "ワークマンXShelterが松岡昌宏を初めて起用したCM", "slug": "pm-20261105-article563143-utm-source-feed", "no": 15, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563143/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/workman_xshelter_masahiro-matsuoka_cm_ogp.jpg", "media_checked": true, "country": "日本", "about": "ワークマンが11月6日から放映する、機能性ウェア「XShelter（エックスシェルター）」のテレビCM。同商品のタレントとして俳優の松岡昌宏を初めて起用しました。寒い屋外から暖房の効いた室内へ移るときの不快感を抑える「快適断熱Σ（シグマ）」を訴求。品薄が続いていましたが、生産体制の拡充を受けて本格展開に入っています。", "points": "XShelterには4つのシリーズがありますが、このCMが前面に出すのは「快適断熱Σ」です。5〜30℃の寒暖差に対応するモデルで、場面は寒い屋外から暖房の効いた室内への移動です。氷点下30℃を想定したΩのように、性能の高さを競う見せ方もできるところを、日常の一場面に絞っています。外では寒く、中に入ると暑い。誰もが毎年の秋冬に経験する、小さな不快感。断熱という言葉は寒さを防ぐ印象が強いのですが、この場面を選ぶことで、暑さや蒸れにも対応する服だと伝わります。\n\n起用された松岡昌宏は札幌市出身で、函館市に仕事や宿泊ができる拠点を構え、東京と行き来しています。気候の異なる2つの土地を往復する暮らしが、そのまま商品特性の説明です。根拠は、本人の生活。「寒暖差に強い」と言葉で述べる前に、着る人の日常が先に答えを示しているのです。この理屈は、松岡の暮らしを知る人ほど効きます。画面だけで伝わるかは、見る人の知識次第のはずです。", "engine": 4}, {"category": "体験", "title": "メモに書くように買い物を頼む。AmazonがAlexaをSMSに置いた", "work": "Alexa for Shopping のテキスト機能(招待制パイロット)", "client": "Amazon", "agency": "—", "production": "—", "award": "—", "oneliner": "SMSで買い物を頼めるAmazonのAI。広告も試験配信", "slug": "pg-customers-text-its-shopping-assistant", "no": 16, "date": "2026-11-07", "source_name": "Adweek", "source_url": "https://www.adweek.com/commerce/amazon-is-letting-customers-text-its-shopping-assistant/", "status": "published", "image": "https://static-www.adweek.com/wp-content/uploads/2026/11/iMessage.jpg?w=600&h=315&crop=1", "media_checked": true, "about": "Amazonが、AI買い物アシスタント「Alexa for Shopping」にテキストメッセージで依頼できる機能を、米国の一部の顧客向けに招待制で始めました。招待はSMSで届きます。商品探しからカート作成、購入、配送の連絡までをやり取りの中で進められ、その中で広告も試験的に表示されます。", "country": "米国", "points": "いちばんの特徴は、入口をメッセージにしたことです。Amazonのバイスプレジデントは、人は必要なものを思いついた瞬間に、メモやメッセージ、グループチャットへ書き留めると話しています。買い物の依頼を、その書き込みと同じ形で送れるようにしたわけです。招待もSMSで届くため、案内から利用までが同じメッセージの中で完結します。\n\n広告は、このやり取りの中に置かれます。依頼は文章で届くので、何を探している人なのかが一文でわかる状態で広告を出せます。条件がそのまま文面に書かれているからです。当面はこの枠に掲載料をかけない方針です。\n\nただ、返事のすぐ隣に広告が並ぶと、どこまでが返事で、どこからが広告なのかが曖昧になります。その線引きは、作り手が最後まで迷う判断だったのではと想像します。\n\nCEOのAndy Jassyは、Alexa for Shoppingの利用者は非利用者より支出が50%多いと述べています。"}, {"category": "体験", "title": "野菜の花言葉を手がかりに、文学を一皿に仕立てる", "work": "やさい文学", "client": "クボタ", "agency": "博報堂", "production": "—", "award": "第5回ACCヤングコンペ グランプリ", "oneliner": "野菜の花言葉で文学を料理にするカフェメニュー企画", "note": "", "slug": "pm-20261109-article561086-utm-source-feed", "no": 17, "date": "2026-11-09", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261109/article561086/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/10/omoshiro-ad-20_yamaoka_ogp.jpg", "media_checked": true, "country": "日本", "about": "協賛企業であるクボタのもと、博報堂チームがACCヤングコンペに出した企画です。野菜の花言葉をきっかけに、文学作品の物語を料理で再現しました。KUBOTA AGRI FRONT CAFEのオリジナルメニューとして実現。『走れメロス』をスープカレーにした一皿などが生まれ、第5回ACCヤングコンペでグランプリを受賞しています。", "points": "野菜と文学は、ふつうに考えれば接点のない組み合わせです。この企画はそこに花言葉を置いています。野菜にも花があり、花には言葉の意味が与えられています。その意味を物語の主題や登場人物と重ねることで、食材を選ぶ理由が生まれるのです。味の好みではなく、意味で野菜を選ぶ発想。\n\n再現の手段が料理であることも効いています。『走れメロス』のスープカレーは、作品を読んだ人には中身を想像する楽しみになります。読んだことのない人には、料理から作品に入る入口。食べる前に、まず題名で引っかかる。\n\nもう一つは、実現した場所。KUBOTA AGRI FRONT CAFEという農業を名に掲げたカフェのメニューとして出されました。広告のアイデアが、実際に注文できる商品の形になっている点です。ただ、企画書のままでは味見ができません。オリジナルメニューを開発する段階では、アイデアとは別の、調理や仕入れの判断があったのだろうと思います。", "engine": 3}, {"category": "体験", "title": "盗まれたスマホの持ち主が、店先の決済端末で口座を止める", "work": "SOS POS", "client": "BCP", "agency": "Circus Grey, Lima", "production": "—", "award": "2026年カンヌライオンズ Creative Data部門 グランプリ", "oneliner": "店のPOS端末を、盗難被害者の口座ブロック窓口にした仕組み", "slug": "pvity-announces-lion-winners-on-day-three", "no": 18, "date": "2026-11-09", "source_name": "Cannes Lions", "source_url": "https://www.canneslions.com/news/cannes-lions-international-festival-of-creativity-announces-lion-winners-on-day-three", "status": "published", "image": "https://images.ctfassets.net/vjs6vfoxg7y6/4opCcrk7JYjMCKvmvacrmm/260c0f614f4f5c17ebba85ea5eab3fe6/Open_Graph_Image_home.png", "gallery": ["https://images.ctfassets.net/vjs6vfoxg7y6/4vUHr6p8gyBVFocrNdDaQi/60c4d78fc1ea8a8fec0b9a80b0b576a6/Winners_1_-_Hero.png?w=1920&q=75&fm=webp"], "media_checked": true, "about": "ペルーの銀行BCPが、スマートフォンを盗まれた人のために出した仕組みです。ふだん店で使われているPOS端末を、口座をブロックするための窓口に変えました。ペルー国民3,400万人以上に届いています。2026年のカンヌライオンズでCreative Data部門のグランプリを受賞しています。", "country": "ペルー", "points": "見どころは、助けを求める場所を新しくつくらず、すでにある機械に役割を足したことです。POS端末は、買い物のたびに誰もが目にする存在。BCPはこれを、盗難にあった人が口座をブロックできる地点に変えました。新しい設備を用意しなくても、店先の端末がそのまま入口になります。\n\nもう一つは、使われる場面の選び方です。スマートフォンを盗まれた直後は、口座を守る操作に使う端末が手元にありません。狙いは、被害の直後。その空白の時間に、近くの店のPOS端末が代わりを務めます。銀行アプリの中ではなく、被害にあった人が実際にいる場所に手段を置いた点が、この施策の特徴です。ただ、盗まれた場所が店の近くとは限らず、使える場面には条件がつくはずです。", "engine": 4}]</script>
<script>
const POSTS = JSON.parse(document.getElementById('data').textContent).sort((a,b)=>b.no-a.no);
const COLORS = {'映像':'#28323F','SNS':'#7A3B2E','ブランディング':'#34503A','体験':'#4B3F6B','広告':'#222222','コピー':'#7A5214','パッケージ':'#6B3F5C','デザイン':'#244F66','ロゴ':'#4A4A3A'};
const color = c => COLORS[c] || '#333333';
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const no3 = n => 'No.' + String(n).padStart(3,'0');
const dash = v => v && v !== '—' ? v : '';
let saved = [];
try { saved = JSON.parse(localStorage.getItem('kaibo-saved') || '[]'); } catch(e) {}
const persist = () => { try { localStorage.setItem('kaibo-saved', JSON.stringify(saved)); } catch(e) {} };
let cat = 'すべて', mode = 'home';
const app = document.getElementById('app');
const bm = on => `<svg width="20" height="20" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
const PLAY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
const noimg = "this.parentNode.classList.add('noimg');this.parentNode.style.background=this.dataset.c;this.remove()";
const meta = p => [dash(p.client), dash(p.country) && p.country !== '日本' ? p.country : '', p.category].filter(Boolean).map(esc).join('　');

function pins(list){
  if(!list.length) return '<div class="empty">保存した記事はまだありません。<br>記事ページのしおりボタンで保存できます。</div>';
  return '<div class="mason">' + list.map(p => {
    const ph = p.image
      ? `<div class="ph"><img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-c="${color(p.category)}" onerror="${noimg}"><span class="txt">${esc(p.oneliner)}</span>`
      : `<div class="ph noimg" style="background:${color(p.category)}"><span class="txt">${esc(p.oneliner)}</span>`;
    return `<a class="pin" href="#/p/${esc(p.slug)}">${ph}<span class="no">${no3(p.no)}</span>${p.videos&&p.videos.length?`<span class="vid" aria-label="動画あり">${PLAY}</span>`:''}</div><div class="t">${esc(p.title)}</div><div class="m">${ORIG && editedFields(p).length ? '<span class="ed-badge">編集済み</span>' : ''}${meta(p)}</div></a>`;
  }).join('') + '</div>';
}

function renderCats(){
  const cats = ['すべて', ...new Set(POSTS.map(p=>p.category))];
  const html = cats.map(c=>`<button class="cat${mode==='home'&&c===cat?' on':''}" data-c="${esc(c)}" aria-pressed="${mode==='home'&&c===cat}">${esc(c)}</button>`).join('');
  ['cats-d','cats-m'].forEach(id => {
    const el = document.getElementById(id); el.innerHTML = html;
    el.querySelectorAll('.cat').forEach(b => b.onclick = () => { cat = b.dataset.c; mode = 'home'; go(''); });
  });
  const sv = document.getElementById('nav-saved');
  sv.classList.toggle('on', mode==='saved'); sv.setAttribute('aria-pressed', mode==='saved');
}

function home(){
  if(mode==='saved'){
    const list = POSTS.filter(p=>saved.includes(p.slug));
    app.innerHTML = `<div class="lead"><h1>保存した解剖</h1><small>${list.length} 本</small></div>` + pins(list);
    return;
  }
  const list = POSTS.filter(p=>cat==='すべて'||p.category===cat);
  app.innerHTML = `<div class="lead"><h1>${cat==='すべて'?'新着の解剖':esc(cat)}</h1><small>${list.length} 本</small></div>` + pins(list);
}

function videoFrame(v){
  const src = v.type === 'vimeo'
    ? `https://player.vimeo.com/video/${encodeURIComponent(v.id)}?dnt=1`
    : `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?rel=0`;
  return `<div class="video"><iframe src="${src}" title="作品の動画" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
}

/* ---------- その場で編集（この端末にGitHubの鍵が登録されている時だけ表示） ---------- */
const PIN_HASH = 'e8026bda3ea2eedc7dc7bce9daa640f8cc0f33e335bd73d986a872b3ba789c71';
const CATS = ['映像','SNS','ブランディング','体験','広告','コピー','パッケージ','デザイン','ロゴ'];
const OWNER = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : 'toshiomitakahashi2-design';
const REPO = (location.hostname.endsWith('.github.io') && location.pathname.split('/').filter(Boolean)[0]) || 'kaibooom';
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/posts.json`;
const ls = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch(e) { return null; } };
const canEdit = () => !!ls('kaibooom-token');
let editing = false;
const PEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>';
const E = f => editing ? ` data-f="${f}" contenteditable="true" spellcheck="false"` : '';
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function fromB64(b64){ const bin = atob(b64.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function toB64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(bin); }
const gh = () => ({ 'Authorization': 'Bearer ' + ls('kaibooom-token'), 'Accept': 'application/vnd.github+json' });

/* ---------- 編集したところの表示（鍵を登録した端末だけ。ふつうの読者には何も出ない） ---------- */
let ORIG = null, showMarks = true;
const norm = t => String(t ?? '').trim();
const sents = t => (String(t ?? '').match(/[^。？！\n]+[。？！]?/g) || []).map(x => x.trim()).filter(Boolean);
const edited = (p, f) => { const o = ORIG && ORIG[p.slug]; return !!(o && norm(o[f]) && norm(o[f]) !== norm(p[f])); };
const editedFields = p => ['title','oneliner','about','points'].filter(f => edited(p, f));
function marked(p, f){
  // 髙橋が直した文に印をつけたHTMLを返す。印をつけないときは null
  if (editing || !showMarks || !edited(p, f)) return null;
  const old = new Set(sents(ORIG[p.slug][f]));
  return String(p[f] ?? '').split(/\n{2,}/).map(para =>
    sents(para).map(x => old.has(x) ? esc(x) : `<mark class="ed">${esc(x)}</mark>`).join('')).filter(Boolean);
}
const origBox = (p, f) => (!editing && showMarks && edited(p, f))
  ? `<details class="orig"><summary>AIが書いた元の文</summary>${esc(ORIG[p.slug][f]).split(/\n{2,}/).map(x => `<p>${x}</p>`).join('')}</details>` : '';
async function loadOrig(){
  if (!canEdit()) return;
  try {
    const r = await fetch(API.replace('posts.json', 'originals.json'), { headers: gh() });
    if (!r.ok) return;
    ORIG = JSON.parse(fromB64((await r.json()).content));
    route();
  } catch(e) {}
}

function post(slug){
  const p = POSTS.find(x=>x.slug===slug);
  if(!p){ editing=false; go(''); return; }
  const on = saved.includes(p.slug);
  const nEd = ORIG ? editedFields(p).length : 0;
  const markBtn = nEd && !editing ? `<button class="edit-btn" id="mark-toggle" aria-pressed="${showMarks}">${showMarks ? '編集したところを隠す' : '編集したところを見る'}</button>` : '';
  const editBtn = markBtn + (canEdit() && !editing ? `<button class="edit-btn" id="edit-start">${PEN}編集</button>` : '');
  const one = f => { const m = marked(p, f); return m ? m.join('') : esc(p[f]); };
  const vids = (p.videos||[]).map(videoFrame).join('');
  const gal = (p.gallery||[]).length ? `<div class="gal">${p.gallery.map(g=>`<a href="${esc(g)}" target="_blank" rel="noopener"><img src="${esc(g)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>`).join('')}</div>` : '';
  const cover = p.image
    ? `<div class="cover"><img src="${esc(p.image)}" alt="${esc(p.work)}" referrerpolicy="no-referrer" data-c="${color(p.category)}" onerror="this.parentNode.classList.add('noimg');this.parentNode.style.background=this.dataset.c;this.parentNode.textContent=${esc(JSON.stringify(p.work))}"></div>`
    : `<div class="cover noimg" style="background:${color(p.category)}">${esc(p.work)}</div>`;
  const hasMedia = p.image || vids || gal;
  const about = p.about || editing ? `<section class="about"><h2>なんの広告？</h2><p${E('about')}>${one('about')}</p>${origBox(p,'about')}</section>` : '';
  const paras = t => esc(t).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g,'<br>')}</p>`).join('');
  const body = p.points
    ? about + `<section class="sec pts"><h2>アイデア、ポイント</h2>` + (editing ? `<div class="pts-edit"${E('points')}>${esc(p.points)}</div>` : (marked(p,'points') ? marked(p,'points').map(x => `<p>${x}</p>`).join('') : paras(p.points))) + origBox(p,'points') + `</section>`
    : about +
      `<section class="sec"><h2>解剖</h2><ol class="steps">${(p.steps||[]).map((s,i)=>`<li class="step"><span class="num">${i+1}</span><div><h3>${esc(s.title)}</h3><p${E('s'+i)}>${esc(s.body)}</p></div></li>`).join('')}</ol></section>` +
      `<section class="sec steal"><h2>ここを盗め</h2><p${E('steal')}>${esc(p.steal)}</p></section>` +
      `<section class="task"><h2>やってみよう</h2><p${E('challenge')}>${esc(p.challenge)}</p></section>`;
  const credit = [['作品','work'],['広告主','client'],['広告会社','agency'],['制作','production'],['受賞','award']]
    .filter(([,k]) => editing || dash(p[k])).map(([l,k]) => `<dt>${l}</dt><dd${E(k)}>${esc(p[k])}</dd>`).join('');
  const more = POSTS.filter(x => x.slug !== p.slug && x.category === p.category).slice(0, 10);
  const others = more.length >= 4 ? more : POSTS.filter(x => x.slug !== p.slug).slice(0, 10);
  app.innerHTML =
    `<div class="art"><div class="bar"><button class="ib" aria-label="一覧に戻る" onclick="history.length>1?history.back():go('')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="n">${no3(p.no)}</span><span class="sp"></span>${editBtn}</div>` +
    `<div class="wrap${editing?' editing':''}"><div class="media">${cover}${vids}${gal}` +
    (hasMedia ? `<div class="credit-img">写真・動画：<a href="${esc(p.source_url)}" target="_blank" rel="noopener">${esc(p.source_name)}</a>ほか公式より</div>` : '') +
    `</div><article class="txtcol">` +
    `<div class="k">${meta(p)}</div><h1${E('title')}>${one('title')}</h1>${origBox(p,'title')}` +
    `<p class="one"${E('oneliner')}>${one('oneliner')}</p>${origBox(p,'oneliner')}` +
    body +
    `<div class="actions"><a class="go" href="${esc(p.source_url)}" target="_blank" rel="noopener">元の記事を読む（${esc(p.source_name)}）</a><button class="save" id="save" aria-label="${on?'保存を外す':'保存する'}" aria-pressed="${on}">${bm(on)}</button></div>` +
    `<dl class="credit">${credit}</dl>` +
    `<div class="note">作品の著作権は各権利者に帰属します。本記事は批評・解説を目的としています。</div></article></div>` +
    (editing ? '' : `<section class="more"><div class="lead"><h1>ほかの解剖</h1></div>${pins(others)}</section>`) + `</div>` +
    (editing ? `<div class="edit-bar" role="region" aria-label="編集"><div class="eb-in">
      <div class="eb-row"><span class="eb-hint">${PEN}点線の文字をタップして直せます</span></div>
      <div class="eb-row">
        <label class="eb-l">カテゴリ <select id="eb-cat">${[...new Set([...CATS, p.category])].map(c=>`<option${c===p.category?' selected':''}>${esc(c)}</option>`).join('')}</select></label>
        <label class="eb-l"><input type="checkbox" id="eb-hide"> 非公開にする</label>
        <span style="flex-grow:1"></span>
        <button class="eb-btn" id="eb-cancel">やめる</button><button class="eb-btn primary" id="eb-save">保存する</button>
      </div>
      <div class="eb-msg" id="eb-msg" role="status"></div></div></div>` : '');
  document.getElementById('save').onclick = () => {
    saved = saved.includes(p.slug) ? saved.filter(s=>s!==p.slug) : [...saved, p.slug];
    persist(); post(slug);
  };
  const mt = document.getElementById('mark-toggle');
  if (mt) mt.onclick = () => { showMarks = !showMarks; const y = window.scrollY; post(slug); window.scrollTo(0, y); };
  const st = document.getElementById('edit-start');
  if (st) st.onclick = () => startEdit(slug);
  if (editing) {
    app.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && !['s0','s1','s2','steal','challenge','about','points'].includes(el.dataset.f)) e.preventDefault(); });
    });
    document.getElementById('eb-cancel').onclick = () => { editing = false; post(slug); };
    document.getElementById('eb-save').onclick = () => saveEdit(p);
  }
}

function startEdit(slug){
  if (ss('kaibooom-unlocked') === '1') { editing = true; post(slug); return; }
  const bar = document.querySelector('.bar');
  if (document.getElementById('pin-box')) return;
  bar.insertAdjacentHTML('afterend', `<div class="pin-box" id="pin-box"><label for="pin-in">合鍵</label><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><button class="eb-btn primary" id="pin-ok">ひらく</button><span class="eb-msg" id="pin-msg" role="alert"></span></div>`);
  const input = document.getElementById('pin-in'); input.focus();
  const go = async () => {
    if (await sha256(input.value) !== PIN_HASH) { document.getElementById('pin-msg').textContent = '合鍵がちがいます'; input.select(); return; }
    ss('kaibooom-unlocked', '1'); editing = true; post(slug);
  };
  document.getElementById('pin-ok').onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function saveEdit(p){
  const btn = document.getElementById('eb-save'), m = document.getElementById('eb-msg');
  const val = f => { const el = app.querySelector(`[data-f="${f}"]`); return el ? el.innerText.replace(/ /g,' ').trim() : ''; };
  const edits = { title: val('title'), oneliner: val('oneliner'), about: val('about'), points: val('points').replace(/\n{3,}/g,'\n\n'), steal: val('steal'), challenge: val('challenge'),
    work: val('work'), client: val('client'), agency: val('agency'), production: val('production'), award: val('award'),
    category: document.getElementById('eb-cat').value, bodies: [0,1,2].map(i => val('s'+i)), hide: document.getElementById('eb-hide').checked };
  btn.disabled = true; m.className = 'eb-msg'; m.textContent = '保存中…';
  try {
    const r = await fetch(API + '?t=' + Date.now(), { headers: gh(), cache: 'no-store' });
    if (r.status === 401 || r.status === 403) throw new Error('GitHubの鍵が使えませんでした。管理ページで登録し直してください。');
    if (!r.ok) throw new Error('読み込みに失敗しました（' + r.status + '）');
    const j = await r.json(); const all = JSON.parse(fromB64(j.content));
    const t = all.find(x => x.slug === p.slug); if (!t) throw new Error('この記事が見つかりませんでした');
    ['title','oneliner','work','client','agency','production','award','category'].forEach(k => t[k] = edits[k]);
    if (edits.about || t.about) t.about = edits.about;
    if (t.points) { if (edits.points) t.points = edits.points; }
    else { t.steal = edits.steal; t.challenge = edits.challenge;
      t.steps = [0,1,2].map(i => ({ title: (t.steps && t.steps[i] && t.steps[i].title) || ['課題','狙い','表現のしかけ'][i], body: edits.bodies[i] })); }
    t.status = edits.hide ? 'hidden' : 'published';
    const put = await fetch(API, { method: 'PUT', headers: { ...gh(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `edit: No.${t.no} をサイト上で編集`, content: toB64(JSON.stringify(all, null, 2) + '\n'), sha: j.sha }) });
    if (put.status === 409) throw new Error('ちょうど自動更新と重なりました。もう一度「保存する」を押してください。');
    if (!put.ok) throw new Error('保存に失敗しました（' + put.status + '）');
    Object.assign(p, t);  // この画面にもすぐ反映
    editing = false;
    if (edits.hide) { POSTS.splice(POSTS.indexOf(p), 1); location.hash = ''; return; }
    post(p.slug);
    document.querySelector('.bar').insertAdjacentHTML('afterend', '<div class="saved-note" role="status">保存しました。公開中のサイトには1〜2分で反映されます。</div>');
  } catch(e) { m.className = 'eb-msg ng'; m.textContent = e.message; btn.disabled = false; }
}

let lastScroll = 0;
function go(hash){ if (location.hash.replace(/^#/,'') === hash) route(); else location.hash = hash; }
function route(){
  editing = false;
  const m = location.hash.match(/^#\/p\/(.+)$/);
  if (m) { if (!app.querySelector('.art')) lastScroll = window.scrollY; post(decodeURIComponent(m[1])); window.scrollTo(0,0); }
  else { home(); window.scrollTo(0, lastScroll); lastScroll = 0; }
  renderCats();
}
document.getElementById('home-link').onclick = e => { e.preventDefault(); cat='すべて'; mode='home'; lastScroll=0; go(''); };
document.getElementById('nav-saved').onclick = () => { mode = mode==='saved' ? 'home' : 'saved'; lastScroll=0; go(''); };
window.addEventListener('hashchange', route);
route();
loadOrig();
</script>
