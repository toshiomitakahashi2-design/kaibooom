<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIBOOOM 広告解剖</title>
<meta name="description" content="すぐれた広告・クリエイティブ・デザインを、プロの目で解剖するメディア。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000; --body:#2B2B2B; --sub:#707070; --line:#E8E8E8; --soft:#F4F4F4;
  --cut:#2742E8; --cut-ink:#FFFFFF; --overlay:rgba(0,0,0,.42);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F0F0F; --ink:#F5F5F5; --body:#D4D4D4; --sub:#9A9A9A; --line:#262626; --soft:#1A1A1A;
    --cut:#6E82FF; --cut-ink:#0F0F0F; --overlay:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#0F0F0F; --ink:#F5F5F5; --body:#D4D4D4; --sub:#9A9A9A; --line:#262626; --soft:#1A1A1A;
  --cut:#6E82FF; --cut-ink:#0F0F0F; --overlay:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cut);outline-offset:2px;border-radius:6px}
img{display:block;max-width:100%}

/* ---------- ロゴ：メスで切った KAIBOOOM ---------- */
.logo{position:relative;display:inline-block;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1;color:var(--ink);white-space:nowrap}
.logo>span{display:block}
.logo .lt{clip-path:inset(0 0 50% 0)}
.logo .lb{position:absolute;inset:0;clip-path:inset(50% 0 0 0);transform:translateX(4px)}
.logo::after{content:"";position:absolute;left:-3px;right:-6px;top:50%;height:1.5px;margin-top:-.75px;background:var(--cut)}
.logo.big{font-size:44px}
.logo.big .lb{transform:translateX(6px)}
.logo.big::after{height:2px;margin-top:-1px;left:-8px;right:-14px}

/* ---------- ヘッダー（小さめ・固定） ---------- */
.hd{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1680px;margin:0 auto;height:52px;padding:0 16px;display:flex;align-items:center;gap:18px}
.tagline{font-size:12px;color:var(--sub);display:none}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;height:32px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--sub)}
.cat:hover{color:var(--ink);background:var(--soft)}
.cat.on{background:var(--ink);color:var(--paper)}
.tools{display:flex;gap:2px;margin-left:auto;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib.on{color:var(--cut)}
.cats-m{display:flex;padding:0 12px 8px}
.hd-in .cats{display:none}
@media (min-width:760px){
  .tagline{display:block}
  .cats-m{display:none}
  .hd-in .cats{display:flex}
  .hd-in{padding:0 24px}
}

/* ---------- ピンタレスト風グリッド ---------- */
main{max-width:1680px;margin:0 auto;padding:16px 10px 64px}
@media (min-width:760px){main{padding:24px 24px 80px}}
.lead{display:flex;align-items:baseline;gap:12px;padding:4px 4px 16px}
.lead h1{margin:0;font-family:'Zen Old Mincho',serif;font-size:20px;font-weight:700}
.lead small{font-size:12px;color:var(--sub)}
.mason{column-count:2;column-gap:10px}
@media (min-width:720px){.mason{column-count:3;column-gap:16px}}
@media (min-width:1100px){.mason{column-count:4}}
@media (min-width:1480px){.mason{column-count:5}}
.pin{break-inside:avoid;display:block;margin-bottom:18px}
.pin .ph{position:relative;border-radius:14px;overflow:hidden;background:var(--soft)}
.pin .ph img{width:100%;height:auto}
.pin .ph::after{content:"";position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity .15s}
.pin:hover .ph::after{opacity:1}
.pin .no{position:absolute;left:10px;top:10px;z-index:1;font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:11px;color:#fff;opacity:0;transition:opacity .15s}
.pin:hover .no{opacity:1}
.pin .vid{position:absolute;right:10px;bottom:10px;z-index:1;width:28px;height:28px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.pin .txt{display:none;padding:18px 16px 22px;font-family:'Zen Old Mincho',serif;font-size:17px;font-weight:700;line-height:1.6;color:#fff}
.pin .ph.noimg .txt{display:block}
.pin .ph.noimg::after{display:none}
.pin .t{margin:8px 4px 0;font-size:13.5px;font-weight:700;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pin .m{margin:3px 4px 0;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.pin .ph::after,.pin .no{transition:none}}
.empty{padding:72px 16px;text-align:center;color:var(--sub);line-height:1.9}

/* ---------- 記事ページ ---------- */
.art{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding:0 0 14px}
.bar .n{font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:13px;color:var(--sub)}
.bar .sp{flex:1}
.wrap{display:grid;gap:28px}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:start}.media{position:sticky;top:76px}}
.media{display:flex;flex-direction:column;gap:12px}
.cover{border-radius:18px;overflow:hidden;background:var(--soft)}
.cover img{width:100%;height:auto}
.cover.noimg{aspect-ratio:4/3;display:flex;align-items:flex-end;padding:24px;color:#fff;font-family:'Zen Old Mincho',serif;font-size:22px;font-weight:700;line-height:1.6}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gal a{border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:4/3}
.gal img{width:100%;height:100%;object-fit:cover}
.credit-img{font-size:11.5px;color:var(--sub)}
.credit-img a{text-decoration:underline}
.txtcol{max-width:600px}
.k{font-size:12.5px;color:var(--sub);line-height:1.7}
.txtcol h1{margin:8px 0 0;font-family:'Zen Old Mincho',serif;font-weight:700;font-size:25px;line-height:1.55;letter-spacing:.01em}
@media (min-width:900px){.txtcol h1{font-size:30px}}
.one{margin:16px 0 0;font-size:16px;font-weight:700;line-height:1.75;padding-left:14px;border-left:2px solid var(--cut)}
.about{margin:28px 0 0;padding:18px 20px;border-radius:14px;background:var(--soft)}
.about h2,.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--sub)}
.about p{margin:8px 0 0;font-size:15px;line-height:1.95;color:var(--body)}
.sec{margin-top:32px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:22px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.step .num{font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:14px;color:var(--cut);padding-top:2px}
.step h3{margin:0 0 4px;font-size:15px;font-weight:700}
.step p{margin:0;font-size:15px;line-height:1.95;color:var(--body)}
.pts p{margin:12px 0 0;font-size:15.5px;line-height:2.05;color:var(--body)}
.pts p:first-of-type{margin-top:10px}
.pts-edit{margin:10px 0 0;font-size:15.5px;line-height:2.05;color:var(--body);white-space:pre-wrap}
.steal p{margin:8px 0 0;font-family:'Zen Old Mincho',serif;font-size:17px;font-weight:700;line-height:1.85}
.task{margin-top:28px;padding:18px 20px;border-radius:14px;background:var(--cut);color:var(--cut-ink)}
.task h2{margin:0;font-size:13px;font-weight:700;opacity:.85}
.task p{margin:8px 0 0;font-size:15px;line-height:1.9;font-weight:500}
.credit{margin:32px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);line-height:1.9;display:grid;grid-template-columns:6em minmax(0,1fr)}
.credit dt{color:var(--sub)}
.credit dd{margin:0;color:var(--ink)}
.credit a{text-decoration:underline}
.actions{display:flex;gap:8px;margin-top:24px}
.go{flex:1;min-height:46px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:0 16px}
.save{width:46px;height:46px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.save[aria-pressed="true"]{color:var(--cut);border-color:var(--cut)}
.note{margin-top:16px;font-size:11px;color:var(--sub);line-height:1.7}
.more{margin-top:64px;padding-top:24px;border-top:1px solid var(--line)}
.more .lead{padding-left:0}

/* ---------- その場で編集 ---------- */
.edit-btn{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.pin-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:12px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:700}
.pin-box input{width:110px;font-size:18px;letter-spacing:.3em;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.editing [contenteditable]{outline:1.5px dashed var(--cut);outline-offset:3px;border-radius:4px;cursor:text;min-height:1.4em}
.editing [contenteditable]:focus{outline-style:solid}
.editing .task [contenteditable]{outline-color:currentColor}
.editing{padding-bottom:150px}
.edit-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--cut);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.eb-in{max-width:1180px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.eb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eb-row+.eb-row{margin-top:8px}
.eb-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--cut);font-weight:700}
.eb-l{font-size:13px;display:flex;align-items:center;gap:6px}
.eb-l select{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.eb-l input{width:18px;height:18px}
.eb-btn{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:700}
.eb-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.eb-btn:disabled{opacity:.5}
.eb-msg{font-size:13px;margin-top:4px;min-height:1em}
.eb-msg.ng,#pin-msg{color:#C4321F}
.saved-note{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:#E7F5EC;color:#14532D;font-size:13px;font-weight:700}
</style>
</head>

"mangalogue-hinotori", "no": 1, "date": "2026-11-07", "category": "体験", "title": "火の鳥は、なぜ「みんなで読む」マンガになったのか。", "work": "MANGALOGUE：火の鳥", "client": "JR東日本文化創造財団", "agency": "TBSテレビ（企画制作）", "production": "Bascule（企画制作）", "award": "2026 ACC デザイン部門ほか 三冠", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/?p=542159", "oneliner": "一人で読むマンガを、みんなで読むライブに変えた。", "steps": [{"title": "課題", "body": "新しいミュージアム「MoN Takanawa」の開館記念公演として、ここでしか味わえない物語体験が必要だった。"}, {"title": "狙い", "body": "マンガを読む体験を分解して、コマ割り・視線の動き・ページをめくる間を、空間と時間で組み立て直す。"}, {"title": "表現のしかけ", "body": "巨大LEDに手塚プロダクションが新たに着彩した原稿を映し、ロボットアーム「鉄腕アーム」のカメラがコマを追う。読者の視線をロボットが代行するわけだ。題材は、AIやロボットと暮らす未来を描く『火の鳥 未来編』。使う技術と物語のテーマがぴたりと重なっている。"}], "steal": "体験を分解して、要素ごとに別のメディアへ置き換えてみる。視線はカメラに、ページは時間に、というふうに。", "challenge": "「絵本を読む」体験を分解して、図書館で行うライブイベントに組み立て直そう。要素ごとに何へ置き換えるか、表にしてみよう。", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/04/OGP-1-2.jpg", "videos": [{"type": "youtube", "id": "DL1hkuPNN-I"}], "media_checked": true, "about": "4月22日から5月16日まで、高輪ゲートウェイシティの複合ミュージアム「MoN Takanawa」内のシアター「Box1000」で開かれるライブ公演。観客は巨大LEDに映る手塚治虫「火の鳥 未来編」の原稿やコマを見つめ、ロボットアーム「鉄腕アーム」がカメラのようにコマを追う動きに視線を預けて物語を進む。山寺宏一や夏木マリらの声に加え、松任谷由実のAI音声も登場し、又吉直樹ら案内役が観客と旅をする。", "country": "日本"}, {"category": "体験", "title": "アディダスのエゴジャージは、なぜ過去最高に売れたのか。", "work": "アディダス サッカー日本代表 2026 ユニフォーム ブルーロック カスタム 世界でひとつのエゴジャージを", "client": "アディダス ジャパン", "agency": "—", "production": "—", "award": "講談社メディアアワード2026 受賞（45企画がエントリーし、5企画が受賞したうちの1つ）", "oneliner": "漫画の魅力を「自分だけの1着」に変えた", "steps": [{"title": "課題", "body": "記事に課題の明記はないので、ここは私の読み解き。W杯イヤーは各社が日本代表ユニフォームに力を入れる。ただ同じ型を多くの人が着る商品なので、「なぜ自分はこれを選ぶのか」という理由づくりが課題だったと考えられる。"}, {"title": "狙い", "body": "狙いはW杯への期待が高まるサッカーファンと、漫画「ブルーロック」のファンの両方。審査員は、漫画IPの魅力とサッカーメディアの発信力、W杯への期待感を組み合わせ、購買につながる体験をつくった点を評価したという。"}, {"title": "表現のしかけ", "body": "ポイントは、描き下ろしイラストを使ったカスタマイズ体験。ユニフォームを「買うもの」から「自分でつくるもの」に変えた。さらにサッカーメディア「ゲキサカ」で情報を発信し、店頭施策も組み合わせた。知る、触れる、買うが一本の道でつながっている。名前の「エゴジャージ」も、自分だけの1着という意味が一言で伝わる。ここは私の解釈。"}], "steal": "商品そのものを変えず、IPと「自分用にカスタム」できる体験を足して買う理由にする。さらに、発信の場と売り場まで一本の道でつなぐ。", "challenge": "同じ形で大量に売られる商品を1つ選び、「世界でひとつ」にできるカスタム体験と、その体験の名前を考えてみよう。", "slug": "pm-20261106-article563356-utm-source-feed", "no": 6, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563356/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/kodansha-media-conf2026_media-awards2026_ceremony_ogp.jpg", "media_checked": true}, {"category": "広告", "title": "ピザーラのDr.STONE広告は、なぜ謝罪に至ったのか。", "work": "ピザーラ×「Dr.STONE」コラボ企画（TikTok広告）", "client": "フォーシーズ（ピザーラ）", "agency": "—", "production": "—", "award": "—", "oneliner": "便利な自動化が、IPの信頼を壊した反面教師", "steps": [{"title": "課題", "body": "ピザーラは10月1日〜11月1日にDr.STONEとコラボ企画を展開し、限定ピザや描き下ろしイラスト付きグッズを販売した。ところが10月末ごろ、TikTok広告がAI生成のようだと疑問視され、許諾を問う声も上がった。"}, {"title": "狙い", "body": "コラボの狙いは、作品ファンに「世界観ごと楽しめるピザ」を届けることだと読める。限定ピザに作品を連想させる名前をつけ、描き下ろしも用意したのは、ファンの「好き」に寄り添う設計だ。"}, {"title": "表現のしかけ", "body": "今回の本質は、表現の巧拙より配信設定にある。同社の説明では、TikTok広告のAI自動生成・配信機能を意図せず有効にしたまま設定を完了し、製作委員会の監修や許諾を受けていない動画が配信された。動画の中身は記事では詳しく語られていない。ただ、商品や描き下ろしは丁寧に作り込んだのに、広告だけ自動生成に任せたことで、ファンが期待する世界観の一貫性が崩れたと考えられる。"}], "steal": "制作物だけでなく、配信設定まで含めて「作品」と考える。公開前に、自動生成や自動最適化のオン・オフを確認項目に入れておこう。", "challenge": "好きなアニメとのコラボ広告を想定し、公開前に確認すべき項目を10個のチェックリストにまとめてみよう。", "slug": "pm-20261106-article563310-utm-source-feed", "no": 7, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563310/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/pizzala-drstone_ogp.jpg", "media_checked": true}, {"category": "映像", "title": "VENEXの「買わせない男」は、なぜ「買わないで」と言うのか。", "work": "VENEX 新テレビCM「買わせない男」篇（30秒）", "client": "ベネクス", "agency": "—", "production": "—", "award": "—", "oneliner": "買うなと言うことで、商品への自信を示す逆説", "steps": [{"title": "課題", "body": "記事によれば、リカバリーウェア市場では競合が増え、消費者の選択肢が広がっている。「いい商品です」と言うだけでは他社に埋もれてしまう。比較されることを前提に、どう選ばれるかが問われていた。"}, {"title": "狙い", "body": "対象は、リカバリーウェアを検討中でまだ決めきれていない人。「衝動買いはよくない」と寄り添って警戒心を下げ、じっくり比べてから選んでほしいと伝える。納得感と信頼を得ることが狙いだったと読める。"}, {"title": "表現のしかけ", "body": "冒頭でホイッスルとSTOPのアイコンを出し、「買わないで」という予想外の一言で視聴者の足を止める。続く「衝動買いはよくない」は正論なので反発されにくい。本田らしい「伸びしろ」という言葉で比較へ促し、最後にPHT繊維とブランド名で締める。本田自身は対談で、通常と逆の発想だからこそ商品への自信が伝わると受け止めたと明かしている。"}], "steal": "常識と逆のことを最初に言って足を止め、すぐに納得できる理由と本命の情報を続ける。「やめて」から入る型は、作品への自信を見せたいときに使える。", "challenge": "自分の好きな商品を一つ選び、「買わないで」から始まる15秒のCM台本を書こう。最後には、買う理由がちゃんと残る構成にすること。", "slug": "pm-20261105-article563192-utm-source-feed", "no": 8, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563192/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/venex01.jpg", "videos": [{"type": "youtube", "id": "XtGq0cJjDsc"}], "media_checked": true, "about": "30秒のテレビCM。ホイッスルの音とともに「STOP」のアイコンが画面に現れ、その奥からVENEXのウェアを着た本田圭佑が登場します。リカバリーウェアを買おうとしている人に「すぐに買わないでください」と語りかけ、「衝動買いはよくないですね」と続けます。最後はナレーションで独自のPHT繊維を紹介し、本田がブランド名を力強く言って終わります。商品の選択肢が増えた日本のリカバリーウェア市場で流れるCMです。", "country": "日本"}, {"category": "SNS", "title": "ホワイトハウスのゼルダ風動画は、なぜ物議を醸すのか。", "work": "THE LEGEND OF TRUMP: MAKE AMERICA GREAT AGAIN(公式X投稿の44秒動画)", "client": "米ホワイトハウス", "agency": "—", "production": "—", "award": "—", "oneliner": "人気ゲームの文法で、政策を“発見”に変えた", "steps": [{"title": "課題", "body": "記事は課題を明示していない。ただ、薬価や治安といった実績は数字が多く、文字だけで出すとSNSでは流れて読まれにくい。そこで注目が集まる日に重ね、短い動画で最後まで見せる必要があったと考えられる。"}, {"title": "狙い", "body": "記事によると、投稿は人気ゲームのリメイク発売日に合わせたものとみられる。ゲームに親しむ層に、政権の実績を「楽しい話題」として届けたかったのだろう(これは私の解釈)。一方で批判も相次ぎ、全員の共感を狙った形ではない。"}, {"title": "表現のしかけ", "body": "記事によれば、動画はタイトル画面から始まり、ローポリ調の主人公、体力ゲージ、剣のアイコン、地図など、ゲームらしい画面で統一されている。効いているのは、アイテムを見つけた時のメッセージの形式を実績の紹介に使った点だ。「数字の主張」が「お宝を手に入れた瞬間」に見え、ゲームを知る人ほど先が気になる。投稿文に有名なセリフを置く入口づくりも巧い。"}], "steal": "伝えたい情報を、誰もが知る形式のお約束(メッセージ枠や画面表示)に流し込む。ただし他社のキャラや作品は無断で借りず、形式だけ借りる。", "challenge": "学食の新メニュー紹介を、RPGのアイテム入手画面風に15秒の絵コンテにする。キャラクターは自作のものに限る。", "slug": "pm-20261106-article563322-utm-source-feed", "no": 9, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563322/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/the-white-house_official-x_remake_the-legend-of-zelda_ogp1.jpg", "media_checked": true, "about": "米国時間11月5日、「ゼルダの伝説 時のオカリナ」リメイク版の発売日に、ホワイトハウスが公式Xへ投稿した44秒の動画。タイトル画面「THE LEGEND OF TRUMP」から始まり、赤い帽子をかぶったローポリ調のトランプ大統領が、妖精ナビィ風の相棒と森を進む。ハート型の体力ゲージや地図も出て、「薬価設定を発見した」など政権の実績が文字で現れる。最後は執務室で署名する姿で終わる。", "country": "アメリカ"}, {"category": "体験", "title": "ケルヒャーの渋谷洗浄アートは、なぜ話題になるのか。", "work": "「渋谷を洗ってます」アクション（洗伝プロジェクト）／「洗キュー！寄せ書き」", "client": "ケルヒャー ジャパン", "agency": "—", "production": "—", "award": "—", "oneliner": "掃除そのものを街の作品に変えた", "steps": [{"title": "課題", "body": "高圧洗浄機は「汚れが落ちる」ことが当たり前の商品で、機能を語るだけでは差がつきにくい。掃除という地味な行為を、どうすれば楽しく、見てもらえる話題にできるかが問われていたと考えられる。"}, {"title": "狙い", "body": "記事によれば狙いは「楽しくきれいに」のアピール。街を歩く人や渋谷を愛する人に、掃除への親しみを持ってもらう。さらに閉店するハンズへの感謝に参加者を巻き込み、ブランドへの好意につなげようとしたと読める。"}, {"title": "表現のしかけ", "body": "足跡の形に抜いたパネルに水を当てて汚れを落とし、跡を絵にする。商品の機能がそのまま表現になっている。ハチ公が駅から宮下公園まで散歩したという物語を足跡でつなぎ、歩く人が見つけたくなる仕掛けにした。ハンズでは他の商業施設などから寄せられたメッセージを使い、感謝を街に残した。場所の文脈に合わせた絵や文字が、写真に撮って共有したくなる理由になっている。"}], "steal": "商品の機能そのものを表現の手段にする。そこに「ハチ公の散歩」のような短い物語と、場所の文脈を重ねると、見た人が語りたくなる。", "challenge": "消しゴムや付箋など身近な文房具の機能を使い、学校の一角で「機能がそのまま表現になる」小さな作品を1つ企画しよう。", "slug": "pm-20261105-article563157-utm-source-feed", "no": 10, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563157/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/karcher_proj_shibuya_hachiko-paw-prints_thx-hands_ogp.jpg", "media_checked": true, "about": "ハロウィーンの週末が明けた渋谷で、高圧洗浄機を使い、汚れを落とした跡を絵にした。足跡の形に抜いたパネルを地面に当てて水を吹きかけると、汚れが落ちた部分だけが足跡になって浮かぶ。待ち合わせの名所ハチ公前広場から宮下公園の階段まで「ハチ公の散歩道」が続く。閉店前のハンズ渋谷店では、一般参加者も加わって屋上に感謝の文字を洗い出した。", "country": "日本"}, {"category": "映像", "title": "THE DRYのCMは、なぜ猪木の「ダァー」を叫ぶのか。", "work": "THE DRY 新テレビCM『登場』篇(30秒)", "client": "サントリー", "agency": "—", "production": "—", "award": "—", "oneliner": "ノドの刺激を、猪木の叫びで音にした", "steps": [{"title": "課題", "body": "新ブランドTHE DRYは、高密度・強炭酸でノドへの刺激とキレが売り。担当者によれば、オリエンのお題は「ノドのうなり」をどう表現すれば一番インパクトをもって伝わるか。ビールの「くぅーっ！」に並ぶ、新しい“のどごしの音”が求められた。"}, {"title": "狙い", "body": "ターゲットは40代の大人たち。担当者によれば、大変な時代を生きる彼らを元気づけ、背中を押すチューハイを目指した。1日を戦い抜いた自分をねぎらう「報酬感」を、生き方がカッコいい大人として起用した坂口憲二さんに重ねている。"}, {"title": "表現のしかけ", "body": "強炭酸でノドが開くと「アァァー」に近い声が出る。その最上級が「ダァー」だと考えた、と担当者は語る。暗い空間、猪木さんのテーマ曲、タオルを首にかける所作で飲む前に期待を溜め、最後の叫びで一気に解放する構成だ。さらに、坂口さんは猪木さんの盟友・坂口征二さんの次男。この背景がファンの心にも響くと狙っている。"}], "steal": "商品の特長を「音・声」に置き換え、誰もが知る掛け声と結びつける。新しい言葉を作るより、みんなの記憶にある言葉を借りるほうが一瞬で伝わる。", "challenge": "好きな飲み物や食べ物を口にした瞬間の感覚を擬音1つで表し、有名な掛け声や決めゼリフと組み合わせた15秒CMの絵コンテを描く。", "slug": "pm-20261104-article563101-utm-source-feed", "no": 11, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261104/article563101/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/suntory_the-dry_cm_sns_ogp.jpg", "videos": [{"type": "youtube", "id": "6485HrkbDCU"}], "media_checked": true, "about": "10月16日から流れる30秒のテレビCM。真っ暗な空間に、プロレスの入場曲として日本中に知られるアントニオ猪木のテーマが、「ドライ、ボンバイエ」と響く。坂口憲二がゆっくり顔を上げ、緑のタオルを首にかけ、チューハイを飲む。ノドに刺激を感じた次の瞬間、猪木の掛け声と同じ「ダァー!!」を力いっぱい叫ぶ。ビールの「くぅーっ」にあたる「ノドのうなり」を、日本のプロレスの記憶で見せる一本だ。", "country": "日本"}, {"category": "体験", "title": "Silent Voice Cardは、なぜ上司の想像力を動かすのか。", "work": "Silent Voice Card（ワークショップ用カード型ツール）", "client": "Twinkle Wave（電通社内のベビーロス啓発プロジェクト）", "agency": "—", "production": "—", "award": "—", "oneliner": "シールを剥がすと本音が見えるカード", "steps": [{"title": "課題", "body": "登壇者によれば、働く女性の5人に1人が流産を経験するとされる。それでも妊娠を伝える前に起きることが多く、職場では見えにくい。「元気そう」に見えても本人は悲しみの中にいて、理解不足が孤立や離職につながっていた。"}, {"title": "狙い", "body": "上司や同僚の立場にいる人に、当事者の「見えない困難」を知識ではなく体感として届けること。「何と声をかければいいかわからない」という戸惑いを、「いっしょに考えていきましょう」と言える最初の一歩に変えようとした。"}, {"title": "表現のしかけ", "body": "カードの表には、当事者が上司に伝える短い一言だけが書かれている。参加者は「自分が上司ならどう感じるか」を考えてから、シールを剥がす。すると言葉の裏にある本音が現れる。講演で語られた「見えているものと見えていないもののギャップ」を、剥がす動作に置き換えた構造だと読める。裏面には推奨される声かけ例と空欄があり、気づいた後に自分の言葉で書く流れまでつながっている。"}], "steal": "伝えたい問題を、順番で体験させる。表に建前、シールの下に本音を置けば、「めくる」動作そのものが気づきになる。説明より先に体験を置く発想はマネできる。", "challenge": "「大丈夫です」と言ってしまいがちな場面を1つ選び、表に建前、シールの下に本音を書いたカードを3枚作ってみよう。", "slug": "phttps-dentsu-ho-com-articles-9906", "no": 12, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9906", "status": "published", "image": "https://cdn.dentsu-ho.com/408ff208-7596-4f3f-b2c1-807e40740b9c/OGP%EF%BC%9A1200%C3%97630.jpg", "gallery": ["https://dentsu-ho.com/articles/9906"], "media_checked": true, "about": "電通本社ビルで開かれたベビーロス（流産・死産などで赤ちゃんを亡くす喪失）の講演会の最後に、参加者へ配られたカード型ツール。カードの表には、当事者が上司に送る「流産をしたので、少し休暇をいただけませんか」という一言だけが書かれている。参加者は上司になったつもりで受け取った気持ちを考え、そのあとシールを剥がす。すると、言葉にできなかった本音が現れる。裏面には声かけの例と、自分の言葉を書く空欄がある。オンライン参加者も画面越しに体験した。", "country": "日本"}, {"category": "広告", "title": "「フレー！フレー！就活生」は、なぜ街が語るのか。", "work": "フレー！フレー！就活生", "client": "三菱地所", "agency": "電通", "production": "電通クリエイティブピクチャーズ", "award": "Spotify Hits Japan 2026 グランプリ「Spotify Mic Drop」", "oneliner": "街の声で、面接前の不安に寄り添う音声広告", "steps": [{"title": "課題", "body": "記事に課題の明記はないが、就活生にとって面接前は不安が大きい時間だ。三菱地所には、丸の内という街を売り込みではなく就活生の味方として感じてもらう方法が求められたと読める。"}, {"title": "狙い", "body": "面接前の不安をやわらげようと音楽を聴く就活生に着目した。その一人きりの時間に、丸の内の街が「見守ってきた存在」として声をかけ、応援されていると実感してもらうことを狙ったと考えられる。"}, {"title": "表現のしかけ", "body": "音声広告は、就活経験者や社員の実体験をもとに、多くの就活生を見守ってきた街の視点でメッセージを発信した。語り手が企業ではなく街なので、押しつけがましくならず、そっと寄り添う声になる。さらに屋外広告やカフェの就活生割と連動させ、聴く・見る・過ごすの3場面で同じ応援に出会える設計にした。"}], "steal": "語り手を企業ではなく「街」に変え、相手の行動（聴く・歩く・休む）に合わせて同じメッセージを重ねる。実体験を素材にすると言葉に説得力が出る。", "challenge": "自分の大学の最寄り駅を語り手にして、試験前の学生に向けた30秒の音声広告の台本と、駅に貼るポスター案を作る。", "slug": "pm-20261106-article563296-utm-source-feed", "no": 13, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563296/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/spotif_hits-japan2016_award-ceremony_ogp.jpg", "media_checked": true, "about": "就職活動中の学生が、面接前の不安をしずめようとSpotifyで音楽を聴く。その時間に、東京駅前のオフィス街・丸の内の「街」が語りかける音声広告が流れる。内容は就活経験者や社員の実体験がもとで、多くの就活生を見守ってきた街の視点から応援を届ける。丸の内を歩けば屋外広告が目に入り、カフェでは「就活生割」が使える。耳で聞いた応援が、街の中でも続いていく。", "country": "日本"}, {"category": "体験", "title": "みらいのたまごは、なぜAIの答えを隠すのか。", "work": "みらいのたまご（AIうえおラボ × PLAY! PARK 体験型イベント）", "client": "PLAY! PARK（電通 AIうえおラボと共同開催）", "agency": "電通（AIうえおラボ）", "production": "—", "award": "—", "oneliner": "答えを出さないAIが、子どもの想像力を引き出す", "steps": [{"title": "課題", "body": "生成AIで誰もがすぐ答えにたどり着ける時代になった。子どもにはアナログな体験をさせたいが、AIと無縁では生きられない。PLAY! PARK側も当初、AIを「正解を与えるもの」と見て、遊びの方針と合わないと感じていた。"}, {"title": "狙い", "body": "対象は子どもと保護者。AIが正解を教えるのではなく、子どもが自分なりの答えを見つけ、想像をふくらませる気持ちを動かすのが狙い。「このたまごには何がいるの？」という子どもの素朴な問いを、そのまま遊びにした。"}, {"title": "表現のしかけ", "body": "子どもが「ころころ」「もふもふ」などの素材をたまごに貼ると、天井のカメラが割合を読み取り、AIが30種の生き物の声をもとに鳴き声を合成する。組み合わせは約300万通り。どの生き物とも断定できない余白のある音にし、怖すぎる音は手作業で調整した。スピーカーはたまごの奥に埋め込み、PCやモニターは見えないよう隠して、AIを意識させない体験に仕上げている。"}], "steal": "「答えを出さない」ことを設計する。あえて正体をぼかし、受け手に解釈をゆだねる。そのぶん音の強さや置き場所など細部は手を動かして磨き込む。", "challenge": "身近な物を1つ選び、正体が一目でわからない「音」か「におい」だけで紹介する企画を作り、友人3人の想像を聞き比べる。", "slug": "phttps-dentsu-ho-com-articles-9898", "no": 14, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9898", "status": "published", "image": "https://cdn.dentsu-ho.com/c2de385c-462a-4806-89fd-0a4953c56077/ai-ueo-lab_ogp.jpg", "gallery": ["https://cdn.speedsize.com/e7df76a9-4406-40f5-bc97-57e7c2c2d99d/https://cdn.dentsu-ho.com/dc034943-534c-400a-99d3-ee50864a100c/hara-misaki_pr.jpg/f_auto,w_3840", "https://cdn.speedsize.com/e7df76a9-4406-40f5-bc97-57e7c2c2d99d/https://cdn.dentsu-ho.com/9cbd4d14-1b9d-46f9-86fa-724f654e743c/iida02%E3%81%AE%E3%82%B3%E3%83%92%E3%82%9A%E3%83%BC.jpg/f_auto,w_3840", "https://dentsu-ho.com/articles/9898"], "media_checked": true, "about": "9月、東京都立川市の屋内キッズパークPLAY! PARKに、巨大なたまごが登場。子どもたちは「ころころ」「もふもふ」「とげとげ」といった要素の素材をたまごに貼っていく。すると天井のカメラが素材の割合を読み取り、AIが30種類の生き物の声をもとに鳴き声を作って、たまごの奥から鳴らす。何の生き物かは教えてくれない。子どもは音を聞いて「おなかの音？」と想像し、絵に描く。約6500名が訪れた。", "country": "日本"}, {"category": "広告", "title": "XShelterは、なぜ松岡昌宏を初のタレントに選んだのか。", "work": "ワークマン「XShelter」松岡昌宏起用の新テレビCM（11月6日放映開始）", "client": "ワークマン", "agency": "—", "production": "—", "award": "—", "oneliner": "暮らしが商品の機能そのものの人を起用", "steps": [{"title": "課題", "body": "XShelterは2024年の発売以来、累計450万着を超えたヒット商品。ただ需要に生産が追いつかず品薄が続き、タレントを使った大きな広告展開には踏み出せない状況だった。"}, {"title": "狙い", "body": "生産体制が整い、初めてタレントを起用。CMは、寒い屋外から暖かい室内へ移るときの不快感を減らす「快適断熱Σ」を訴求する。寒暖差のある日常で「自分にも必要だ」と思わせる狙いと読める。"}, {"title": "表現のしかけ", "body": "効いているのは映像より先に、人選の設計だ。記事によれば、札幌出身で北海道と東京の2拠点生活を送る松岡昌宏を、気候差のある土地を行き来する商品特性の体現者として選んだ。機能を言葉で説明する前に、その人の暮らしが機能の証明になる。なおCMの具体的な映像や台詞は、この記事の範囲では確認できない。"}], "steal": "機能を説明する前に、その機能が生活の事実として重なる人を探す。知名度より「暮らしと商品の特徴が一致しているか」で起用を決めると、説得力が出る。", "challenge": "身近な商品を1つ選び、その特徴を生活で体現している人を3人考えて、起用理由を1行ずつ書いてみよう。", "slug": "pm-20261105-article563143-utm-source-feed", "no": 15, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563143/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/workman_xshelter_masahiro-matsuoka_cm_ogp.jpg", "media_checked": true}, {"category": "体験", "title": "Alexa for Shoppingは、なぜメッセージで買い物させるのか。", "work": "Alexa for Shopping のテキスト機能(招待制パイロット)", "client": "Amazon", "agency": "—", "production": "—", "award": "—", "oneliner": "メモや会話の流れに買い物を溶かす", "steps": [{"title": "課題", "body": "Amazonのモバイルショッピング担当VP、Rajiv Mehta氏によると、人は必要なものを思いついた瞬間にメモやメッセージ、グループチャットへ書き留める。買い物アプリを開いて探す手間の手前で、購買の入口が別の場所にあった。"}, {"title": "狙い", "body": "「あ、あれ切れてる」と思った瞬間の気持ちを逃さず、そのまま買い物につなげることが狙い。CEOのAndy Jassy氏は、Alexa for Shoppingの利用者は非利用者より支出が50%多いと語っている。会話型の買い物を広げる価値は、すでに数字で見えている。"}, {"title": "表現のしかけ", "body": "新しいアプリや画面を覚えさせず、すでに毎日使っているメッセージの中に入り込んだ。招待もメッセージで届くので、入口から体験が始まっている。探す、カート、購入、配送連絡までを会話ひとつにまとめて、操作を「書く」だけに減らした。広告は当面無料で載せ、広告主に試してもらう段階にとどめている。"}], "steal": "新しい場所に人を呼ぶより、人がすでにいる場所に入る。自分の企画も「相手が今どこで何を書いているか」から考えると、入口が見つかる。", "challenge": "学食や図書館など身近なサービスを1つ選び、LINEのトーク画面だけで完結する利用の流れを5コマで描いてみよう。", "slug": "pg-customers-text-its-shopping-assistant", "no": 16, "date": "2026-11-07", "source_name": "Adweek", "source_url": "https://www.adweek.com/commerce/amazon-is-letting-customers-text-its-shopping-assistant/", "status": "published", "image": "https://static-www.adweek.com/wp-content/uploads/2026/11/iMessage.jpg?w=600&h=315&crop=1", "media_checked": true, "about": "アメリカでAmazonが招待制で始めた、AIショッピングアシスタント「Alexa for Shopping」のテキスト機能。対象になったごく一部の顧客に、試してみないかというメッセージが届く。ふだん友人にメッセージを送る感覚で欲しいものを文字で送ると、AIが商品を探し、カートを作り、購入まで進め、配送状況も知らせてくれる。この体験の途中には広告も試験的に表示される。", "country": "アメリカ"}, {"category": "体験", "title": "「やさい文学」は、なぜ野菜を物語に変えたのか。", "work": "やさい文学", "client": "クボタ", "agency": "博報堂", "production": "—", "award": "第5回ACCヤングコンペ グランプリ", "oneliner": "野菜の花言葉で、文学を料理にした", "steps": [{"title": "課題", "body": "記事に課題の明記はない。ただ協賛企業がクボタで、実現の場が KUBOTA AGRI FRONT CAFE だった点から、野菜や農への関心を若い世代にどう開くかが問われたと読める（解釈）。"}, {"title": "狙い", "body": "解釈として、野菜に興味が薄い人でも、好きな物語から入れば野菜を身近に感じられる、という気持ちの動きを狙ったのだろう。山岡さんは、クライアントと社会のためになることを前提に置いたと語っている。"}, {"title": "表現のしかけ", "body": "野菜の花言葉という小さな入り口を、文学という大きな物語につなげた構造が核になっている。たとえば『走れメロス』の物語を再現したスープカレーのように、読書の記憶を一皿に置き換える。企画で終わらせず、カフェのオリジナルメニューとして実際に食べられる形まで落とした点も強い。"}], "steal": "一見関係のない二つ（野菜の花言葉×文学）を「料理」という体験に着地させる。意外な組み合わせと、実物にできる出口をセットで考える。", "challenge": "身近な食材を1つ選び、名前や由来から連想できる小説や映画を決めて、再現メニューの企画を企画書1枚にまとめてみよう。", "note": "", "slug": "pm-20261109-article561086-utm-source-feed", "no": 17, "date": "2026-11-09", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261109/article561086/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/10/omoshiro-ad-20_yamaoka_ogp.jpg", "media_checked": true}, {"category": "デザイン", "title": "SOS POSは、なぜ決済端末を命綱に変えたのか。", "work": "SOS POS", "client": "BCP", "agency": "Circus Grey, Lima（サーカス・グレイ、リマ）", "production": "—", "award": "Cannes Lions 2026 Creative Data Lions グランプリ", "oneliner": "いつもの決済 <script>

try { saved = JSON.parse(localStorage.getItem('kaibo-saved') || '[]'); } catch(e) {}

const meta = p => [dash(p.client), dash(p.country) && p.country !== '日本' ? p.country : '', p.category].filter(Boolean).map(esc).join('　');

function pins(list){

      : `<div class="ph noimg" style="background:${color(p.category)}"><span class="txt">${esc(p.oneliner)}</span>`;

}

function renderCats(){
  const cats = ['すべて', ...new Set(POSTS.map(p=>p.category))];
  const html = cats.map(c=>`<button class="cat${mode==='home'&&c===cat?' on':''}" data-c="${esc(c)}" aria-pressed="${mode==='home'&&c===cat}">${esc(c)}</button>`).join('');
  ['cats-d','cats-m'].forEach(id => {
    const el = document.getElementById(id); el.innerHTML = html;
    el.querySelectorAll('.cat').forEach(b => b.onclick = () => { cat = b.dataset.c; mode = 'home'; go(''); });
  });
  const sv = document.getElementById('nav-saved');
  sv.classList.toggle('on', mode==='saved'); sv.setAttribute('aria-pressed', mode==='saved');
}

function home(){
  if(mode==='saved'){
    const list = POSTS.filter(p=>saved.includes(p.slug));

  app.innerHTML = `<div class="lead"><h1>${cat==='すべて'?'新着の解剖':esc(cat)}</h1><small>${list.length} 本</small></div>` + pins(list);
}

    ? `https://player.vimeo.com/video/${encodeURIComponent(v.id)}?dnt=1`

}

const PIN_HASH = 'e8026bda3ea2eedc7dc7bce9daa640f8cc0f33e335bd73d986a872b3ba789c71';

const ls = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };

const canEdit = () => !!ls('kaibooom-token');
let editing = false;

const E = f => editing ? ` data-f="${f}" contenteditable="true" spellcheck="false"` : '';
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function fromB64(b64){ const bin = atob(b64.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function toB64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(bin); }
const gh = () => ({ 'Authorization': 'Bearer ' + ls('kaibooom-token'), 'Accept': 'application/vnd.github+json' });

function post(slug){

  if(!p){ editing=false; go(''); return; }
  const on = saved.includes(p.slug);
  const editBtn = canEdit() && !editing ? `<button class="edit-btn" id="edit-start">${PEN}編集</button>` : '';

  const gal = (p.gallery||[]).length ? `<div class="gal">${p.gallery.map(g=>`<a href="${esc(g)}" target="_blank" rel="noopener"><img src="${esc(g)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>`).join('')}</div>` : '';
  const cover = p.image
    ? `<div class="cover"><img src="${esc(p.image)}" alt="${esc(p.work)}" referrerpolicy="no-referrer" data-c="${color(p.category)}" onerror="this.parentNode.classList.add('noimg');this.parentNode.style.background=this.dataset.c;this.parentNode.textContent=${esc(JSON.stringify(p.work))}"></div>`
    : `<div class="cover noimg" style="background:${color(p.category)}">${esc(p.work)}</div>`;
  const hasMedia = p.image || vids || gal;
  const about = p.about || editing ? `<section class="about"><h2>なんの広告？</h2><p${E('about')}>${esc(p.about)}</p></section>` : '';
  const paras = t => esc(t).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g,'<br>')}</p>`).join('');
  const body = p.points
    ? about + `<section class="sec pts"><h2>アイデア、ポイント</h2>` + (editing ? `<div class="pts-edit"${E('points')}>${esc(p.points)}</div>` : paras(p.points)) + `</section>`
    : about +
      `<section class="sec"><h2>解剖</h2><ol class="steps">${(p.steps||[]).map((s,i)=>`<li class="step"><span class="num">${i+1}</span><div><h3>${esc(s.title)}</h3><p${E('s'+i)}>${esc(s.body)}</p></div></li>`).join('')}</ol></section>` +
      `<section class="sec steal"><h2>ここを盗め</h2><p${E('steal')}>${esc(p.steal)}</p></section>` +
      `<section class="task"><h2>やってみよう</h2><p${E('challenge')}>${esc(p.challenge)}</p></section>`;
  const credit = [['作品','work'],['広告主','client'],['広告会社','agency'],['制作','production'],['受賞','award']]
    .filter(([,k]) => editing || dash(p[k])).map(([l,k]) => `<dt>${l}</dt><dd${E(k)}>${esc(p[k])}</dd>`).join('');
  const more = POSTS.filter(x => x.slug !== p.slug && x.category === p.category).slice(0, 10);
  const others = more.length >= 4 ? more : POSTS.filter(x => x.slug !== p.slug).slice(0, 10);
  app.innerHTML =
    `<div class="art"><div class="bar"><button class="ib" aria-label="一覧に戻る" onclick="history.length>1?history.back():go('')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="n">${no3(p.no)}</span><span class="sp"></span>${editBtn}</div>` +
    `<div class="wrap${editing?' editing':''}"><div class="media">${cover}${vids}${gal}` +
    (hasMedia ? `<div class="credit-img">写真・動画：<a href="${esc(p.source_url)}" target="_blank" rel="noopener">${esc(p.source_name)}</a>ほか公式より</div>` : '') +
    `</div><article class="txtcol">` +
    `<div class="k">${meta(p)}</div><h1${E('title')}>${esc(p.title)}</h1>` +
    `<p class="one"${E('oneliner')}>${esc(p.oneliner)}</p>` +
    body +
    `<div class="actions"><a class="go" href="${esc(p.source_url)}" target="_blank" rel="noopener">元の記事を読む（${esc(p.source_name)}）</a><button class="save" id="save" aria-label="${on?'保存を外す':'保存する'}" aria-pressed="${on}">${bm(on)}</button></div>` +
    `<dl class="credit">${credit}</dl>` +
    `<div class="note">作品の著作権は各権利者に帰属します。本記事は批評・解説を目的としています。</div></article></div>` +
    (editing ? '' : `<section class="more"><div class="lead"><h1>ほかの解剖</h1></div>${pins(others)}</section>`) + `</div>` +
    (editing ? `<div class="edit-bar" role="region" aria-label="編集"><div class="eb-in">
      <div class="eb-row"><span class="eb-hint">${PEN}点線の文字をタップして直せます</span></div>
      <div class="eb-row">
        <label class="eb-l">カテゴリ <select id="eb-cat">${[...new Set([...CATS, p.category])].map(c=>`<option${c===p.category?' selected':''}>${esc(c)}</option>`).join('')}</select></label>
        <label class="eb-l"><input type="checkbox" id="eb-hide"> 非公開にする</label>
        <span style="flex-grow:1"></span>
        <button class="eb-btn" id="eb-cancel">やめる</button><button class="eb-btn primary" id="eb-save">保存する</button>
      </div>
      <div class="eb-msg" id="eb-msg" role="status"></div></div></div>` : '');
  document.getElementById('save').onclick = () => {
    saved = saved.includes(p.slug) ? saved.filter(s=>s!==p.slug) : [...saved, p.slug];
    persist(); post(slug);
  };
  const st = document.getElementById('edit-start');
  if (st) st.onclick = () => startEdit(slug);
  if (editing) {
    app.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && !['s0','s1','s2','steal','challenge','about','points'].includes(el.dataset.f)) e.preventDefault(); });
    });
    document.getElementById('eb-cancel').onclick = () => { editing = false; post(slug); };
    document.getElementById('eb-save').onclick = () => saveEdit(p);
  }
}

function startEdit(slug){
  if (ss('kaibooom-unlocked') === '1') { editing = true; post(slug); return; }
  const bar = document.querySelector('.bar');
  if (document.getElementById('pin-box')) return;
  bar.insertAdjacentHTML('afterend', `<div class="pin-box" id="pin-box"><label for="pin-in">合鍵</label><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><button class="eb-btn primary" id="pin-ok">ひらく</button><span class="eb-msg" id="pin-msg" role="alert"></span></div>`);
  const input = document.getElementById('pin-in'); input.focus();
  const go = async () => {
    if (await sha256(input.value) !== PIN_HASH) { document.getElementById('pin-msg').textContent = '合鍵がちがいます'; input.select(); return; }
    ss('kaibooom-unlocked', '1'); editing = true; post(slug);
  };
  document.getElementById('pin-ok').onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function saveEdit(p){
  const btn = document.getElementById('eb-save'), m = document.getElementById('eb-msg');
  const val = f => { const el = app.querySelector(`[data-f="${f}"]`); return el ? el.innerText.replace(/ /g,' ').trim() : ''; };
  const edits = { title: val('title'), oneliner: val('oneliner'), about: val('about'), points: val('points').replace(/\n{3,}/g,'\n\n'), steal: val('steal'), challenge: val('challenge'),
    work: val('work'), client: val('client'), agency: val('agency'), production: val('production'), award: val('award'),
    category: document.getElementById('eb-cat').value, bodies: [0,1,2].map(i => val('s'+i)), hide: document.getElementById('eb-hide').checked };
  btn.disabled = true; m.className = 'eb-msg'; m.textContent = '保存中…';
  try {
    const r = await fetch(API + '?t=' + Date.now(), { headers: gh(), cache: 'no-store' });
    if (r.status === 401 || r.status === 403) throw new Error('GitHubの鍵が使えませんでした。管理ページで登録し直してください。');
    if (!r.ok) throw new Error('読み込みに失敗しました（' + r.status + '）');
    const j = await r.json(); const all = JSON.parse(fromB64(j.content));
    const t = all.find(x => x.slug === p.slug); if (!t) throw new Error('この記事が見つかりませんでした');
    ['title','oneliner','work','client','agency','production','award','category'].forEach(k => t[k] = edits[k]);
    if (edits.about || t.about) t.about = edits.about;
    if (t.points) { if (edits.points) t.points = edits.points; }
    else { t.steal = edits.steal; t.challenge = edits.challenge;
      t.steps = [0,1,2].map(i => ({ title: (t.steps && t.steps[i] && t.steps[i].title) || ['課題','狙い','表現のしかけ'][i], body: edits.bodies[i] })); }
    t.status = edits.hide ? 'hidden' : 'published';
    const put = await fetch(API, { method: 'PUT', headers: { ...gh(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `edit: No.${t.no} をサイト上で編集`, content: toB64(JSON.stringify(all, null, 2) + '\n'), sha: j.sha }) });
    if (put.status === 409) throw new Error('ちょうど自動更新と重なりました。もう一度「保存する」を押してください。');
    if (!put.ok) throw new Error('保存に失敗しました（' + put.status + '）');
    Object.assign(p, t);  // この画面にもすぐ反映
    editing = false;
    if (edits.hide) { POSTS.splice(POSTS.indexOf(p), 1); location.hash = ''; return; }
    post(p.slug);
    document.querySelector('.bar').insertAdjacentHTML('afterend', '<div class="saved-note" role="status">保存しました。公開中のサイトには1〜2分で反映されます。</div>');
  } catch(e) { m.className = 'eb-msg ng'; m.textContent = e.message; btn.disabled = false; }
}

let lastScroll = 0;
function go(hash){ if (location.hash.replace(/^#/,'') === hash) route(); else location.hash = hash; }
function route(){
  editing = false;
  const m = location.hash.match(/^#\/p\/(.+)$/);
  if (m) { if (!app.querySelector('.art')) lastScroll = window.scrollY; post(decodeURIComponent(m[1])); window.scrollTo(0,0); }
  else { home(); window.scrollTo(0, lastScroll); lastScroll = 0; }
  renderCats();
}
document.getElementById('home-link').onclick = e => { e.preventDefault(); cat='すべて'; mode='home'; lastScroll=0; go(''); };
document.getElementById('nav-saved').onclick = () => { mode = mode==='saved' ? 'home' : 'saved'; lastScroll=0; go(''); };
window.addEventListener('hashchange', route);
route();
</script>
