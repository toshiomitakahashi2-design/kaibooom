<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIBOOOM 広告解剖</title>
<meta name="description" content="すぐれた広告・クリエイティブ・デザインを、プロの目で解剖するメディア。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000; --body:#2B2B2B; --sub:#707070; --line:#E8E8E8; --soft:#F4F4F4;
  --cut:#2742E8; --cut-ink:#FFFFFF; --overlay:rgba(0,0,0,.42);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F0F0F; --ink:#F5F5F5; --body:#D4D4D4; --sub:#9A9A9A; --line:#262626; --soft:#1A1A1A;
    --cut:#6E82FF; --cut-ink:#0F0F0F; --overlay:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#0F0F0F; --ink:#F5F5F5; --body:#D4D4D4; --sub:#9A9A9A; --line:#262626; --soft:#1A1A1A;
  --cut:#6E82FF; --cut-ink:#0F0F0F; --overlay:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cut);outline-offset:2px;border-radius:6px}
img{display:block;max-width:100%}

/* ---------- ロゴ：メスで切った KAIBOOOM ---------- */
.logo{position:relative;display:inline-block;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1;color:var(--ink);white-space:nowrap}
.logo>span{display:block}
.logo .lt{clip-path:inset(0 0 50% 0)}
.logo .lb{position:absolute;inset:0;clip-path:inset(50% 0 0 0);transform:translateX(4px)}
.logo::after{content:"";position:absolute;left:-3px;right:-6px;top:50%;height:1.5px;margin-top:-.75px;background:var(--cut)}
.logo.big{font-size:44px}
.logo.big .lb{transform:translateX(6px)}
.logo.big::after{height:2px;margin-top:-1px;left:-8px;right:-14px}

/* ---------- ヘッダー（小さめ・固定） ---------- */
.hd{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1680px;margin:0 auto;height:52px;padding:0 16px;display:flex;align-items:center;gap:18px}
.tagline{font-size:12px;color:var(--sub);display:none}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;height:32px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--sub)}
.cat:hover{color:var(--ink);background:var(--soft)}
.cat.on{background:var(--ink);color:var(--paper)}
.tools{display:flex;gap:2px;margin-left:auto;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib.on{color:var(--cut)}
.cats-m{display:flex;padding:0 12px 8px}
.hd-in .cats{display:none}
@media (min-width:760px){
  .tagline{display:block}
  .cats-m{display:none}
  .hd-in .cats{display:flex}
  .hd-in{padding:0 24px}
}

/* ---------- ピンタレスト風グリッド ---------- */
main{max-width:1680px;margin:0 auto;padding:16px 10px 64px}
@media (min-width:760px){main{padding:24px 24px 80px}}
.lead{display:flex;align-items:baseline;gap:12px;padding:4px 4px 16px}
.lead h1{margin:0;font-family:'Zen Old Mincho',serif;font-size:20px;font-weight:700}
.lead small{font-size:12px;color:var(--sub)}
.mason{column-count:2;column-gap:10px}
@media (min-width:720px){.mason{column-count:3;column-gap:16px}}
@media (min-width:1100px){.mason{column-count:4}}
@media (min-width:1480px){.mason{column-count:5}}
.pin{break-inside:avoid;display:block;margin-bottom:18px}
.pin .ph{position:relative;border-radius:14px;overflow:hidden;background:var(--soft)}
.pin .ph img{width:100%;height:auto}
.pin .ph::after{content:"";position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity .15s}
.pin:hover .ph::after{opacity:1}
.pin .no{position:absolute;left:10px;top:10px;z-index:1;font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:11px;color:#fff;opacity:0;transition:opacity .15s}
.pin:hover .no{opacity:1}
.pin .vid{position:absolute;right:10px;bottom:10px;z-index:1;width:28px;height:28px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.pin .txt{display:none;padding:18px 16px 22px;font-family:'Zen Old Mincho',serif;font-size:17px;font-weight:700;line-height:1.6;color:#fff}
.pin .ph.noimg .txt{display:block}
.pin .ph.noimg::after{display:none}
.pin .t{margin:8px 4px 0;font-size:13.5px;font-weight:700;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pin .m{margin:3px 4px 0;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.pin .ph::after,.pin .no{transition:none}}
.empty{padding:72px 16px;text-align:center;color:var(--sub);line-height:1.9}

/* ---------- 記事ページ ---------- */
.art{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding:0 0 14px}
.bar .n{font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:13px;color:var(--sub)}
.bar .sp{flex:1}
.wrap{display:grid;gap:28px}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:start}.media{position:sticky;top:76px}}
.media{display:flex;flex-direction:column;gap:12px}
.cover{border-radius:18px;overflow:hidden;background:var(--soft)}
.cover img{width:100%;height:auto}
.cover.noimg{aspect-ratio:4/3;display:flex;align-items:flex-end;padding:24px;color:#fff;font-family:'Zen Old Mincho',serif;font-size:22px;font-weight:700;line-height:1.6}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gal a{border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:4/3}
.gal img{width:100%;height:100%;object-fit:cover}
.credit-img{font-size:11.5px;color:var(--sub)}
.credit-img a{text-decoration:underline}
.txtcol{max-width:600px}
.k{font-size:12.5px;color:var(--sub);line-height:1.7}
.txtcol h1{margin:8px 0 0;font-family:'Zen Old Mincho',serif;font-weight:700;font-size:25px;line-height:1.55;letter-spacing:.01em}
@media (min-width:900px){.txtcol h1{font-size:30px}}
.one{margin:16px 0 0;font-size:16px;font-weight:700;line-height:1.75;padding-left:14px;border-left:2px solid var(--cut)}
.about{margin:28px 0 0;padding:18px 20px;border-radius:14px;background:var(--soft)}
.about h2,.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--sub)}
.about p{margin:8px 0 0;font-size:15px;line-height:1.95;color:var(--body)}
.sec{margin-top:32px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:22px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.step .num{font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:700;font-size:14px;color:var(--cut);padding-top:2px}
.step h3{margin:0 0 4px;font-size:15px;font-weight:700}
.step p{margin:0;font-size:15px;line-height:1.95;color:var(--body)}
.pts p{margin:12px 0 0;font-size:15.5px;line-height:2.05;color:var(--body)}
.pts p:first-of-type{margin-top:10px}
.pts-edit{margin:10px 0 0;font-size:15.5px;line-height:2.05;color:var(--body);white-space:pre-wrap}
.steal p{margin:8px 0 0;font-family:'Zen Old Mincho',serif;font-size:17px;font-weight:700;line-height:1.85}
.task{margin-top:28px;padding:18px 20px;border-radius:14px;background:var(--cut);color:var(--cut-ink)}
.task h2{margin:0;font-size:13px;font-weight:700;opacity:.85}
.task p{margin:8px 0 0;font-size:15px;line-height:1.9;font-weight:500}
.credit{margin:32px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);line-height:1.9;display:grid;grid-template-columns:6em minmax(0,1fr)}
.credit dt{color:var(--sub)}
.credit dd{margin:0;color:var(--ink)}
.credit a{text-decoration:underline}
.actions{display:flex;gap:8px;margin-top:24px}
.go{flex:1;min-height:46px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:0 16px}
.save{width:46px;height:46px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.save[aria-pressed="true"]{color:var(--cut);border-color:var(--cut)}
.note{margin-top:16px;font-size:11px;color:var(--sub);line-height:1.7}
.more{margin-top:64px;padding-top:24px;border-top:1px solid var(--line)}
.more .lead{padding-left:0}

/* ---------- その場で編集 ---------- */
.edit-btn{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.pin-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:12px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:700}
.pin-box input{width:110px;font-size:18px;letter-spacing:.3em;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.editing [contenteditable]{outline:1.5px dashed var(--cut);outline-offset:3px;border-radius:4px;cursor:text;min-height:1.4em}
.editing [contenteditable]:focus{outline-style:solid}
.editing .task [contenteditable]{outline-color:currentColor}
.editing{padding-bottom:150px}
.edit-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--cut);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.eb-in{max-width:1180px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.eb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eb-row+.eb-row{margin-top:8px}
.eb-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--cut);font-weight:700}
.eb-l{font-size:13px;display:flex;align-items:center;gap:6px}
.eb-l select{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.eb-l input{width:18px;height:18px}
.eb-btn{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:700}
.eb-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.eb-btn:disabled{opacity:.5}
.eb-msg{font-size:13px;margin-top:4px;min-height:1em}
.eb-msg.ng,#pin-msg{color:#C4321F}
.saved-note{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:#E7F5EC;color:#14532D;font-size:13px;font-weight:700}
</style>
</head>

//prcdn.freetls.fastly.net/release_image/192919/1/192919-1-26f004bc85086c5fe348544d9265cc22-547x308.jpg?width=1950&height=1350&quality=85&format=jpeg&auto=webp&fit=bounds&bg-color=fff", "https://prcdn.freetls.fastly.net/release_image/192919/1/192919-1-9c8d5c7977013800d94a17d5e001b43e-713x305.jpg?width=1950&height=1350&quality=85&format=jpeg&auto=webp&fit=bounds&bg-color=fff", "https://prcdn.freetls.fastly.net/release_image/192919/1/192919-1-565d423e62c6db06cea50f413529a51d-1779x998.jpg?width=1950&height=1350&quality=85%2C65&format=jpeg&auto=webp&fit=bounds&bg-color=fff", "https://prcdn.freetls.fastly.net/release_image/192919/1/192919-1-81e5e31a36bd2c6a9306a18ec2311573-247x239.jpg?width=1950&height=1350&quality=85&format=jpeg&auto=webp&fit=bounds&bg-color=fff", "https://prcdn.freetls.fastly.net/release_image/192919/1/192919-1-26f004bc85086c5fe348544d9265cc22-547x308.jpg?format=jpeg&auto=webp&fit=bounds&width=720&height=480", "https://prcdn.freetls.fastly.net/release_image/192919/1/192919-1-9c8d5c7977013800d94a17d5e001b43e-713x305.jpg?format=jpeg&auto=webp&fit=bounds&width=720&height=480"], "videos": [{"type": "youtube", "id": "6UpaiMoxd3c"}], "media_checked": true, "about": "花王のヘアケアブランド「merit（メリット）」が、家族に向けて2026年春に公開した60秒のアニメCMです。春夏秋冬を手をつないで歩く父と娘を、椎名林檎「ギブス」のカバーにのせて描きます。イラストはニシワキタダシさんです。2026 ACC TOKYO CREATIVITY AWARDSでグランプリを受賞しています。", "country": "日本", "points": "このCMは、「手」だけで話が進みます。父は一貫して娘の後ろに立ち、つないだ手を通して娘の背中を見ています。動物園のキリン、季節が変わって飛んでくるトンボ、冬の雪だるま、春の蝶と、出来事はすべて娘が前へ進んだ先で起こります。親が見ているのは、自分が連れていく景色ではなく、子どもが自分で見つけていく景色だという位置関係が、構図からわかります。\n\n終盤、娘は新しくできた友だちと手をつなぎ、父に一言だけ声をかけて走っていきます。ここで「成長した」「寂しい」といった気持ちを言葉で説明することはなく、手がつながっているか離れているかだけで関係の変化を示しています。それまで何度も手を握る場面を重ねてきたため、手を離す一瞬の重みが伝わります。\n\n切なさの余韻を残したまま、場面は親子で入るお風呂に移ります。商品が出てくるのは、成長の節目ではなく、一日の終わりの習慣のところです。寂しさの直後に商品を出すのは気をつかうところで、毎日の習慣の中に置けば余韻を壊さずに商品に落とせたのではと想像します。"}, {"slug": "mcd-tsukimi-tabemi", "no": 3, "date": "2026-11-07", "category": "SNS", "title": "月見食べ美は、ダブチの人気を月見へ持ち込んだ", "work": "いまだけ月見食べ美（ショート動画・MV）", "client": "日本マクドナルド", "agency": "電通", "production": "ギークピクチュアズ", "award": "2026 ACC フィルム部門Bカテゴリー（Online Film） 総務大臣賞／ACCグランプリ", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/?p=515109", "oneliner": "月見バーガーの宣伝隊長キャラクターが月夜で踊るSNS動画", "image": "https://cdn.advertimes.com/wp-content/uploads/2025/09/tsukimitabebi_ogp2.jpg", "media_checked": true, "about": "日本マクドナルドが、秋の「月見バーガー」の展開に合わせてSNSで公開したショート動画とMVです。宣伝隊長のキャラクター「いまだけ月見食べ美」が、月夜の中で歌い、踊ります。X、Instagram、TikTokで公開されました。", "country": "日本", "points": "前年の「いまだけダブチ食べ美」と同じく、イラストレーターのはまふぐ氏がキャラクターを描いています。前作は多くの二次創作を生んだキャラクターでした。商品が変わっても、同じ作り手が同じ枠のキャラクターを立てることで、前作を知る人は新作を一続きのものとして受け取れます。実績があるぶん、この続投は提案として通しやすかったのではと想像します。\n\n月見の題材には「かぐや姫」が選ばれています。月と結びつく昔話を下敷きにすることで、商品の説明を重ねなくても、月夜で踊る場面が月見の絵として成立します。そこに、ヤマモトショウ氏の作詞作曲、mikoさんの歌声、SACO MAKITA氏の振り付けが加わり、実写とアニメを組み合わせた映像になっています。\n\n公式の説明では、この動画は文脈を読んで楽しむXと、文脈を問わず映像や音で見るTikTokやInstagramの両方で反響を得たといいます。電通プランナーの花田礼氏は、商品そのものにとどまらず、マクドナルドならではの「月見」を楽しんでもらいたいと語っています。"}, {"slug": "suntory-nope", "no": 2, "date": "2026-11-07", "category": "広告", "title": "ギルティ炭酸 NOPE、黒とマゼンタと囚人服の設計", "work": "ギルティ炭酸 NOPE（ノープ）／テレビCM「ギルティ監獄」篇ほか", "client": "サントリービバレッジ＆フード", "agency": "—", "production": "—", "award": "2026 ACC マーケティング・エフェクティブネス部門ほか 二冠", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/?p=556400", "oneliner": "囚人服で欲望のままに飲む、新炭酸ブランドの展開", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/09/suntory_nope_over-100-million-sold_ogp.jpg", "media_checked": true, "about": "サントリービバレッジ＆フードが3月24日に発売した炭酸飲料「ギルティ炭酸 NOPE（ノープ）」の広告展開です。生田斗真、鈴鹿央士、アントニーが囚人服で欲望のままに飲むテレビCM「ギルティ監獄」篇を放送し、BOSSの自販機ロゴをNOPEで上書きする施策も行いました。発売150日で累計1億本を超えています。", "country": "日本", "points": "まず目を引くのは、パッケージの色の使い方です。炭酸飲料の棚では見かけないブラック＆マゼンタを採用し、モザイクをかけても識別できるほどの記号化を目指したといいます。文字を読ませる前に色の組み合わせで分かるため、売り場の棚でも、SNSの小さな画像でも見分けがつきます。\n\nCMは「ギルティ」という言葉を、囚人服という分かりやすい絵に置き換えています。罪悪感を覚えるほどおいしい、という味の説明を、監獄で欲望のままに飲む人の姿で見せる形です。理屈で納得させるより先に、状況そのものが突っ込みどころになります。そのためX上では、ユーザーが“大喜利”のように投稿しやすくなりました。\n\n自販機の施策も同じ考え方に見えます。サントリーの代名詞的な存在であるBOSSの自販機ロゴを、NOPEの黒とマゼンタで上書きしました。誰もが知っている既存の記号の上に自分の色を重ねるので、街で見つけた人が「見つけた」と報告しやすくなります。ただ、相手がBOSSだから成り立つ手で、知名度の低いロゴでは同じ反応は起きにくいのではと考えます。"}, {"slug": "mangalogue-hinotori", "no": 1, "date": "2026-11-07", "category": "体験", "title": "マンガを読む視線ごと、劇場に持ち込んだ「火の鳥」", "work": "MANGALOGUE（マンガローグ）：火の鳥", "client": "JR東日本文化創造財団", "agency": "TBSテレビ（企画制作）", "production": "TBS、Bascule", "award": "2026 ACC デザイン部門ほか 三冠", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/?p=542159", "oneliner": "手塚治虫の原稿を巨大LEDで読む、体験型ライブ公演", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/04/OGP-1-2.jpg", "videos": [{"type": "youtube", "id": "DL1hkuPNN-I"}], "media_checked": true, "about": "JR東日本文化創造財団が、複合型ミュージアム「MoN Takanawa」の開館記念公演として、4月22日に開幕させたライブパフォーマンスです。手塚治虫「火の鳥 未来編」の原稿を巨大LEDに映し、ロボットアームがコマを追うなか、声優陣の演技が重なります。会場はシアター空間「Box1000」です。", "country": "日本", "points": "見どころは、マンガを映像や演劇に置き換えず、「読む」という行為そのものを上演にした点です。ロボットアーム「鉄腕アーム」がカメラの視点でコマを追い、巨大LEDには原稿が映されます。読者が普段ひとりで無意識にこなしている、大きなコマから小さなコマへ視線を移す動きやページをめくる間合いを、会場の全員が同じ速さで体験します。読む速さは人によって違うので、それをひとつに決める判断は、作り手にとって迷いどころだったのではと想像します。動くのは絵ではなく視点なので、原作の画面構成が演出の骨格として残ります。\n\nキャスティングにも仕掛けがあります。松任谷由実の過去の歌声データを学習させたAI音声「Yumi AraI」が、歌手ではなく声優として、AIハレルヤ／ダニューバー役を演じます。題材の「火の鳥 未来編」は、AIやロボットと共に生きる社会を描いた作品です。物語の内容と、AI音声が役を担う配役が同じ方向を向いています。"}, {"category": "広告", "title": "日本代表ユニフォームを「エゴ」の一着にする試み", "work": "アディダス サッカー日本代表 2026 ユニフォーム ブルーロック カスタム 世界でひとつのエゴジャージを", "client": "アディダス ジャパン", "agency": "—", "production": "—", "award": "講談社メディアアワード2026 受賞", "oneliner": "ブルーロックの絵で日本代表ユニフォームを作り替える企画", "slug": "pm-20261106-article563356-utm-source-feed", "no": 6, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563356/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/kodansha-media-conf2026_media-awards2026_ceremony_ogp.jpg", "media_checked": true, "country": "日本", "about": "アディダス ジャパンが、2026年のFIFAワールドカップに合わせて、サッカー漫画「ブルーロック」とコラボしたキャンペーンです。描き下ろしイラストを使い、日本代表ユニフォームをカスタマイズできる体験を用意しました。サッカーメディア「ゲキサカ」での発信と店頭施策も組み合わせています。2026年の講談社メディアアワードを受賞しています。", "points": "見どころは、作品の核にある「エゴ」という言葉を、ユニフォームのカスタムにそのまま重ねたところです。「ブルーロック」は、ストライカーが自分のエゴをむき出しにして勝ち残っていく物語です。「世界でひとつのエゴジャージ」という題は、この作品の主題を商品の説明に変えています。代表ユニフォームは、全員が同じ一着を着て同じ代表を応援するものです。そこに「自分だけの一着」を足すのは、代表への一体感を薄めないかという点で、作り手が迷うところだったのではと想像します。\n\n二つ目は、置き場所の選び方です。この企画は、日本代表ユニフォームという商品の上に、漫画のイラストを載せています。情報の発信はサッカーを追う人が集まる「ゲキサカ」で行い、実物に触れる場は店頭に置きました。漫画のファンとサッカーのファンを、同じ一着に集める設計です。\n\nゼビオグループ全店舗での日本代表ユニフォームの販売枚数は、過去最高の3万点でした。"}, {"category": "広告", "title": "ピザーラのDr.STONE広告は、なぜ謝罪に至ったのか。", "work": "ピザーラ×「Dr.STONE」コラボ企画（TikTok広告）", "client": "フォーシーズ（ピザーラ）", "agency": "—", "production": "—", "award": "—", "oneliner": "便利な自動化が、IPの信頼を壊した反面教師", "steps": [{"title": "課題", "body": "ピザーラは10月1日〜11月1日にDr.STONEとコラボ企画を展開し、限定ピザや描き下ろしイラスト付きグッズを販売した。ところが10月末ごろ、TikTok広告がAI生成のようだと疑問視され、許諾を問う声も上がった。"}, {"title": "狙い", "body": "コラボの狙いは、作品ファンに「世界観ごと楽しめるピザ」を届けることだと読める。限定ピザに作品を連想させる名前をつけ、描き下ろしも用意したのは、ファンの「好き」に寄り添う設計だ。"}, {"title": "表現のしかけ", "body": "今回の本質は、表現の巧拙より配信設定にある。同社の説明では、TikTok広告のAI自動生成・配信機能を意図せず有効にしたまま設定を完了し、製作委員会の監修や許諾を受けていない動画が配信された。動画の中身は記事では詳しく語られていない。ただ、商品や描き下ろしは丁寧に作り込んだのに、広告だけ自動生成に任せたことで、ファンが期待する世界観の一貫性が崩れたと考えられる。"}], "steal": "制作物だけでなく、配信設定まで含めて「作品」と考える。公開前に、自動生成や自動最適化のオン・オフを確認項目に入れておこう。", "challenge": "好きなアニメとのコラボ広告を想定し、公開前に確認すべき項目を10個のチェックリストにまとめてみよう。", "slug": "pm-20261106-article563310-utm-source-feed", "no": 7, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563310/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/pizzala-drstone_ogp.jpg", "media_checked": true}, {"category": "映像", "title": "VENEXのCMは、買う前に止めるから信頼を得る", "work": "VENEX 新テレビCM「買わせない男」篇（30秒）", "client": "ベネクス", "agency": "—", "production": "—", "award": "—", "oneliner": "本田圭佑が購入を止める、リカバリーウェアのCM", "slug": "pm-20261105-article563192-utm-source-feed", "no": 8, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563192/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/venex01.jpg", "videos": [{"type": "youtube", "id": "XtGq0cJjDsc"}], "media_checked": true, "about": "リカバリーウェアブランド「VENEX（ベネクス）」の新テレビCMです。ホイッスルの音と「STOP」のアイコンのあとに本田圭佑が現れ、購入を検討中の人へ「すぐに買わないでください」と語りかけます。独自のPHT繊維の紹介を挟み、最後に本田がブランド名を発します。11月7日から関東地区で放映が始まりました。", "country": "日本", "points": "このCMは、広告が普通なら言わない「買わないで」を冒頭に置いています。商品を売りたい広告が購入を止めると、見る側は理由を知りたくなります。\n\n止める声の主はVENEXを着て現れるので、「買わないで」と言いながら商品は画面にあります。ブランド名を声に出すのは最後なので、その前に着用で見せておく判断だったのではと想像します。\n\nもう一つは、止める理由の組み立てです。「衝動買いはよくないですね」と述べ、まだ買っていない人にはより自分に合う製品を探す余地があるとして、比較を促します。リカバリーウェアは参入が増え、選択肢が多い市場です。その中で他社と比べられても構わないと言うことは、商品への自信を示すことになります。\n\n語り手に本田圭佑を置いたことも、この構成を支えています。「伸びしろ」という本人らしい言葉が入ることで、制止は説教ではなく、選ぶ人の可能性を見込んだ助言として聞こえます。PHT繊維の紹介は後半の短いナレーションに留め、30秒の大半を「買わせない」という一つの主張に使っています。"}, {"category": "映像", "title": "ゲームの「入手メッセージ」に政権の実績を入れた44秒", "work": "THE LEGEND OF TRUMP: MAKE AMERICA GREAT AGAIN", "client": "米ホワイトハウス", "agency": "—", "production": "—", "award": "—", "oneliner": "ホワイトハウスが出した、ゼルダ風の政権実績紹介動画", "slug": "pm-20261106-article563322-utm-source-feed", "no": 9, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563322/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/the-white-house_official-x_remake_the-legend-of-zelda_ogp1.jpg", "media_checked": true, "about": "米ホワイトハウスが2026年11月5日、公式Xに投稿した44秒の動画です。「ゼルダの伝説 時のオカリナ」のリメイク版の発売日に合わせ、ローポリゴン調のトランプ大統領が主人公リンクの位置に立って森を進みます。体力ゲージや地図が並ぶ画面に、政権が主張する実績が次々と表示されます。", "country": "アメリカ", "points": "見どころは、アイテムを手に入れたときのメッセージ表示を、実績の見せ方に使っている点です。「最恵国待遇に基づく薬価設定を発見した」という一文では、政策がダンジョンで見つけた宝のように扱われます。処方薬価格の下落幅、殺人発生率の低さ、不法移民を釈放していない月数といった主張も、ゲームの短い文言の枠に収まっています。一行に収まる分、どの成果をどう削るかが作り手の迷いどころだったのではと想像します。\n\n元ネタの使い方は投稿文にも表れています。「It’s dangerous to go alone! Take this」は初代「ゼルダの伝説」の有名なセリフで、その後ろに星条旗の絵文字が置かれています。動画の中でも、リンクの帽子にあたる赤い帽子に「STILL YOUR PRESIDENT」と書かれ、画面の隅々まで原作の型に合わせてあります。元のゲームを知らなくても、体力ゲージや地図でゲーム画面だとわかります。\n\n一方で、人気ゲームの発売日という話題に乗るやり方には、素材の持ち主が別にいるという問題もついてきます。同シリーズを模した動画は9月にも公開されており、今回が2度目です。SNSでは任天堂に法的措置を求める声や、政府の広報姿勢への批判が出ています。"}, {"category": "体験", "title": "洗った跡が絵になる。ケルヒャーが渋谷に残した足跡と寄せ書き", "work": "「渋谷を洗ってます」アクション（洗伝プロジェクト）／「洗キュー！寄せ書き」", "client": "ケルヒャー ジャパン", "agency": "—", "production": "—", "award": "—", "oneliner": "高圧洗浄機で渋谷の汚れを落とし、足跡と感謝の言葉を描いた施策", "slug": "pm-20261105-article563157-utm-source-feed", "no": 10, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563157/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/karcher_proj_shibuya_hachiko-paw-prints_thx-hands_ogp.jpg", "media_checked": true, "about": "ドイツの清掃機器メーカー、ケルヒャーの日本法人が、渋谷の街で高圧洗浄機を使い、汚れを落として絵や文字を浮かび上がらせました。ハチ公前広場から宮下公園へ続く足跡と、閉店を控えるハンズ渋谷店への寄せ書きメッセージです。", "country": "日本", "points": "この施策では、絵の描き方がそのまま商品の機能になっています。足跡や文字の形に抜いたパネルを壁や地面に当て、高圧洗浄機で水を吹きつけます。水が当たった部分だけ汚れが落ちて下の色が出るため、洗った面と洗っていない面の差だけで図柄ができます。できあがった絵が洗浄力の見本になり、描くほど街が実際にきれいになるので、「楽しく」と「きれいに」が同じ作業で成り立っています。ただ、絵は汚れがあってはじめて浮かびます。ハロウィーン明けの日取りは、それを見込んだ判断だったのではと想像します。\n\nハチ公前広場から宮下公園の階段へ点々と続く足跡は、渋谷駅前のハチ公が宮下公園のハチ公像まで散歩したという設定で、道のりが小さな物語になっています。一方、48年の歴史に幕を下ろすハンズ渋谷店では、感謝の言葉を描きました。西武、ロフト、タワーレコード、渋谷109などから届いたメッセージをパネルにし、一般の参加者も加わっています。「HANDS F♡REVER」「またいつか」といった言葉が、屋上に浮かび上がりました。"}, {"category": "映像", "title": "くぅーっ！の次を探して、THE DRYは「ダァー!!」にたどり着いた", "work": "THE DRY 新テレビCM『登場』篇(30秒)", "client": "サントリー", "agency": "—", "production": "—", "award": "—", "oneliner": "強炭酸チューハイの刺激を、猪木の「ダァー!!」で表すCM", "slug": "pm-20261104-article563101-utm-source-feed", "no": 11, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261104/article563101/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/suntory_the-dry_cm_sns_ogp.jpg", "videos": [{"type": "youtube", "id": "6485HrkbDCU"}], "media_checked": true, "about": "サントリーが新ブランド「THE DRY」のグリーンレモンとグレープフルーツの発売に合わせて流したテレビCMです。黒い空間にアントニオ猪木のテーマ曲が流れ、坂口憲二が緑のタオルを首にかけます。THE DRYを飲み、力いっぱい「ダァー!!」と叫ぶ30秒で、40代の大人に向けています。", "country": "日本", "points": "お題は、強炭酸のノドへの刺激をどう伝えるかでした。ビールには、飲んだ後の「くぅーっ！」という定番の一言があります。チームはそれに当たるものを探し、強い刺激を受けるとノドが開いて「アァァー」に近い声が出る、という身体の反応に着目しました。その最上級として出てきたのが「ダァー」です。味や炭酸の強さを言葉で説明せず、飲んだ直後の声だけで刺激の強さを見せています。\n\n「ダァー!!」はアントニオ猪木の掛け声でもあります。テーマ曲と、引退式の一節を心の中で語る場面と、叫びの前に猪木を思わせる要素を順に置いています。そのため、猪木を知る世代は、叫びの前から何が起こるのか見当がつきます。猪木を知らない人には通じにくい仕掛けです。ただ狙うのは40代なので、割り切れる判断だったのではと想像します。\n\n起用された坂口憲二は、俳優業を離れてコーヒーブランドを立ち上げ、のちに復帰した人物です。さらに、猪木の盟友で「黄金コンビ」と呼ばれた坂口征二の次男でもあります。仕事終わりに自分をねぎらう40代という商品のターゲットに合う生き方と、猪木との縁が重なっています。"}, {"category": "体験", "title": "シールの下に、言えなかった一言がある。Silent Voice Card", "work": "Silent Voice Card", "client": "Twinkle Wave（電通社内のベビーロス啓発プロジェクト）", "agency": "—", "production": "—", "award": "—", "oneliner": "ベビーロス当事者の本音をシールの下に隠したカード", "slug": "phttps-dentsu-ho-com-articles-9906", "no": 12, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9906", "status": "published", "image": "https://cdn.dentsu-ho.com/408ff208-7596-4f3f-b2c1-807e40740b9c/OGP%EF%BC%9A1200%C3%97630.jpg", "gallery": ["https://dentsu-ho.com/articles/9906"], "media_checked": true, "about": "電通社内のベビーロス啓発プロジェクト「Twinkle Wave」が、講演会後のワークショップで参加者に配ったカード型ツールです。表には当事者の一言が書かれ、その下にシールが貼られています。剥がすと、口に出されなかった本音が現れます。", "country": "日本", "points": "表には「流産をしたので、少し休暇をいただけませんか。初期の流産でした」という、職場で実際に届きそうな一言があります。参加者は上司の立場で自分の反応を考えてから、シールを剥がします。下には「急に休む理由を、どこまで説明したらいいんだろう」といった声が書かれています。\n\n講演で菅氏は、職場の問題を「見えているものと見えていないもののギャップ」と表現しました。カードはこの構造をそのまま使っています。職場から見えるのは短い申告だけで、本音はシールの下に隠れています。剥がすという手の動きが、見えていなかったものに触れる感覚になります。下の声は強い訴えではなく、小さな戸惑いです。言葉を強くすると読む側が身構えてしまうため、抑えたのではと想像します。\n\n裏面には、推奨される声かけの例と、参加者が自分の言葉を書き込む空欄があります。読んで終わらず、その場で書くところまでが一枚に収まっています。"}, {"category": "広告", "title": "面接前のイヤホンに、丸の内の街が話しかける", "work": "フレー！フレー！就活生", "client": "三菱地所", "agency": "電通", "production": "電通クリエイティブピクチャーズ", "award": "Spotify Hits Japan 2026 グランプリ「Spotify Mic Drop」", "oneliner": "丸の内の街が就活生にエールを送る、三菱地所の音声広告", "slug": "pm-20261106-article563296-utm-source-feed", "no": 13, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261106/article563296/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/spotif_hits-japan2016_award-ceremony_ogp.jpg", "media_checked": true, "about": "三菱地所が就活生に向けて展開した応援キャンペーンです。Spotifyの音声広告では、就活経験者や社員の実体験をもとに、丸の内の街が語り手となって応援メッセージを届けます。街中の屋外広告や、カフェの「就活生割」とも連動しました。Spotify Hits Japan 2026でグランプリを受賞しています。", "country": "日本", "points": "いちばんの見どころは、語り手を企業ではなく「街」にしたことです。丸の内は、多くの就活生を見守ってきた街です。その立場から話す形にすると、不動産会社が学生に呼びかける構図になりません。ただ就活生を励ますだけでは、三菱地所の広告としては着地しにくくなります。語り手を丸の内にしたのは、応援をそのまま街の話にして、商品に落とすためだったのではと想像します。\n\n声の中身が、就活経験者や社員の実体験をもとにしている点も効いています。励ましの言葉が一般論にとどまらず、実際に面接前の時間を過ごした人の話として聞こえます。\n\nもう一つは、届ける場面の選び方です。就活生が面接前の不安を和らげるために音楽を聴くという行動に着目し、イヤホンの中という、ひとりになる時間に声を置きました。その後、街で屋外広告を見かけ、カフェで就活生割を使うと、耳で聞いた声と同じ街に実際に立っていることになります。音声が街の体験への入り口になり、応援が言葉だけで終わらない設計です。"}, {"category": "体験", "title": "正体がわからないから、遊びが続く。「みらいのたまご」の鳴き声", "work": "みらいのたまご", "client": "PLAY! PARK", "agency": "電通（AIうえおラボ）", "production": "—", "award": "—", "oneliner": "貼った素材で鳴き声が変わる、キッズパークのたまご型AI体験", "slug": "phttps-dentsu-ho-com-articles-9898", "no": 14, "date": "2026-11-07", "source_name": "電通報", "source_url": "https://dentsu-ho.com/articles/9898", "status": "published", "image": "https://cdn.dentsu-ho.com/c2de385c-462a-4806-89fd-0a4953c56077/ai-ueo-lab_ogp.jpg", "gallery": ["https://cdn.speedsize.com/e7df76a9-4406-40f5-bc97-57e7c2c2d99d/https://cdn.dentsu-ho.com/dc034943-534c-400a-99d3-ee50864a100c/hara-misaki_pr.jpg/f_auto,w_3840", "https://cdn.speedsize.com/e7df76a9-4406-40f5-bc97-57e7c2c2d99d/https://cdn.dentsu-ho.com/9cbd4d14-1b9d-46f9-86fa-724f654e743c/iida02%E3%81%AE%E3%82%B3%E3%83%92%E3%82%9A%E3%83%BC.jpg/f_auto,w_3840", "https://dentsu-ho.com/articles/9898"], "media_checked": true, "about": "電通のAIうえおラボと、東京都立川市の屋内キッズパークPLAY! PARKが、子どもと保護者向けに開いた体験型イベントです。子どもがたまごに「もふもふ」「とげとげ」などの素材を貼ると、中から不思議な鳴き声が聞こえます。約6500名が訪れました。", "country": "日本", "points": "見どころは、AIに答えを出させなかったことです。たまごに貼られた素材を天井のカメラが読み取り、AIが「ころころ」「にょろにょろ」「もふもふ」「ひらひら」「とげとげ」の割合を分析します。その割合で、なじみのある30種類の生き物の声を組み替え、約300万通りの鳴き声にします。ただ、聞いても何の生き物か特定できないようにしてあります。「犬だ」と分かった時点で想像は終わるため、あえて余白のある音にしています。子どもたちは「おなかが鳴っている音だ」など、それぞれ違う答えを出していました。\n\nもう一つは、AIを見せない作りです。パソコンやモニターは隠し、カメラは装飾だけを読み取る向きに調整されています。子どもにとっては、素材を貼ると声が返ってくる遊びです。\n\n仕上げは人の手で行われています。音楽家兼エンジニアが、音の聞こえ方や刺激の強さを調整しました。初期には熊のような怖い音も出たため、柔らかい抽象的な音に寄せ直しています。スピーカーも、たまごの端から奥へ埋め込む位置に変えました。別の場所から音を出したとき、子どもに「たまごから聞こえてこない」と見抜かれたためです。\n\n怖すぎず、特定の生き物にも聞こえない。その狭い幅は数値では決めにくく、耳で確かめながら詰めていったのではと想像します。"}, {"category": "映像", "title": "二つの気候を行き来する人が、XShelterの寒暖差を語る", "work": "XShelter 松岡昌宏起用テレビCM", "client": "ワークマン", "agency": "—", "production": "—", "award": "—", "oneliner": "寒暖差に強い防寒ウェアを、2拠点生活の俳優で伝えるCM", "slug": "pm-20261105-article563143-utm-source-feed", "no": 15, "date": "2026-11-07", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261105/article563143/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/11/workman_xshelter_masahiro-matsuoka_cm_ogp.jpg", "media_checked": true, "country": "日本", "about": "ワークマンが機能性ウェア「XShelter（エックスシェルター）」の新テレビCMを、2026年11月6日から放映します。俳優の松岡昌宏を起用し、寒い屋外から暖房の効いた室内へ移るときの不快感を抑える「快適断熱Σ（シグマ）」を伝えます。タレント起用は同シリーズで初です。", "points": "このCMで前に出ているのは、4シリーズのうち5〜30℃の寒暖差に対応する「快適断熱Σ」です。素材の性能より、「寒い外から暖かい室内へ移る」という使う場面が商品の価値になっています。そこに置かれたのが、札幌市出身で、函館に仕事や宿泊のできる拠点を持ち、北海道と東京を行き来している松岡昌宏です。気候の違う2か所を移動する暮らしが、そのまま商品の使われ方の実例になります。\n\nただ、2拠点生活は発表で語られた起用理由です。CMだけを見る人が知っているとは限らず、屋外から室内へ移る場面で寒暖差を見せて補うのではと想像します。\n\nもう一つ目を引くのは、広告を出す時期です。XShelterは2024年の発売から累計450万着を売り、需要に生産が追いつかず品薄が続いていました。品薄の間は、広告で需要を足しても買えない人が増えるだけです。生産体制の拡充が進んでから、初めてタレントを使った本格的な広告展開に入っています。"}, {"category": "体験", "title": "メモに書くように買い物を頼む。AmazonがAlexaをSMSに置いた", "work": "Alexa for Shopping のテキスト機能(招待制パイロット)", "client": "Amazon", "agency": "—", "production": "—", "award": "—", "oneliner": "SMSで買い物を頼めるAmazonのAI。広告も試験配信", "slug": "pg-customers-text-its-shopping-assistant", "no": 16, "date": "2026-11-07", "source_name": "Adweek", "source_url": "https://www.adweek.com/commerce/amazon-is-letting-customers-text-its-shopping-assistant/", "status": "published", "image": "https://static-www.adweek.com/wp-content/uploads/2026/11/iMessage.jpg?w=600&h=315&crop=1", "media_checked": true, "about": "Amazonが、AI買い物アシスタント「Alexa for Shopping」にテキストメッセージで依頼できる機能を、米国の一部の顧客向けに招待制で始めました。招待はSMSで届きます。商品探しからカート作成、購入、配送の連絡までをやり取りの中で進められ、その中で広告も試験的に表示されます。", "country": "米国", "points": "いちばんの特徴は、入口をメッセージにしたことです。Amazonのバイスプレジデントは、人は必要なものを思いついた瞬間に、メモやメッセージ、グループチャットへ書き留めると話しています。買い物の依頼を、その書き込みと同じ形で送れるようにしたわけです。招待もSMSで届くため、案内から利用までが同じメッセージの中で完結します。\n\n広告は、このやり取りの中に置かれます。依頼は文章で届くので、何を探している人なのかが一文でわかる状態で広告を出せます。条件がそのまま文面に書かれているからです。当面はこの枠に掲載料をかけない方針です。\n\nただ、返事のすぐ隣に広告が並ぶと、どこまでが返事で、どこからが広告なのかが曖昧になります。その線引きは、作り手が最後まで迷う判断だったのではと想像します。\n\nCEOのAndy Jassyは、Alexa for Shoppingの利用者は非利用者より支出が50%多いと述べています。"}, {"category": "体験", "title": "花言葉を介して、野菜が文学を演じる。やさい文学", "work": "やさい文学", "client": "クボタ", "agency": "博報堂", "production": "—", "award": "第5回ACCヤングコンペ グランプリ", "oneliner": "野菜の花言葉で文学を再現する、カフェのメニュー企画", "note": "", "slug": "pm-20261109-article561086-utm-source-feed", "no": 17, "date": "2026-11-09", "source_name": "AdverTimes.", "source_url": "https://www.advertimes.com/20261109/article561086/?utm_source=feed", "status": "published", "image": "https://cdn.advertimes.com/wp-content/uploads/2026/10/omoshiro-ad-20_yamaoka_ogp.jpg", "media_checked": true, "country": "日本", "about": "野菜の花言葉をもとに、さまざまな文学作品を野菜料理で再現する企画です。博報堂のチームがACCヤングコンペに提案し、KUBOTA AGRI FRONT CAFEのオリジナルメニューとして実現しました。『走れメロス』を再現したスープカレーなどがあります。第5回ACCヤングコンペでグランプリを受賞しています。", "points": "この企画の軸は、野菜と文学のあいだに花言葉を置いたことです。野菜と小説には本来つながりがありませんが、花言葉という共通の手がかりがあれば、一本の野菜が特定の物語の意味を背負えるようになります。味や見た目から無理に作品へ結びつけるのではなく、野菜が持つ意味から作品を選ぶため、組み合わせに理由が生まれます。\n\nただ、花言葉は皿からは見えません。食べる人にどこまで添えるかは、メニューの説明で作り手が迷う判断だったのではと想像します。\n\nもう一つは、その組み合わせを実際に食べられる一皿にしていることです。『走れメロス』ならスープカレーというように、一作品が一皿に対応します。文学を料理にたとえて語るだけなら言葉遊びで終わりますが、メニューとして出せば、作品名と料理を見比べながら食べられます。\n\n提案書の上のアイデアが、カフェのオリジナルメニューとして開発される段階まで進んでおり、広告の企画が商品そのものになっています。"}, {"category": "体験", "title": "盗まれた直後の駆け込み先は、街のPOS端末だった。BCPのSOS POS", "work": "SOS POS", "client": "BCP（Banco de Crédito del Perú）", "agency": "Circus Grey, Lima", "production": "—", "award": "Cannes Lions 2026 Creative Data Lions グランプリ", "oneliner": "スマホ盗難の被害者が、POS端末で口座を止められる仕組み", "slug": "pvity-announces-lion-winners-on-day-three", "no": 18, "date": "2026-11-09", "source_name": "Cannes Lions", "source_url": "https://www.canneslions.com/news/cannes-lions-international-festival-of-creativity-announces-lion-winners-on-day-three", "status": "published", "image": "https://images.ctfassets.net/vjs6vfoxg7y6/4opCcrk7JYjMCKvmvacrmm/260c0f614f4f5c17ebba85ea5eab3fe6/Open_Graph_Image_home.png", "gallery": ["https://images.ctfassets.net/vjs6vfoxg7y6/4vUHr6p8gyBVFocrNdDaQi/60c4d78fc1ea8a8fec0b9a80b0b576a6/Winners_1_-_Hero.png?w=1920&q=75&fm=webp"], "media_checked": true, "about": "ペルーの銀行BCPが、スマートフォンを盗まれた人に向けて用意した仕組みです。ふだんの支払いに使われるPOS端末を、銀行口座をその場で止める窓口に変えました。ペルー国内で3,400万人以上に届いています。2026年のカンヌライオンズでグランプリを受賞しています。", "country": "ペルー", "points": "この施策の要点は、新しい場所をつくらなかったことです。口座を止める手段として選ばれたのは、すでに街じゅうにあるPOS端末でした。専用の機械や窓口を増やす場合と違い、利用者は「どこに行けばいいか」を新たに覚える必要がありません。支払いのたびに目にしてきた端末が、そのまま助けを求める場所に変わります。\n\nもう一つは、使われる場面の切実さです。スマートフォンを盗まれた直後は、アプリなど普段の手段が手元になく、口座をすぐに守りたい状況です。ただ、手順は短いほど助かる一方、口座を止める操作は他人に使われても困ります。そのさじ加減は、作り手が迷う判断だったのではと想像します。"}]</script>
<script>
const POSTS = JSON.parse(document.getElementById('data').textContent).sort((a,b)=>b.no-a.no);
const COLORS = {'映像':'#28323F','SNS':'#7A3B2E','ブランディング':'#34503A','体験':'#4B3F6B','広告':'#222222','コピー':'#7A5214','パッケージ':'#6B3F5C','デザイン':'#244F66','ロゴ':'#4A4A3A'};
const color = c => COLORS[c] || '#333333';
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const no3 = n => 'No.' + String(n).padStart(3,'0');
const dash = v => v && v !== '—' ? v : '';
let saved = [];
try { saved = JSON.parse(localStorage.getItem('kaibo-saved') || '[]'); } catch(e) {}
const persist = () => { try { localStorage.setItem('kaibo-saved', JSON.stringify(saved)); } catch(e) {} };
let cat = 'すべて', mode = 'home';
const app = document.getElementById('app');
const bm = on => `<svg width="20" height="20" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
const PLAY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
const noimg = "this.parentNode.classList.add('noimg');this.parentNode.style.background=this.dataset.c;this.remove()";
const meta = p => [dash(p.client), dash(p.country) && p.country !== '日本' ? p.country : '', p.category].filter(Boolean).map(esc).join('　');

function pins(list){
  if(!list.length) return '<div class="empty">保存した記事はまだありません。<br>記事ページのしおりボタンで保存できます。</div>';
  return '<div class="mason">' + list.map(p => {
    const ph = p.image
      ? `<div class="ph"><img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-c="${color(p.category)}" onerror="${noimg}"><span class="txt">${esc(p.oneliner)}</span>`
      : `<div class="ph noimg" style="background:${color(p.category)}"><span class="txt">${esc(p.oneliner)}</span>`;
    return `<a class="pin" href="#/p/${esc(p.slug)}">${ph}<span class="no">${no3(p.no)}</span>${p.videos&&p.videos.length?`<span class="vid" aria-label="動画あり">${PLAY}</span>`:''}</div><div class="t">${esc(p.title)}</div><div class="m">${meta(p)}</div></a>`;
  }).join('') + '</div>';
}

function renderCats(){
  const cats = ['すべて', ...new Set(POSTS.map(p=>p.category))];
  const html = cats.map(c=>`<button class="cat${mode==='home'&&c===cat?' on':''}" data-c="${esc(c)}" aria-pressed="${mode==='home'&&c===cat}">${esc(c)}</button>`).join('');
  ['cats-d','cats-m'].forEach(id => {
    const el = document.getElementById(id); el.innerHTML = html;
    el.querySelectorAll('.cat').forEach(b => b.onclick = () => { cat = b.dataset.c; mode = 'home'; go(''); });
  });
  const sv = document.getElementById('nav-saved');
  sv.classList.toggle('on', mode==='saved'); sv.setAttribute('aria-pressed', mode==='saved');
}

function home(){
  if(mode==='saved'){
    const list = POSTS.filter(p=>saved.includes(p.slug));
    app.innerHTML = `<div class="lead"><h1>保存した解剖</h1><small>${list.length} 本</small></div>` + pins(list);
    return;
  }
  const list = POSTS.filter(p=>cat==='すべて'||p.category===cat);
  app.innerHTML = `<div class="lead"><h1>${cat==='すべて'?'新着の解剖':esc(cat)}</h1><small>${list.length} 本</small></div>` + pins(list);
}

function videoFrame(v){
  const src = v.type === 'vimeo'
    ? `https://player.vimeo.com/video/${encodeURIComponent(v.id)}?dnt=1`
    : `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?rel=0`;
  return `<div class="video"><iframe src="${src}" title="作品の動画" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
}

/* ---------- その場で編集（この端末にGitHubの鍵が登録されている時だけ表示） ---------- */
const PIN_HASH = 'e8026bda3ea2eedc7dc7bce9daa640f8cc0f33e335bd73d986a872b3ba789c71';
const CATS = ['映像','SNS','ブランディング','体験','広告','コピー','パッケージ','デザイン','ロゴ'];

const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/posts.json`;
const ls = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch(e) { return null; } };
const canEdit = () => !!ls('kaibooom-token');
let editing = false;
const PEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>';
const E = f => editing ? ` data-f="${f}" contenteditable="true" spellcheck="false"` : '';
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function fromB64(b64){ const bin = atob(b64.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function toB64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(bin); }
const gh = () => ({ 'Authorization': 'Bearer ' + ls('kaibooom-token'), 'Accept': 'application/vnd.github+json' });

function post(slug){
  const p = POSTS.find(x=>x.slug===slug);
  if(!p){ editing=false; go(''); return; }
  const on = saved.includes(p.slug);
  const editBtn = canEdit() && !editing ? `<button class="edit-btn" id="edit-start">${PEN}編集</button>` : '';
  const vids = (p.videos||[]).map(videoFrame).join('');
  const gal = (p.gallery||[]).length ? `<div class="gal">${p.gallery.map(g=>`<a href="${esc(g)}" target="_blank" rel="noopener"><img src="${esc(g)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>`).join('')}</div>` : '';
  const cover = p.image
    ? `<div class="cover"><img src="${esc(p.image)}" alt="${esc(p.work)}" referrerpolicy="no-referrer" data-c="${color(p.category)}" onerror="this.parentNode.classList.add('noimg');this.parentNode.style.background=this.dataset.c;this.parentNode.textContent=${esc(JSON.stringify(p.work))}"></div>`
    : `<div class="cover noimg" style="background:${color(p.category)}">${esc(p.work)}</div>`;
  const hasMedia = p.image || vids || gal;
  const about = p.about || editing ? `<section class="about"><h2>なんの広告？</h2><p${E('about')}>${esc(p.about)}</p></section>` : '';
  const paras = t => esc(t).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g,'<br>')}</p>`).join('');
  const body = p.points
    ? about + `<section class="sec pts"><h2>アイデア、ポイント</h2>` + (editing ? `<div class="pts-edit"${E('points')}>${esc(p.points)}</div>` : paras(p.points)) + `</section>`
    : about +
      `<section class="sec"><h2>解剖</h2><ol class="steps">${(p.steps||[]).map((s,i)=>`<li class="step"><span class="num">${i+1}</span><div><h3>${esc(s.title)}</h3><p${E('s'+i)}>${esc(s.body)}</p></div></li>`).join('')}</ol></section>` +
      `<section class="sec steal"><h2>ここを盗め</h2><p${E('steal')}>${esc(p.steal)}</p></section>` +
      `<section class="task"><h2>やってみよう</h2><p${E('challenge')}>${esc(p.challenge)}</p></section>`;
  const credit = [['作品','work'],['広告主','client'],['広告会社','agency'],['制作','production'],['受賞','award']]
    .filter(([,k]) => editing || dash(p[k])).map(([l,k]) => `<dt>${l}</dt><dd${E(k)}>${esc(p[k])}</dd>`).join('');
  const more = POSTS.filter(x => x.slug !== p.slug && x.category === p.category).slice(0, 10);
  const others = more.length >= 4 ? more : POSTS.filter(x => x.slug !== p.slug).slice(0, 10);
  app.innerHTML =
    `<div class="art"><div class="bar"><button class="ib" aria-label="一覧に戻る" onclick="history.length>1?history.back():go('')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="n">${no3(p.no)}</span><span class="sp"></span>${editBtn}</div>` +
    `<div class="wrap${editing?' editing':''}"><div class="media">${cover}${vids}${gal}` +
    (hasMedia ? `<div class="credit-img">写真・動画：<a href="${esc(p.source_url)}" target="_blank" rel="noopener">${esc(p.source_name)}</a>ほか公式より</div>` : '') +
    `</div><article class="txtcol">` +
    `<div class="k">${meta(p)}</div><h1${E('title')}>${esc(p.title)}</h1>` +
    `<p class="one"${E('oneliner')}>${esc(p.oneliner)}</p>` +
    body +
    `<div class="actions"><a class="go" href="${esc(p.source_url)}" target="_blank" rel="noopener">元の記事を読む（${esc(p.source_name)}）</a><button class="save" id="save" aria-label="${on?'保存を外す':'保存する'}" aria-pressed="${on}">${bm(on)}</button></div>` +
    `<dl class="credit">${credit}</dl>` +
    `<div class="note">作品の著作権は各権利者に帰属します。本記事は批評・解説を目的としています。</div></article></div>` +
    (editing ? '' : `<section class="more"><div class="lead"><h1>ほかの解剖</h1></div>${pins(others)}</section>`) + `</div>` +
    (editing ? `<div class="edit-bar" role="region" aria-label="編集"><div class="eb-in">
      <div class="eb-row"><span class="eb-hint">${PEN}点線の文字をタップして直せます</span></div>
      <div class="eb-row">
        <label class="eb-l">カテゴリ <select id="eb-cat">${[...new Set([...CATS, p.category])].map(c=>`<option${c===p.category?' selected':''}>${esc(c)}</option>`).join('')}</select></label>
        <label class="eb-l"><input type="checkbox" id="eb-hide"> 非公開にする</label>
        <span style="flex-grow:1"></span>
        <button class="eb-btn" id="eb-cancel">やめる</button><button class="eb-btn primary" id="eb-save">保存する</button>
      </div>
      <div class="eb-msg" id="eb-msg" role="status"></div></div></div>` : '');
  document.getElementById('save').onclick = () => {
    saved = saved.includes(p.slug) ? saved.filter(s=>s!==p.slug) : [...saved, p.slug];
    persist(); post(slug);
  };
  const st = document.getElementById('edit-start');
  if (st) st.onclick = () => startEdit(slug);
  if (editing) {
    app.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && !['s0','s1','s2','steal','challenge','about','points'].includes(el.dataset.f)) e.preventDefault(); });
    });
    document.getElementById('eb-cancel').onclick = () => { editing = false; post(slug); };
    document.getElementById('eb-save').onclick = () => saveEdit(p);
  }
}

function startEdit(slug){
  if (ss('kaibooom-unlocked') === '1') { editing = true; post(slug); return; }
  const bar = document.querySelector('.bar');
  if (document.getElementById('pin-box')) return;
  bar.insertAdjacentHTML('afterend', `<div class="pin-box" id="pin-box"><label for="pin-in">合鍵</label><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><button class="eb-btn primary" id="pin-ok">ひらく</button><span class="eb-msg" id="pin-msg" role="alert"></span></div>`);
  const input = document.getElementById('pin-in'); input.focus();
  const go = async () => {
    if (await sha256(input.value) !== PIN_HASH) { document.getElementById('pin-msg').textContent = '合鍵がちがいます'; input.select(); return; }
    ss('kaibooom-unlocked', '1'); editing = true; post(slug);
  };
  document.getElementById('pin-ok').onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function saveEdit(p){
  const btn = document.getElementById('eb-save'), m = document.getElementById('eb-msg');
  const val = f => { const el = app.querySelector(`[data-f="${f}"]`); return el ? el.innerText.replace(/ /g,' ').trim() : ''; };
  const edits = { title: val('title'), oneliner: val('oneliner'), about: val('about'), points: val('points').replace(/\n{3,}/g,'\n\n'), steal: val('steal'), challenge: val('challenge'),
    work: val('work'), client: val('client'), agency: val('agency'), production: val('production'), award: val('award'),
    category: document.getElementById('eb-cat').value, bodies: [0,1,2].map(i => val('s'+i)), hide: document.getElementById('eb-hide').checked };
  btn.disabled = true; m.className = 'eb-msg'; m.textContent = '保存中…';
  try {
    const r = await fetch(API + '?t=' + Date.now(), { headers: gh(), cache: 'no-store' });
    if (r.status === 401 || r.status === 403) throw new Error('GitHubの鍵が使えませんでした。管理ページで登録し直してください。');
    if (!r.ok) throw new Error('読み込みに失敗しました（' + r.status + '）');
    const j = await r.json(); const all = JSON.parse(fromB64(j.content));
    const t = all.find(x => x.slug === p.slug); if (!t) throw new Error('この記事が見つかりませんでした');
    ['title','oneliner','work','client','agency','production','award','category'].forEach(k => t[k] = edits[k]);
    if (edits.about || t.about) t.about = edits.about;
    if (t.points) { if (edits.points) t.points = edits.points; }
    else { t.steal = edits.steal; t.challenge = edits.challenge;
      t.steps = [0,1,2].map(i => ({ title: (t.steps && t.steps[i] && t.steps[i].title) || ['課題','狙い','表現のしかけ'][i], body: edits.bodies[i] })); }
    t.status = edits.hide ? 'hidden' : 'published';
    const put = await fetch(API, { method: 'PUT', headers: { ...gh(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `edit: No.${t.no} をサイト上で編集`, content: toB64(JSON.stringify(all, null, 2) + '\n'), sha: j.sha }) });
    if (put.status === 409) throw new Error('ちょうど自動更新と重なりました。もう一度「保存する」を押してください。');
    if (!put.ok) throw new Error('保存に失敗しました（' + put.status + '）');
    Object.assign(p, t);  // この画面にもすぐ反映
    editing = false;
    if (edits.hide) { POSTS.splice(POSTS.indexOf(p), 1); location.hash = ''; return; }
    post(p.slug);
    document.querySelector('.bar').insertAdjacentHTML('afterend', '<div class="saved-note" role="status">保存しました。公開中のサイトには1〜2分で反映されます。</div>');
  } catch(e) { m.className = 'eb-msg ng'; m.textContent = e.message; btn.disabled = false; }
}

let lastScroll = 0;
function go(hash){ if (location.hash.replace(/^#/,'') === hash) route(); else location.hash = hash; }
function route(){
  editing = false;
  const m = location.hash.match(/^#\/p\/(.+)$/);
  if (m) { if (!app.querySelector('.art')) lastScroll = window.scrollY; post(decodeURIComponent(m[1])); window.scrollTo(0,0); }
  else { home(); window.scrollTo(0, lastScroll); lastScroll = 0; }
  renderCats();
}
document.getElementById('home-link').onclick = e => { e.preventDefault(); cat='すべて'; mode='home'; lastScroll=0; go(''); };
document.getElementById('nav-saved').onclick = () => { mode = mode==='saved' ? 'home' : 'saved'; lastScroll=0; go(''); };
window.addEventListener('hashchange', route);
route();
</script>
