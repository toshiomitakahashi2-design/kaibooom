<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIBOOOM 広告解剖</title>
<meta name="description" content="すぐれた広告・クリエイティブ・デザインを、プロの目で解剖するメディア。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#161616; --sub:#5C5A55; --body:#3A3833;
  --line:#E4E1DA; --chip-line:#D6D2C9; --invert-bg:#161616; --invert-ink:#F7F6F3;
  --accent:#E2462F; --accent-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --card:#1C1C1B; --ink:#F2F0EC; --sub:#A8A49C; --body:#D6D2CA;
    --line:#2C2B29; --chip-line:#3A3936; --invert-bg:#F2F0EC; --invert-ink:#121212;
    --accent:#E2462F; --accent-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1C1C1B; --ink:#F2F0EC; --sub:#A8A49C; --body:#D6D2CA;
  --line:#2C2B29; --chip-line:#3A3936; --invert-bg:#F2F0EC; --invert-ink:#121212;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px}
.logo{font-family:'Outfit',sans-serif;font-weight:600;font-size:30px;letter-spacing:.01em;line-height:1}
.logo .r{color:#E2462F}.logo .b{color:#2F6BFF}.logo .y{color:#E5A000}.logo .g{color:#2E9E5B}
.tag{font-size:11px;color:var(--sub);letter-spacing:.08em;margin-top:4px}
.chips{display:flex;gap:8px;padding:8px 16px 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--chip-line)}
.chip.on{background:var(--invert-bg);color:var(--invert-ink);border-color:var(--invert-bg)}
.hero{margin:0 16px 18px;border-radius:14px;background:var(--invert-bg);color:var(--invert-ink);overflow:hidden;display:block}
.hero .band{height:150px;background:var(--accent);display:flex;align-items:flex-end;justify-content:space-between;padding:14px}
.pill{font-size:12px;font-weight:700;background:#161616;color:#F7F6F3;padding:4px 10px;border-radius:99px}
.hero .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;color:#FFFFFF;line-height:1}
.hero .meta{padding:14px 16px 16px}
.hero .cat{font-size:11px;opacity:.75}
.hero .ttl{font-size:18px;font-weight:900;line-height:1.5;margin-top:4px}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 10px}
.sec b{font-size:15px;font-weight:900}
.sec small{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.tile{aspect-ratio:1/1;color:#FFFFFF;padding:10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile .n{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700}
.tile .t{font-size:12px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .c{font-size:10px;opacity:.8}
.tile,.cover,.hero .band{position:relative}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.05) 55%);z-index:0}
.tile>span,.cover>span,.hero .band>span{position:relative;z-index:1}
.has-img .t{display:none}
.credit-img{padding:6px 16px 0;font-size:11px;color:var(--sub)}
.empty{padding:40px 16px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
.nav button{height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--sub)}
.nav button.on{color:var(--ink);font-weight:700}
.bar{display:flex;align-items:center;gap:4px;padding:10px 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent}
.bar .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.cover{aspect-ratio:1/1;color:#FFFFFF;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.cover .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;line-height:1}
.cover .w{font-size:15px;font-weight:700;line-height:1.6}
.actions{display:flex;gap:8px;padding:12px 16px}
.go{flex-grow:1;min-height:44px;border-radius:10px;background:var(--invert-bg);color:var(--invert-ink);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:0 12px;text-align:center}
.save{width:44px;height:44px;border-radius:10px;border:1px solid var(--chip-line);background:var(--card);display:flex;align-items:center;justify-content:center}
.head{padding:8px 16px 0}
.head .k{font-size:12px;color:var(--sub);line-height:1.6}
.head h1{margin:6px 0 0;font-size:22px;font-weight:900;line-height:1.5}
.one{margin:18px 16px 0;padding:14px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.one small{font-size:11px;font-weight:700;letter-spacing:.1em}
.one p{margin:4px 0 0;font-size:16px;font-weight:700;line-height:1.6}
.steps{padding:24px 16px 0;display:flex;flex-direction:column;gap:16px}
.steps>b{font-size:15px;font-weight:900}
.step{display:flex;gap:12px}
.num{flex-shrink:0;width:32px;height:32px;border-radius:99px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px}
.step h3{margin:5px 0 4px;font-size:14px;font-weight:700}
.step p{margin:0;font-size:14px;line-height:1.85;color:var(--body)}
.box{margin:24px 16px 0;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.box b{font-size:15px;font-weight:900}
.box p{margin:8px 0 0;font-size:14px;line-height:1.85;color:var(--body)}
.task{margin:14px 16px 0;padding:16px;border-radius:12px;background:var(--invert-bg);color:var(--invert-ink)}
.task b{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.task p{margin:10px 0 0;font-size:14px;line-height:1.85}
.credit{margin:24px 16px 0;font-size:12px;color:var(--sub);line-height:1.9;border-top:1px solid var(--line);padding-top:14px}
.credit dt{float:left;width:6em;clear:left}
.credit dd{margin:0 0 0 6em}
.note{padding:18px 16px 8px;font-size:11px;color:var(--sub);line-height:1.7}
.nav-logo{display:none}
.nav-admin{display:none}
.edit-btn{margin-left:auto;margin-right:8px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--chip-line);background:var(--card);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.pin-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 16px 12px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.pin-box input{width:110px;font-size:18px;letter-spacing:.3em;padding:6px 10px;border-radius:8px;border:1px solid var(--chip-line);background:var(--bg);color:var(--ink)}
.editing [contenteditable]{outline:1.5px dashed #2F6BFF;outline-offset:3px;border-radius:4px;cursor:text;min-height:1.4em}
.editing [contenteditable]:focus{outline-style:solid;background:rgba(47,107,255,.08)}
.editing .one [contenteditable],.editing .task [contenteditable]{outline-color:currentColor}
.editing{margin-bottom:150px}
.edit-bar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:5;background:var(--card);border-top:2px solid #2F6BFF;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.eb-in{max-width:935px;margin:0 auto;padding:10px 16px}
.eb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eb-row+.eb-row{margin-top:8px}
.eb-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:#2F6BFF;font-weight:700}
.eb-l{font-size:13px;display:flex;align-items:center;gap:6px}
.eb-l select{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--chip-line);background:var(--bg);color:var(--ink)}
.eb-l input{width:18px;height:18px}
.eb-btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--chip-line);background:var(--card);font-size:14px;font-weight:700}
.eb-btn.primary{background:var(--invert-bg);color:var(--invert-ink);border-color:var(--invert-bg)}
.eb-btn:disabled{opacity:.5}
.eb-msg{font-size:13px;margin-top:4px;min-height:1em}
.eb-msg.ng,#pin-msg{color:#B42318}
.saved-note{margin:0 16px 12px;padding:10px 14px;border-radius:10px;background:#E7F5EC;color:#14532D;font-size:13px;font-weight:700}
.admin-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub);border-radius:10px}
.admin-btn:hover{color:var(--ink);background:var(--card)}
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:244px;border-top:0;border-right:1px solid var(--line)}
  .nav .in{display:flex;flex-direction:column;gap:4px;padding:28px 12px;max-width:none;height:100%}
  .nav-logo{display:block;padding:8px 12px 32px}
  .nav-logo .logo{font-size:30px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:16px;height:52px;padding:0 12px;border-radius:10px;font-size:15px}
  .nav button:hover,.nav-admin:hover{background:var(--bg)}
  .nav-admin{display:flex;align-items:center;gap:16px;height:52px;padding:0 12px;border-radius:10px;font-size:15px;color:var(--sub);margin-top:auto}
  .app{max-width:none;margin:0 0 0 244px;padding:36px 40px 60px}
  .app>*{width:100%;max-width:935px;margin-left:auto;margin-right:auto}
  .top{display:none}
  .chips{padding:0 0 24px;flex-wrap:wrap}
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:0 auto 36px;border-radius:12px}
  .hero .band{height:auto;min-height:300px;padding:20px}
  .hero .meta{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:8px}
  .hero .cat{font-size:13px}
  .hero .ttl{font-size:26px;line-height:1.5}
  .hero .big{font-size:64px}
  .sec{padding:0 0 14px;border-top:1px solid var(--line);padding-top:20px}
  .grid{gap:4px}
  .tile{padding:16px}
  .tile .n{font-size:14px}
  .tile .t{font-size:16px}
  .tile .c{font-size:12px}
  .bar{position:static;padding:0 0 12px}
  .app>.edit-bar{left:244px;right:0;bottom:0;width:auto;max-width:none;margin:0}
  .pin-box,.saved-note{margin-left:0;margin-right:0}
  .pw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);align-items:start}
  .pl{position:sticky;top:0}
  .pl .credit-img{padding:8px 16px 12px}
  .pr{padding:8px 0 16px;border-left:1px solid var(--line)}
  .pr .one,.pr .box,.pr .task{margin-left:20px;margin-right:20px}
  .pr .actions,.pr .head,.pr .steps,.pr .note{padding-left:20px;padding-right:20px}
  .pr .credit{margin-left:20px;margin-right:20px}
  .pr .box{background:var(--bg)}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" aria-label="メインメニュー"><div class="in">
  <div class="nav-logo"><div class="logo" aria-label="KAIBOOOM"><span class="b">K</span><span class="r">A</span><span class="y">I</span><span class="b">B</span><span class="g">O</span><span class="r">O</span><span class="y">O</span><span class="g">M</span></div><div class="tag">広告を、解剖する。</div></div>
  <button id="nav-home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button id="nav-saved"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>保存</button>
  <a class="nav-admin" href="./admin.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>管理ページ</a>
</div></nav>
<script id="data" type="application/json">__POSTS__</script>
<script>
const POSTS = JSON.parse(document.getElementById('data').textContent).sort((a,b)=>b.no-a.no);
const COLORS = {'映像':'#2F4858','SNS':'#8C3B2E','ブランディング':'#3E5C3A','体験':'#5A4A78','広告':'#1F1F1F','コピー':'#8A5410','パッケージ':'#6B3F5C','デザイン':'#2E5266','ロゴ':'#4A4A3A'};
const color = c => COLORS[c] || '#3D3D3D';
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const no3 = n => 'No.' + String(n).padStart(3,'0');
let saved = [];
try { saved = JSON.parse(localStorage.getItem('kaibo-saved') || '[]'); } catch(e) {}
const persist = () => { try { localStorage.setItem('kaibo-saved', JSON.stringify(saved)); } catch(e) {} };
let cat = 'すべて';
const app = document.getElementById('app');
const img = p => p.image ? `<img class="ph" src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : '';
const hi = p => p.image ? ' has-img' : '';
const GEAR = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const bm = on => `<svg width="20" height="20" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;

function tiles(list){
  if(!list.length) return '<div class="empty">まだここには記事がありません。<br>気になる記事を保存してみよう。</div>';
  return '<div class="grid">' + list.map(p=>`<a class="tile${hi(p)}" href="#/p/${esc(p.slug)}" style="background:${color(p.category)}">${img(p)}<span class="n">${no3(p.no)}</span><span class="t">${esc(p.oneliner)}</span><span class="c">${esc(p.category)}</span></a>`).join('') + '</div>';
}

function home(mode){
  const cats = ['すべて', ...new Set(POSTS.map(p=>p.category))];
  const top = `<header class="top"><div><div class="logo" aria-label="KAIBOOOM"><span class="b">K</span><span class="r">A</span><span class="y">I</span><span class="b">B</span><span class="g">O</span><span class="r">O</span><span class="y">O</span><span class="g">M</span></div><div class="tag">広告を、解剖する。</div></div><a class="admin-btn" href="./admin.html" aria-label="管理ページ">${GEAR}</a></header>`;
  if(mode==='saved'){
    const list = POSTS.filter(p=>saved.includes(p.slug));
    app.innerHTML = top + `<div class="sec"><b>保存した解剖</b><small>${list.length} 本</small></div>` + tiles(list);
    return;
  }
  const list = POSTS.filter(p=>cat==='すべて'||p.category===cat);
  const f = POSTS[0];
  app.innerHTML = top +
    `<div class="chips" role="group" aria-label="カテゴリ">${cats.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('')}</div>` +
    (cat==='すべて' && f ? `<a class="hero" href="#/p/${esc(f.slug)}"><div class="band${hi(f)}">${img(f)}<span class="pill">今週の解剖</span><span class="big">${no3(f.no).replace('No.','')}</span></div><div class="meta"><div class="cat">${esc(f.category)} ／ ${esc(f.client)}</div><div class="ttl">${esc(f.title)}</div></div></a>` : '') +
    `<div class="sec"><b>${cat==='すべて'?'新着の解剖':esc(cat)}</b><small>全 ${list.length} 本</small></div>` + tiles(list);
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;home();});
}

/* ---------- その場で編集（この端末にGitHubの鍵が登録されている時だけ表示） ---------- */
const PIN_HASH = 'e8026bda3ea2eedc7dc7bce9daa640f8cc0f33e335bd73d986a872b3ba789c71';
const CATS = ['映像','SNS','ブランディング','体験','広告','コピー','パッケージ','デザイン','ロゴ'];
const OWNER = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : 'toshiomitakahashi2-design';
const REPO = (location.hostname.endsWith('.github.io') && location.pathname.split('/').filter(Boolean)[0]) || 'kaibooom';
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/posts.json`;
const ls = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch(e) { return null; } };
const canEdit = () => !!ls('kaibooom-token');
let editing = false;
const PEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>';
const E = f => editing ? ` data-f="${f}" contenteditable="true" spellcheck="false"` : '';
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function fromB64(b64){ const bin = atob(b64.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function toB64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(bin); }
const gh = () => ({ 'Authorization': 'Bearer ' + ls('kaibooom-token'), 'Accept': 'application/vnd.github+json' });

function post(slug){
  const p = POSTS.find(x=>x.slug===slug);
  if(!p){ editing=false; location.hash=''; return; }
  const on = saved.includes(p.slug);
  const editBtn = canEdit() && !editing ? `<button class="edit-btn" id="edit-start">${PEN}編集</button>` : '';
  app.innerHTML =
    `<div class="bar"><button class="back" aria-label="フィードに戻る" onclick="history.length>1?history.back():location.hash=''"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="n">${no3(p.no)}</span>${editBtn}</div>` +
    `<div class="pw${editing?' editing':''}"><div class="pl"><div class="cover${hi(p)}" style="background:${color(p.category)}">${img(p)}<span class="big">${no3(p.no).replace('No.','')}</span><span class="w">${esc(p.work)}</span></div>` +
    (p.image ? `<div class="credit-img">画像：<a href="${esc(p.source_url)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(p.source_name)}</a>より</div>` : '') +
    `</div><div class="pr"><div class="actions"><a class="go" href="${esc(p.source_url)}" target="_blank" rel="noopener">作品の紹介記事を見る <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a><button class="save" id="save" aria-label="保存" aria-pressed="${on}">${bm(on)}</button></div>` +
    `<div class="head"><div class="k">${esc(p.category)} ／ ${esc(p.client)}</div><h1${E('title')}>${esc(p.title)}</h1></div>` +
    `<div class="one"><small>ひとことで言うと</small><p${E('oneliner')}>${esc(p.oneliner)}</p></div>` +
    `<div class="steps"><b>解剖</b>${p.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><h3>${esc(s.title)}</h3><p${E('s'+i)}>${esc(s.body)}</p></div></div>`).join('')}</div>` +
    `<div class="box"><b>ここを盗め</b><p${E('steal')}>${esc(p.steal)}</p></div>` +
    `<div class="task"><b><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>やってみよう</b><p${E('challenge')}>${esc(p.challenge)}</p></div>` +
    `<dl class="credit"><dt>作品</dt><dd${E('work')}>${esc(p.work)}</dd><dt>広告主</dt><dd${E('client')}>${esc(p.client)}</dd><dt>広告会社</dt><dd${E('agency')}>${esc(p.agency)}</dd><dt>制作</dt><dd${E('production')}>${esc(p.production)}</dd><dt>受賞</dt><dd${E('award')}>${esc(p.award)}</dd><dt>出典</dt><dd><a href="${esc(p.source_url)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(p.source_name)}</a></dd></dl>` +
    `<div class="note">作品の著作権は各権利者に帰属します。本記事は批評・解説を目的としています。</div></div></div>` +
    (editing ? `<div class="edit-bar" role="region" aria-label="編集"><div class="eb-in">
      <div class="eb-row"><span class="eb-hint">${PEN}点線の文字をタップして直せます</span></div>
      <div class="eb-row">
        <label class="eb-l">カテゴリ <select id="eb-cat">${[...new Set([...CATS, p.category])].map(c=>`<option${c===p.category?' selected':''}>${esc(c)}</option>`).join('')}</select></label>
        <label class="eb-l"><input type="checkbox" id="eb-hide"> 非公開にする</label>
        <span style="flex-grow:1"></span>
        <button class="eb-btn" id="eb-cancel">やめる</button><button class="eb-btn primary" id="eb-save">保存する</button>
      </div>
      <div class="eb-msg" id="eb-msg" role="status"></div></div></div>` : '');
  document.getElementById('save').onclick = () => {
    saved = saved.includes(p.slug) ? saved.filter(s=>s!==p.slug) : [...saved, p.slug];
    persist(); post(slug);
  };
  const st = document.getElementById('edit-start');
  if (st) st.onclick = () => startEdit(slug);
  if (editing) {
    app.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && !['s0','s1','s2','steal','challenge'].includes(el.dataset.f)) e.preventDefault(); });
    });
    document.getElementById('eb-cancel').onclick = () => { editing = false; post(slug); };
    document.getElementById('eb-save').onclick = () => saveEdit(p);
  }
  if (!editing) window.scrollTo(0,0);
}

function startEdit(slug){
  if (ss('kaibooom-unlocked') === '1') { editing = true; post(slug); return; }
  const bar = document.querySelector('.bar');
  if (document.getElementById('pin-box')) return;
  bar.insertAdjacentHTML('afterend', `<div class="pin-box" id="pin-box"><label for="pin-in">合鍵</label><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><button class="eb-btn primary" id="pin-ok">ひらく</button><span class="eb-msg" id="pin-msg" role="alert"></span></div>`);
  const input = document.getElementById('pin-in'); input.focus();
  const go = async () => {
    if (await sha256(input.value) !== PIN_HASH) { document.getElementById('pin-msg').textContent = '合鍵がちがいます'; input.select(); return; }
    ss('kaibooom-unlocked', '1'); editing = true; post(slug);
  };
  document.getElementById('pin-ok').onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function saveEdit(p){
  const btn = document.getElementById('eb-save'), m = document.getElementById('eb-msg');
  const val = f => { const el = app.querySelector(`[data-f="${f}"]`); return el ? el.innerText.replace(/ /g,' ').trim() : ''; };
  const edits = { title: val('title'), oneliner: val('oneliner'), steal: val('steal'), challenge: val('challenge'),
    work: val('work'), client: val('client'), agency: val('agency'), production: val('production'), award: val('award'),
    category: document.getElementById('eb-cat').value, bodies: [0,1,2].map(i => val('s'+i)), hide: document.getElementById('eb-hide').checked };
  btn.disabled = true; m.className = 'eb-msg'; m.textContent = '保存中…';
  try {
    const r = await fetch(API + '?t=' + Date.now(), { headers: gh(), cache: 'no-store' });
    if (r.status === 401 || r.status === 403) throw new Error('GitHubの鍵が使えませんでした。管理ページで登録し直してください。');
    if (!r.ok) throw new Error('読み込みに失敗しました（' + r.status + '）');
    const j = await r.json(); const all = JSON.parse(fromB64(j.content));
    const t = all.find(x => x.slug === p.slug); if (!t) throw new Error('この記事が見つかりませんでした');
    ['title','oneliner','steal','challenge','work','client','agency','production','award','category'].forEach(k => t[k] = edits[k]);
    t.steps = [0,1,2].map(i => ({ title: (t.steps && t.steps[i] && t.steps[i].title) || ['課題','狙い','表現のしかけ'][i], body: edits.bodies[i] }));
    t.status = edits.hide ? 'hidden' : 'published';
    const put = await fetch(API, { method: 'PUT', headers: { ...gh(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `edit: No.${t.no} をサイト上で編集`, content: toB64(JSON.stringify(all, null, 2) + '\n'), sha: j.sha }) });
    if (put.status === 409) throw new Error('ちょうど自動更新と重なりました。もう一度「保存する」を押してください。');
    if (!put.ok) throw new Error('保存に失敗しました（' + put.status + '）');
    Object.assign(p, t);  // この画面にもすぐ反映
    editing = false;
    if (edits.hide) { POSTS.splice(POSTS.indexOf(p), 1); location.hash = ''; return; }
    post(p.slug);
    document.querySelector('.bar').insertAdjacentHTML('afterend', '<div class="saved-note" role="status">保存しました。公開中のサイトには1〜2分で反映されます。</div>');
  } catch(e) { m.className = 'eb-msg ng'; m.textContent = e.message; btn.disabled = false; }
}

let mode = 'home';
function route(){
  editing = false;
  const m = location.hash.match(/^#\/p\/(.+)$/);
  if(m) post(decodeURIComponent(m[1])); else home(mode);
  document.getElementById('nav-home').classList.toggle('on', !m && mode==='home');
  document.getElementById('nav-saved').classList.toggle('on', !m && mode==='saved');
}
document.getElementById('nav-home').onclick = () => { mode='home'; location.hash=''; route(); window.scrollTo(0,0); };
document.getElementById('nav-saved').onclick = () => { mode='saved'; location.hash=''; route(); window.scrollTo(0,0); };
window.addEventListener('hashchange', route);
route();
</script>
